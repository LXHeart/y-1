# 本地观测栈 Promtail：docker 服务发现收集本 compose 项目的容器 stdout。
# 行内容不做解析直接入库——本地开发是默认（人类可读）格式；生产 ECS JSON 由
# 部署侧收集器解析。service/container 标签经 relabel 注入，Grafana 按标签过滤。
server:
  http_listen_port: 9080

positions:
  # 持久卷（compose promtail_data）——容器重建不丢位置，避免整段历史回放。
  filename: /positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: grassland-docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        filters:
          - name: label
            values: ["com.docker.compose.project"]
    relabel_configs:
      # 只收本项目容器（compose project 名固定 y-1，见根目录目录名/默认 project 规则）。
      - source_labels: [__meta_docker_compose_project]
        regex: y-1
        action: keep
      # 标签名用 Loki 3.5 规范化后的 OTLP 约定名（service_name/container_name）——
      # 旧名 service/container 会在推送时被 Loki 3.4+ 的标签规范化改名丢弃，查询侧查不到。
      - source_labels: [__meta_docker_compose_service]
        target_label: service_name
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container_name
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream
    # 回放/积压的老日志在客户端丢弃：Loki 的 max_chunk_age/2 流内乱序防线会把整批
    # push 400（同批新鲜日志一并丢失），且该防线不可经 limits/ingester 配置放宽
    # （见 loki.yml 注释与 grafana/loki#5936）。本地栈只关心近期日志。
    pipeline_stages:
      - drop:
          older_than: 1h
          drop_counter_reason: "local_dev_recent_only"
