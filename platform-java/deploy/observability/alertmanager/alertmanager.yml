# Alertmanager 路由配置（GL-P3-PLATFORM-001）。
#
# Webhook URL 从挂载的 secret 文件读取，生产文件不得入库。

global:
  resolve_timeout: 5m

route:
  receiver: operations-webhook
  group_by: ['service', 'alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: operations-webhook
    webhook_configs:
      - url_file: /run/secrets/alertmanager_webhook_url
        send_resolved: true
