# 本地观测栈 Loki（单机开发配置，profile=observability）。
# 生产不跑本地 Loki——生产容器以 ECS JSON 输出到 stdout（见 docker-compose.production.yml
# 的 LOGGING_STRUCTURED_FORMAT_CONSOLE），由部署侧的日志收集器接管。
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2024-04-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # 容器重启补推旧日志时拒绝超过 7 天的样本，避免乱序污染索引。
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  # 注意：ingester 另有「落后流内最新 ~1h 的样本整批拒绝（entry too far behind）」的流内
  # 乱序防线——promtail 重建后回放长存活容器（38h+）的历史日志会触发整批 400（该窗口由
  # max_chunk_age 派生，但不接受 limits/ingester 层的此字段覆盖）。缓解 = promtail positions
  # 持久化卷（重建不整段回放）+ 冒烟断言用新建 obs 容器自身的日志（tempo 查询请求会打
  # 含 traceId 的 info 日志，天然是确定性触发；见 scripts/local-observability-smoke.sh）。
