global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: identity-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - identity-service:9082
  - job_name: marketplace-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - marketplace-service:9082
