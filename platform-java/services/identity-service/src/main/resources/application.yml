spring:
  application:
    name: identity-service
  r2dbc:
    url: ${LEGACY_DATABASE_R2DBC_URL:}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
        max.block.ms: 5000
        retries: 5
    # 通知中心消费方（Slice 12）：消费本服务 outbox topic 派生站内通知。
    # 默认不启用（测试/本地无 Kafka 时跳过，避免连接噪声）；compose 置 IDENTITY_NOTIFICATION_CONSUMER_ENABLED=true。
    consumer:
      group-id: ${IDENTITY_NOTIFICATION_CONSUMER_GROUP:identity-notification-consumer}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 1
  codec:
    max-in-memory-size: 256KB
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    properties:
      mail.smtp.ssl.enable: true
      # 信封发件人：QQ/163 等要求必须等于认证账号，故默认取 SMTP_USER 而非占位地址
      # （发占位地址会被服务器断连：MessagingException: Exception reading response）。
      mail.smtp.from: ${SMTP_FROM:${SMTP_USER:}}
      # 不设超时的话，SMTP 卡住会一直占住 boundedElastic 线程。
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  port: ${SERVER_PORT:8082}

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9082}
  endpoints:
    web:
      exposure:
        include: health,info

identity:
  legacy:
    session:
      cookie-name: ${SESSION_COOKIE_NAME:y1.sid}
      secret: ${SESSION_SECRET:}
  outbox:
    topic: ${IDENTITY_OUTBOX_TOPIC:grassland.identity.events}
    enabled: ${IDENTITY_OUTBOX_ENABLED:true}
    poll-interval-ms: ${IDENTITY_OUTBOX_POLL_INTERVAL_MS:2000}
    batch-size: ${IDENTITY_OUTBOX_BATCH_SIZE:50}
    max-concurrency: ${IDENTITY_OUTBOX_MAX_CONCURRENCY:8}
    ack-timeout-ms: ${IDENTITY_OUTBOX_ACK_TIMEOUT_MS:10000}
    claim-lease-ms: ${IDENTITY_OUTBOX_CLAIM_LEASE_MS:300000}
    initial-backoff-ms: ${IDENTITY_OUTBOX_INITIAL_BACKOFF_MS:1000}
    max-backoff-ms: ${IDENTITY_OUTBOX_MAX_BACKOFF_MS:60000}
  permission:
    # 权限审核 SLA（HLD D-05）：仅跟踪+展示，不做超时自动批准。
    sla-hours: ${PERMISSION_SLA_HOURS:72}
    at-risk-hours: ${PERMISSION_AT_RISK_HOURS:12}
  notification-consumer:
    # 通知中心（Slice 12）：消费 identity 自有 topic 派生站内通知。默认 false，compose 置 true。
    enabled: ${IDENTITY_NOTIFICATION_CONSUMER_ENABLED:false}
    topic: ${IDENTITY_NOTIFICATION_CONSUMER_TOPIC:grassland.identity.events}
    group-id: ${IDENTITY_NOTIFICATION_CONSUMER_GROUP:identity-notification-consumer}
    auto-startup: ${IDENTITY_NOTIFICATION_CONSUMER_AUTOSTARTUP:true}
    external:
      # Stage 3：另开消费者读 marketplace / trust / finance topic（报名/凭证/结算/争议/钱包通知）。
      # 每个 topic 独立 group-id → inbox 幂等键 (consumer_name, event_id) 互不干扰。默认 false，compose 置 true。
      enabled: ${IDENTITY_NOTIFICATION_EXTERNAL_ENABLED:false}
      auto-startup: ${IDENTITY_NOTIFICATION_EXTERNAL_AUTOSTARTUP:true}
      marketplace-topic: ${IDENTITY_NOTIFICATION_MARKETPLACE_TOPIC:grassland.marketplace.events}
      marketplace-group-id: ${IDENTITY_NOTIFICATION_MARKETPLACE_GROUP:identity-notification-marketplace-consumer}
      trust-topic: ${IDENTITY_NOTIFICATION_TRUST_TOPIC:grassland.trust.events}
      trust-group-id: ${IDENTITY_NOTIFICATION_TRUST_GROUP:identity-notification-trust-consumer}
      finance-topic: ${IDENTITY_NOTIFICATION_FINANCE_TOPIC:grassland.finance.events}
      finance-group-id: ${IDENTITY_NOTIFICATION_FINANCE_GROUP:identity-notification-finance-consumer}

# 内部身份断言（HLD 7.4 消费）：secret/audience 须与 edge-bff 完全一致。
# enabled=true 时 CurrentAccountResolver 优先信任 BFF 断言头（回退 cookie）。
identity-assertion:
  enabled: ${IDENTITY_ASSERTION_ENABLED:false}
  secret: ${IDENTITY_ASSERTION_SECRET:}
  audience: ${IDENTITY_ASSERTION_AUDIENCE:grassland-internal}
  header-name: ${IDENTITY_ASSERTION_HEADER_NAME:X-Grassland-Identity}
