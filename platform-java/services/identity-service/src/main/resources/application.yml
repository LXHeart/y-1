spring:
  application:
    name: identity-service
  r2dbc:
    url: ${R2DBC_DATABASE_URL:}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  # 任务书 #76 卡 A：跨应用免登 nonce（identity.cross-app-token）落 Redis——沿用 intelligence 的
  # spring.data.redis 自动装配（GuestTrialRateLimiter 先例）；连接惰性建立，未用到不发连接。
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-512}
      sasl.jaas.config: org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME:}" password="${KAFKA_PASSWORD:}";
      ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
      ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
      ssl.truststore.type: ${KAFKA_SSL_TRUSTSTORE_TYPE:PKCS12}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
        max.block.ms: 5000
        retries: 5
    # 通知中心消费方（Slice 12）：消费本服务 outbox topic 派生站内通知。
    # 默认不启用（测试/本地无 Kafka 时跳过，避免连接噪声）；compose 置 IDENTITY_NOTIFICATION_CONSUMER_ENABLED=true。
    consumer:
      group-id: ${IDENTITY_NOTIFICATION_CONSUMER_GROUP:identity-notification-consumer}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 1
  codec:
    max-in-memory-size: 256KB
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    properties:
      mail.smtp.ssl.enable: true
      # 信封发件人：QQ/163 等要求必须等于认证账号，故默认取 SMTP_USER 而非占位地址
      # （发占位地址会被服务器断连：MessagingException: Exception reading response）。
      mail.smtp.from: ${SMTP_FROM:${SMTP_USER:}}
      # 不设超时的话，SMTP 卡住会一直占住 boundedElastic 线程。
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  port: ${SERVER_PORT:8082}

management:
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    export:
      enabled: ${OTEL_TRACING_ENABLED:false}
      otlp:
        enabled: ${OTEL_EXPORT_ENABLED:false}
    sampling:
      probability: ${OTEL_TRACING_SAMPLING_PROBABILITY:0.1}
    propagation:
      consume: W3C
      produce: W3C
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:}
  server:
    port: ${MANAGEMENT_SERVER_PORT:9082}
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

identity:
  compliance:
    enabled: ${IDENTITY_COMPLIANCE_ENABLED:true}
    poll-interval-ms: ${IDENTITY_COMPLIANCE_POLL_INTERVAL_MS:5000}
    batch-size: ${IDENTITY_COMPLIANCE_BATCH_SIZE:10}
    max-concurrency: ${IDENTITY_COMPLIANCE_MAX_CONCURRENCY:2}
    claim-lease-seconds: ${IDENTITY_COMPLIANCE_CLAIM_LEASE_SECONDS:300}
    max-attempts: ${IDENTITY_COMPLIANCE_MAX_ATTEMPTS:8}
    initial-backoff-seconds: ${IDENTITY_COMPLIANCE_INITIAL_BACKOFF_SECONDS:5}
    max-backoff-seconds: ${IDENTITY_COMPLIANCE_MAX_BACKOFF_SECONDS:3600}
    export-ttl-hours: ${IDENTITY_COMPLIANCE_EXPORT_TTL_HOURS:24}
    # ADR D10 provisional default; production must keep this configurable until legal calibration.
    pii-retention-days: ${IDENTITY_COMPLIANCE_PII_RETENTION_DAYS:180}
    upstream-timeout-ms: ${IDENTITY_COMPLIANCE_UPSTREAM_TIMEOUT_MS:10000}
  session:
    cookie-name: ${SESSION_COOKIE_NAME:y1.sid}
    secret: ${SESSION_SECRET:}
    # auto=按可信 X-Forwarded-Proto/scheme 判定；always=恒定加 Secure；never=仅无 TLS 调试。
    cookie-secure: ${SESSION_COOKIE_SECURE:auto}
    cookie-same-site: ${SESSION_COOKIE_SAME_SITE:Lax}
    # 0 = 使用默认 7 天。
    cookie-max-age-ms: ${SESSION_COOKIE_MAX_AGE_MS:0}
  # 任务书 #76 卡 A：跨应用一次性免登 token（草场 ⇄ AI 应用）。Redis nonce，不建表——
  # Redis 在本项目的既有定位就是防重放与游客限流，nonce 是同场景直接先例。
  cross-app-token:
    ttl-seconds: ${CROSS_APP_TOKEN_TTL_SECONDS:300}
    key-prefix: ${CROSS_APP_TOKEN_KEY_PREFIX:grassland:auth:cross-app-token:}
  # GL-P3-MERCHANT-001：KYB 审核。
  kyb:
    # 审核 SLA，写入 kyb_verification_request.review_deadline。默认 3 天（与 D-03 确认窗口同量级）。
    review-sla-seconds: ${IDENTITY_KYB_REVIEW_SLA_SECONDS:259200}
    document-analysis:
      enabled: ${IDENTITY_KYB_DOCUMENT_ANALYSIS_ENABLED:false}
      poll-interval-ms: ${IDENTITY_KYB_DOCUMENT_ANALYSIS_POLL_INTERVAL_MS:2000}
      batch-size: ${IDENTITY_KYB_DOCUMENT_ANALYSIS_BATCH_SIZE:20}
      max-concurrency: ${IDENTITY_KYB_DOCUMENT_ANALYSIS_MAX_CONCURRENCY:4}
      claim-lease: ${IDENTITY_KYB_DOCUMENT_ANALYSIS_CLAIM_LEASE:2m}
      max-attempts: ${IDENTITY_KYB_DOCUMENT_ANALYSIS_MAX_ATTEMPTS:5}
      initial-backoff: ${IDENTITY_KYB_DOCUMENT_ANALYSIS_INITIAL_BACKOFF:2s}
      max-backoff: ${IDENTITY_KYB_DOCUMENT_ANALYSIS_MAX_BACKOFF:2m}
    retention:
      # 安全默认开启；测试环境显式关闭。否则有限租约到期后仍在使用的 KYB 证据可能被 GC。
      enabled: ${IDENTITY_KYB_RETENTION_ENABLED:true}
      poll-interval-ms: ${IDENTITY_KYB_RETENTION_POLL_INTERVAL_MS:2000}
      batch-size: ${IDENTITY_KYB_RETENTION_BATCH_SIZE:50}
      max-concurrency: ${IDENTITY_KYB_RETENTION_MAX_CONCURRENCY:4}
      claim-lease-ms: ${IDENTITY_KYB_RETENTION_CLAIM_LEASE_MS:60000}
      live-lease-seconds: ${IDENTITY_KYB_RETENTION_LIVE_LEASE_SECONDS:604800}
      renew-ahead-seconds: ${IDENTITY_KYB_RETENTION_RENEW_AHEAD_SECONDS:172800}
      initial-backoff-ms: ${IDENTITY_KYB_RETENTION_INITIAL_BACKOFF_MS:1000}
      max-backoff-ms: ${IDENTITY_KYB_RETENTION_MAX_BACKOFF_MS:60000}
      approved-retention-days: ${IDENTITY_KYB_APPROVED_RETENTION_DAYS:2555}
      rejected-retention-days: ${IDENTITY_KYB_REJECTED_RETENTION_DAYS:365}
  outbox:
    topic: ${IDENTITY_OUTBOX_TOPIC:grassland.identity.events}
    enabled: ${IDENTITY_OUTBOX_ENABLED:true}
    poll-interval-ms: ${IDENTITY_OUTBOX_POLL_INTERVAL_MS:2000}
    batch-size: ${IDENTITY_OUTBOX_BATCH_SIZE:50}
    max-concurrency: ${IDENTITY_OUTBOX_MAX_CONCURRENCY:8}
    ack-timeout-ms: ${IDENTITY_OUTBOX_ACK_TIMEOUT_MS:10000}
    claim-lease-ms: ${IDENTITY_OUTBOX_CLAIM_LEASE_MS:300000}
    initial-backoff-ms: ${IDENTITY_OUTBOX_INITIAL_BACKOFF_MS:1000}
    max-backoff-ms: ${IDENTITY_OUTBOX_MAX_BACKOFF_MS:60000}
  # 事务邮件 delivery outbox（GL-P1-NOTIFY-001）。默认 false——仅当 SMTP 已配（SmtpMailSender.isConfigured）
  # 时由 compose 置 true；publisher 内部再判 isConfigured()，未配不轮询。
  mail-outbox:
    enabled: ${IDENTITY_MAIL_OUTBOX_ENABLED:false}
    poll-interval-ms: ${IDENTITY_MAIL_OUTBOX_POLL_INTERVAL_MS:2000}
    batch-size: ${IDENTITY_MAIL_OUTBOX_BATCH_SIZE:50}
    max-concurrency: ${IDENTITY_MAIL_OUTBOX_MAX_CONCURRENCY:4}
    claim-lease-ms: ${IDENTITY_MAIL_OUTBOX_CLAIM_LEASE_MS:60000}
    # 失败封顶：5 次（指数退避 1/2/4/8/16s）后置 status=dead 停止重试 + 告警。
    max-attempts: ${IDENTITY_MAIL_OUTBOX_MAX_ATTEMPTS:5}
    initial-backoff-ms: ${IDENTITY_MAIL_OUTBOX_INITIAL_BACKOFF_MS:1000}
    max-backoff-ms: ${IDENTITY_MAIL_OUTBOX_MAX_BACKOFF_MS:30000}
    send-timeout-ms: ${IDENTITY_MAIL_OUTBOX_SEND_TIMEOUT_MS:30000}
  external-delivery:
    enabled: ${IDENTITY_EXTERNAL_DELIVERY_ENABLED:false}
    poll-interval-ms: ${IDENTITY_EXTERNAL_DELIVERY_POLL_INTERVAL_MS:2000}
    batch-size: ${IDENTITY_EXTERNAL_DELIVERY_BATCH_SIZE:50}
    max-concurrency: ${IDENTITY_EXTERNAL_DELIVERY_MAX_CONCURRENCY:8}
    claim-lease: ${IDENTITY_EXTERNAL_DELIVERY_CLAIM_LEASE:1m}
    max-attempts: ${IDENTITY_EXTERNAL_DELIVERY_MAX_ATTEMPTS:5}
    initial-backoff: ${IDENTITY_EXTERNAL_DELIVERY_INITIAL_BACKOFF:1s}
    max-backoff: ${IDENTITY_EXTERNAL_DELIVERY_MAX_BACKOFF:1m}
    send-timeout: ${IDENTITY_EXTERNAL_DELIVERY_SEND_TIMEOUT:15s}
    challenge-secret: ${IDENTITY_SMS_CHALLENGE_SECRET:}
    # Provider endpoint is operator-controlled, HTTPS by default, and may be restricted to exact hosts.
    allow-insecure-http: ${IDENTITY_EXTERNAL_DELIVERY_ALLOW_INSECURE_HTTP:false}
    allowed-hosts: ${IDENTITY_EXTERNAL_DELIVERY_ALLOWED_HOSTS:}
    push:
      endpoint: ${PUSH_GATEWAY_ENDPOINT:}
      token: ${PUSH_GATEWAY_TOKEN:}
    sms:
      endpoint: ${SMS_GATEWAY_ENDPOINT:}
      token: ${SMS_GATEWAY_TOKEN:}
  # 移动端 token 认证（GL-P3-IDENTITY-001）。secret 未配置 → 移动端登录/刷新/撤销一律 503（fail-closed），
  # Web cookie 路径不受影响。secret 必须与 edge-bff 的 EDGE_ACCESS_TOKEN_SECRET 同值（edge 验签、identity 签发）。
  mobile:
    access-token:
      secret: ${IDENTITY_ACCESS_TOKEN_SECRET:}
      kid: ${IDENTITY_ACCESS_TOKEN_KID:access-token-v1}
      # 15 分钟：短到泄露窗口可控，长到不至于每次请求都刷新。
      ttl-seconds: ${IDENTITY_ACCESS_TOKEN_TTL_SECONDS:900}
      leeway-seconds: ${IDENTITY_ACCESS_TOKEN_LEEWAY_SECONDS:5}
    refresh-token:
      ttl-days: ${IDENTITY_REFRESH_TOKEN_TTL_DAYS:30}
      # 每账号活跃 refresh token 上限，超出时撤销最旧的（防止无限堆积设备行）。
      max-active-per-account: ${IDENTITY_REFRESH_TOKEN_MAX_ACTIVE:10}
      cleanup:
        # 默认 false（测试/本地不起定时任务），compose 置 true。
        enabled: ${IDENTITY_REFRESH_TOKEN_CLEANUP_ENABLED:false}
        interval-ms: ${IDENTITY_REFRESH_TOKEN_CLEANUP_INTERVAL_MS:3600000}
        retention-days: ${IDENTITY_REFRESH_TOKEN_CLEANUP_RETENTION_DAYS:7}
  active-identity:
    session-policy:
      # 0 = 不限制（默认兼容多设备并存）；正数 = 同账号最多同时激活身份的设备数。
      # 超限时最旧设备切回消费者，但不会被登出。
      max-active-per-account: ${IDENTITY_ACTIVE_IDENTITY_MAX_SESSIONS:0}
  permission:
    # 权限审核 SLA：超时只标记、审计和发事件，绝不自动提权。
    sla-hours: ${PERMISSION_SLA_HOURS:72}
    at-risk-hours: ${PERMISSION_AT_RISK_HOURS:12}
    sla-monitor:
      enabled: ${IDENTITY_PERMISSION_SLA_MONITOR_ENABLED:true}
      poll-interval-ms: ${IDENTITY_PERMISSION_SLA_MONITOR_POLL_INTERVAL_MS:60000}
    auto-review:
      enabled: ${IDENTITY_PERMISSION_AUTO_REVIEW_ENABLED:true}
      poll-interval-ms: ${IDENTITY_PERMISSION_AUTO_REVIEW_POLL_INTERVAL_MS:5000}
  notification-consumer:
    # 通知中心（Slice 12）：消费 identity 自有 topic 派生站内通知。默认 false，compose 置 true。
    enabled: ${IDENTITY_NOTIFICATION_CONSUMER_ENABLED:false}
    topic: ${IDENTITY_NOTIFICATION_CONSUMER_TOPIC:grassland.identity.events}
    group-id: ${IDENTITY_NOTIFICATION_CONSUMER_GROUP:identity-notification-consumer}
    auto-startup: ${IDENTITY_NOTIFICATION_CONSUMER_AUTOSTARTUP:true}
    external:
      # Stage 3：另开消费者读 marketplace / trust / finance topic（报名/凭证/结算/争议/钱包通知）。
      # 每个 topic 独立 group-id → inbox 幂等键 (consumer_name, event_id) 互不干扰。默认 false，compose 置 true。
      enabled: ${IDENTITY_NOTIFICATION_EXTERNAL_ENABLED:false}
      auto-startup: ${IDENTITY_NOTIFICATION_EXTERNAL_AUTOSTARTUP:true}
      marketplace-topic: ${IDENTITY_NOTIFICATION_MARKETPLACE_TOPIC:grassland.marketplace.events}
      marketplace-group-id: ${IDENTITY_NOTIFICATION_MARKETPLACE_GROUP:identity-notification-marketplace-consumer}
      trust-topic: ${IDENTITY_NOTIFICATION_TRUST_TOPIC:grassland.trust.events}
      trust-group-id: ${IDENTITY_NOTIFICATION_TRUST_GROUP:identity-notification-trust-consumer}
      finance-topic: ${IDENTITY_NOTIFICATION_FINANCE_TOPIC:grassland.finance.events}
      finance-group-id: ${IDENTITY_NOTIFICATION_FINANCE_GROUP:identity-notification-finance-consumer}
      # 组织 AI 预算阈值告警（任务书 #37 登记项）：intelligence topic 首个消费者。
      intelligence-topic: ${IDENTITY_NOTIFICATION_INTELLIGENCE_TOPIC:grassland.intelligence.events}
      intelligence-group-id: ${IDENTITY_NOTIFICATION_INTELLIGENCE_GROUP:identity-notification-intelligence-consumer}

# 内部身份断言（GL-P0-ASSERT-001 keyring 模式）：
# identity 验证 edge-bff 用户断言（回退 cookie）及 trust/marketplace/intelligence 服务断言。
identity-assertion:
  enabled: ${IDENTITY_ASSERTION_ENABLED:false}
  issuer: ${IDENTITY_ASSERTION_ISSUER:identity}
  header-name: ${IDENTITY_ASSERTION_HEADER_NAME:X-Grassland-Identity}
  signing-keys:
    - kid: ${IDENTITY_ASSERTION_KEY_IDENTITY_SERVICE_MARKETPLACE_KID:identity-service-marketplace-v1}
      purpose: service
      audience: grassland-marketplace
      secret: ${IDENTITY_ASSERTION_KEY_IDENTITY_SERVICE_MARKETPLACE:}
    - kid: ${IDENTITY_ASSERTION_KEY_IDENTITY_SERVICE_FINANCE_KID:identity-service-finance-v1}
      purpose: service
      audience: grassland-finance
      secret: ${IDENTITY_ASSERTION_KEY_IDENTITY_SERVICE_FINANCE:}
    - kid: ${IDENTITY_ASSERTION_KEY_IDENTITY_SERVICE_TRUST_KID:identity-service-trust-v1}
      purpose: service
      audience: grassland-trust
      secret: ${IDENTITY_ASSERTION_KEY_IDENTITY_SERVICE_TRUST:}
    - kid: ${IDENTITY_ASSERTION_KEY_IDENTITY_SERVICE_INTELLIGENCE_KID:identity-service-intelligence-v1}
      purpose: service
      audience: grassland-intelligence
      secret: ${IDENTITY_ASSERTION_KEY_IDENTITY_SERVICE_INTELLIGENCE:}
  # identity 验证 edge-bff 用户断言
  verify-keys:
    - kid: ${IDENTITY_ASSERTION_KEY_EDGE_USER_IDENTITY_KID:edge-user-identity-v1}
      issuer: edge-bff
      purpose: user
      audience: grassland-identity
      secret: ${IDENTITY_ASSERTION_KEY_EDGE_USER_IDENTITY:}
    - kid: ${IDENTITY_ASSERTION_KEY_EDGE_USER_IDENTITY_PREVIOUS_KID:}
      issuer: edge-bff
      purpose: user
      audience: grassland-identity
      secret: ${IDENTITY_ASSERTION_KEY_EDGE_USER_IDENTITY_PREVIOUS:}
    - kid: ${IDENTITY_ASSERTION_KEY_TRUST_SERVICE_IDENTITY_KID:trust-service-identity-v1}
      issuer: trust
      purpose: service
      audience: grassland-identity
      secret: ${IDENTITY_ASSERTION_KEY_TRUST_SERVICE_IDENTITY:}
    - kid: ${IDENTITY_ASSERTION_KEY_TRUST_SERVICE_IDENTITY_PREVIOUS_KID:}
      issuer: trust
      purpose: service
      audience: grassland-identity
      secret: ${IDENTITY_ASSERTION_KEY_TRUST_SERVICE_IDENTITY_PREVIOUS:}
    - kid: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_IDENTITY_KID:marketplace-service-identity-v1}
      issuer: marketplace
      purpose: service
      audience: grassland-identity
      secret: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_IDENTITY:}
    - kid: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_IDENTITY_PREVIOUS_KID:}
      issuer: marketplace
      purpose: service
      audience: grassland-identity
      secret: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_IDENTITY_PREVIOUS:}
    - kid: ${IDENTITY_ASSERTION_KEY_INTELLIGENCE_SERVICE_IDENTITY_KID:intelligence-service-identity-v1}
      issuer: intelligence
      purpose: service
      audience: grassland-identity
      secret: ${IDENTITY_ASSERTION_KEY_INTELLIGENCE_SERVICE_IDENTITY:}
    - kid: ${IDENTITY_ASSERTION_KEY_INTELLIGENCE_SERVICE_IDENTITY_PREVIOUS_KID:}
      issuer: intelligence
      purpose: service
      audience: grassland-identity
      secret: ${IDENTITY_ASSERTION_KEY_INTELLIGENCE_SERVICE_IDENTITY_PREVIOUS:}
  replay-protection:
    enabled: ${IDENTITY_ASSERTION_REPLAY_ENABLED:false}
    storage: ${IDENTITY_ASSERTION_REPLAY_STORAGE:redis}
    redis-url: ${IDENTITY_ASSERTION_REPLAY_REDIS_URL:}
    key-prefix: ${IDENTITY_ASSERTION_REPLAY_KEY_PREFIX:grassland:identity-assertion:replay:}

# KYB 附件元数据只经容器网络直连 intelligence，并使用 identity 服务断言鉴权。
intelligence:
  service:
    base-url: ${INTELLIGENCE_SERVICE_BASE_URL:http://intelligence-service:8086}

marketplace:
  service:
    base-url: ${MARKETPLACE_SERVICE_BASE_URL:http://marketplace-service:8083}

finance:
  service:
    base-url: ${FINANCE_SERVICE_BASE_URL:http://finance-service:8084}

trust:
  service:
    base-url: ${TRUST_SERVICE_BASE_URL:http://trust-service:8085}

# GL-P3-MERCHANT-001：KYB 敏感字段（法人身份证号/收款账号）信封加密。
# 与 intelligence BYOK 共用同一 KEK 变量名。未配置时 EnvelopeEncryption bean 不装配，
# KybFieldCrypto 对敏感字段 fail-closed 返 503——绝不退化为存明文。
#
# KEK 轮换（双 KEK 并存）：与 intelligence 必须配一致的 version/previous——同一密文要在两个服务
# 解出同一结果。轮换顺序见 docs/运维/生产发布与灾备运行手册.md「CRYPTO_KEK_BASE64 的特殊轮换语义」。
crypto:
  kek:
    encoded: ${CRYPTO_KEK_BASE64:}
    version: ${CRYPTO_KEK_VERSION:1}
    previous: ${CRYPTO_KEK_PREVIOUS:}
