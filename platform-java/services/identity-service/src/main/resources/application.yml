spring:
  application:
    name: identity-service
  r2dbc:
    url: ${LEGACY_DATABASE_R2DBC_URL:}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        # 原生 producer 覆盖（KafkaProperties.Producer 无 retries 便捷字段，须走 properties map）
        retries: 3
  codec:
    max-in-memory-size: 256KB
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    properties:
      mail.smtp.ssl.enable: true
      mail.smtp.from: ${SMTP_FROM:noreply@grassland.local}

server:
  port: ${SERVER_PORT:8082}

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9082}
  endpoints:
    web:
      exposure:
        include: health,info

identity:
  legacy:
    session:
      cookie-name: ${SESSION_COOKIE_NAME:y1.sid}
      secret: ${SESSION_SECRET:}

# 内部身份断言（HLD 7.4 消费）：secret/audience 须与 edge-bff 完全一致。
# enabled=true 时 CurrentAccountResolver 优先信任 BFF 断言头（回退 cookie）。
identity-assertion:
  enabled: ${IDENTITY_ASSERTION_ENABLED:false}
  secret: ${IDENTITY_ASSERTION_SECRET:}
  audience: ${IDENTITY_ASSERTION_AUDIENCE:grassland-internal}
  header-name: ${IDENTITY_ASSERTION_HEADER_NAME:X-Grassland-Identity}
