spring:
  application:
    name: marketplace-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
        max.block.ms: 5000
        retries: 5
    # trust 事件消费方（Slice 6C Phase E，平台首个消费方）。consumer factory 由 Boot auto-config 提供。
    # 默认不启用（测试/本地无 Kafka 时跳过，避免连接噪声）；compose 置 MARKETPLACE_TRUST_CONSUMER_ENABLED=true。
    consumer:
      group-id: ${MARKETPLACE_TRUST_CONSUMER_GROUP:marketplace-trust-consumer}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 1
  r2dbc:
    url: ${MARKETPLACE_R2DBC_URL:}
  temporal:
    # 连接：容器内用 service name（temporal:7233），本地 bootRun 注 localhost:7233。
    connection:
      target: ${TEMPORAL_TARGET:temporal:7233}
    # 显式定义 worker：@ActivityImpl(workers) 按 name 引用，@WorkflowImpl(taskQueues) 按 task-queue 注册。
    # grassland-demo：3C demo；marketplace-saga：4F 接受报名资金预留 Saga（workflow 与其 activity 落同 worker）。
    workers:
      - name: grassland-demo
        task-queue: grassland-demo
      - name: marketplace-saga
        task-queue: marketplace-saga
    # 自动发现 workflow/activity（v1.35+ 需显式开启包扫描；saga 子包 com.grassland.marketplace.workflow.saga 递归覆盖）。
    workers-auto-discovery:
      packages:
        - com.grassland.marketplace.workflow
    # 测试隔离：IT/纯 context 测试置 true 用内存 test server，不依赖 temporal 容器。
    test-server:
      enabled: ${TEMPORAL_TEST_SERVER:false}
server:
  port: ${SERVER_PORT:8083}
management:
  endpoints:
    web:
      exposure:
        include: health,info

# 对象存储：本服务不再直连 MinIO。媒体上传统一走 intelligence-service 的鉴权链路
# （POST /api/media/upload-tickets → confirm → read/delete，带 caller 解析、MIME 白名单、
# owner 配额与限流）。原 marketplace `/storage/uploads` 匿名端点绕过全部约束，已删（GL-P0-SEC-002）；
# 随之移除 platform-storage 依赖与本段 object-storage 配置，marketplace 不再持有 MinIO 凭据。

# DB 地基（Epic 4 Slice 4A）：从 DATABASE_URL 派生 JDBC(Flyway)+R2DBC；独立 Flyway 历史表 marketplace_flyway_schema。
marketplace:
  datasource:
    from-database-url: ${MARKETPLACE_DATASOURCE_FROM_DATABASE_URL:false}
  # 结算窗口（Slice 5A）：商家确认后等待的结算窗口（概念 T+2；dev/test 短默认 5s 便于 e2e）。
  settlement:
    window-seconds: ${SETTLEMENT_WINDOW_SECONDS:5}
  outbox:
    topic: ${MARKETPLACE_OUTBOX_TOPIC:grassland.marketplace.events}
    enabled: ${MARKETPLACE_OUTBOX_ENABLED:true}
    poll-interval-ms: ${MARKETPLACE_OUTBOX_POLL_INTERVAL_MS:2000}
    batch-size: ${MARKETPLACE_OUTBOX_BATCH_SIZE:50}
    max-concurrency: ${MARKETPLACE_OUTBOX_MAX_CONCURRENCY:8}
    ack-timeout: ${MARKETPLACE_OUTBOX_ACK_TIMEOUT:10s}
    claim-duration: ${MARKETPLACE_OUTBOX_CLAIM_DURATION:5m}
    initial-backoff: ${MARKETPLACE_OUTBOX_INITIAL_BACKOFF:1s}
    max-backoff: ${MARKETPLACE_OUTBOX_MAX_BACKOFF:5m}
  # trust 事件消费方（Slice 6C Phase E）：消费 grassland.trust.events 的 DisputeFinalized → 同步结算态。
  # 默认 false：测试/本地无 Kafka 不启用（@ConditionalOnProperty）；compose 置 true。
  trust-consumer:
    enabled: ${MARKETPLACE_TRUST_CONSUMER_ENABLED:false}
    topic: ${MARKETPLACE_TRUST_CONSUMER_TOPIC:grassland.trust.events}
    group-id: ${MARKETPLACE_TRUST_CONSUMER_GROUP:marketplace-trust-consumer}
    auto-startup: ${MARKETPLACE_TRUST_CONSUMER_AUTOSTARTUP:true}
  # 死信登记消费方（GL-P1-OPS-001 Stage 2）：把 *.DLT 落到 ops_dlt_message 并开处置单，
  # 否则死信只躺在 topic 里，运营既看不到也重投不了。topics 逗号分隔（SpEL split）。
  # 用默认 container factory：trust 那个带 DLT recoverer，本消费者失败会投到 *.DLT.DLT 无限套娃。
  dlt-consumer:
    enabled: ${MARKETPLACE_DLT_CONSUMER_ENABLED:false}
    topics: ${MARKETPLACE_DLT_CONSUMER_TOPICS:grassland.trust.events.DLT}
    group-id: ${MARKETPLACE_DLT_CONSUMER_GROUP:marketplace-dlt-registrar}
    auto-startup: ${MARKETPLACE_DLT_CONSUMER_AUTOSTARTUP:true}
  # 结算对账派发器（Slice 7B）：争议终局后确定性地启对账 workflow，确认资金到位才发布结算。
  # dispatcher-enabled 默认开（生产）；测试基座关闭。redispatch-seconds 控制 started 行多久后可重派发。
  reconciliation:
    dispatcher-enabled: ${MARKETPLACE_RECONCILIATION_DISPATCHER_ENABLED:true}
    poll-ms: ${MARKETPLACE_RECONCILIATION_POLL_MS:2000}
    batch-size: ${MARKETPLACE_RECONCILIATION_BATCH_SIZE:16}
    redispatch-seconds: ${MARKETPLACE_RECONCILIATION_REDISPATCH_SECONDS:30}
    start-failure-backoff-seconds: ${MARKETPLACE_RECONCILIATION_START_FAILURE_BACKOFF_SECONDS:10}

# 内部身份断言（GL-P0-ASSERT-001 keyring 模式）：
# marketplace 签发服务断言到 finance/trust/intelligence（purpose=service），
# 验证 edge-bff 签发的用户断言（purpose=user）。
identity-assertion:
  enabled: ${IDENTITY_ASSERTION_ENABLED:false}
  issuer: ${IDENTITY_ASSERTION_ISSUER:marketplace}
  header-name: ${IDENTITY_ASSERTION_HEADER_NAME:X-Grassland-Identity}
  # marketplace 签发服务断言到各下游（purpose=service）
  signing-keys:
    - kid: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_FINANCE_KID:marketplace-service-finance-v1}
      purpose: service
      audience: grassland-finance
      secret: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_FINANCE:}
    - kid: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_TRUST_KID:marketplace-service-trust-v1}
      purpose: service
      audience: grassland-trust
      secret: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_TRUST:}
    - kid: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_INTELLIGENCE_KID:marketplace-service-intelligence-v1}
      purpose: service
      audience: grassland-intelligence
      secret: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_INTELLIGENCE:}
  # marketplace 验证 edge-bff 签发的用户断言（purpose=user）
  verify-keys:
    - kid: ${IDENTITY_ASSERTION_KEY_EDGE_USER_MARKETPLACE_KID:edge-user-marketplace-v1}
      issuer: edge-bff
      purpose: user
      audience: grassland-marketplace
      secret: ${IDENTITY_ASSERTION_KEY_EDGE_USER_MARKETPLACE:}
  replay-protection:
    enabled: ${IDENTITY_ASSERTION_REPLAY_ENABLED:false}

# 跨服务调 finance（Slice 4F Saga ReserveFunds/ReleaseFunds 出站 base url）。
finance:
  service:
    base-url: ${FINANCE_SERVICE_BASE_URL:http://finance-service:8084}

# 跨服务调 trust（Slice 6A 结算窗口查开放争议出站 base url）。
trust:
  service:
    base-url: ${TRUST_SERVICE_BASE_URL:http://trust-service:8085}

# 跨服务调 intelligence（Slice 11 Stage 2 履约附件 metadata/download-url 中转出站 base url）。
intelligence:
  service:
    base-url: ${INTELLIGENCE_SERVICE_BASE_URL:http://intelligence-service:8086}
