spring:
  application:
    name: marketplace-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-512}
      sasl.jaas.config: org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME:}" password="${KAFKA_PASSWORD:}";
      ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
      ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
      ssl.truststore.type: ${KAFKA_SSL_TRUSTSTORE_TYPE:PKCS12}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
        max.block.ms: 5000
        retries: 5
    # trust 事件消费方（Slice 6C Phase E，平台首个消费方）。consumer factory 由 Boot auto-config 提供。
    # 默认不启用（测试/本地无 Kafka 时跳过，避免连接噪声）；compose 置 MARKETPLACE_TRUST_CONSUMER_ENABLED=true。
    consumer:
      group-id: ${MARKETPLACE_TRUST_CONSUMER_GROUP:marketplace-trust-consumer}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 1
  r2dbc:
    url: ${MARKETPLACE_R2DBC_URL:}
  temporal:
    # 连接：容器内用 service name（temporal:7233），本地 bootRun 注 localhost:7233。
    connection:
      target: ${TEMPORAL_TARGET:temporal:7233}
      enable-https: ${TEMPORAL_ENABLE_HTTPS:false}
    namespace: ${TEMPORAL_NAMESPACE:default}
    # 显式定义 worker：@ActivityImpl(workers) 按 name 引用，@WorkflowImpl(taskQueues) 按 task-queue 注册。
    # grassland-demo：3C demo；marketplace-saga：4F 接受报名资金预留 Saga（workflow 与其 activity 落同 worker）。
    workers:
      - name: grassland-demo
        task-queue: grassland-demo
      - name: marketplace-saga
        task-queue: marketplace-saga
    # 自动发现 workflow/activity（v1.35+ 需显式开启包扫描；saga 子包 com.grassland.marketplace.workflow.saga 递归覆盖）。
    workers-auto-discovery:
      packages:
        - com.grassland.marketplace.workflow
    # 测试隔离：IT/纯 context 测试置 true 用内存 test server，不依赖 temporal 容器。
    test-server:
      enabled: ${TEMPORAL_TEST_SERVER:false}
server:
  port: ${SERVER_PORT:8083}
# management 走独立端口 9082（镜像 identity）：业务流量与指标/健康检查分离，
# prometheus 端点不暴露在主端口上。compose 私网 Prometheus 抓 marketplace-service:9082。
management:
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    export:
      enabled: ${OTEL_TRACING_ENABLED:false}
      otlp:
        enabled: ${OTEL_EXPORT_ENABLED:false}
    sampling:
      probability: ${OTEL_TRACING_SAMPLING_PROBABILITY:0.1}
    propagation:
      consume: W3C
      produce: W3C
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:}
  server:
    port: ${MANAGEMENT_SERVER_PORT:9082}
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

# 对象存储：本服务不再直连 MinIO。媒体上传统一走 intelligence-service 的鉴权链路
# （POST /api/media/upload-tickets → confirm → read/delete，带 caller 解析、MIME 白名单、
# owner 配额与限流）。原 marketplace `/storage/uploads` 匿名端点绕过全部约束，已删（GL-P0-SEC-002）；
# 随之移除 platform-storage 依赖与本段 object-storage 配置，marketplace 不再持有 MinIO 凭据。

# DB 地基（Epic 4 Slice 4A）：从 DATABASE_URL 派生 JDBC(Flyway)+R2DBC；独立 Flyway 历史表 marketplace_flyway_schema。
marketplace:
  datasource:
    from-database-url: ${MARKETPLACE_DATASOURCE_FROM_DATABASE_URL:false}
  # 结算窗口：按接受报名时冻结的 T+N 权益计算。生产一天=86400 秒。
  settlement:
    day-seconds: ${SETTLEMENT_DAY_SECONDS:86400}
  # 商家确认窗口（D-03）：推荐官提交履约后，商家有 N 秒确认；到期未操作 → 自动确认结算（default-approve）。
  # 概念 3 天（259200）；dev/test 短默认 5s 便于 e2e。prod 置 CONFIRMATION_WINDOW_SECONDS=259200。
  confirmation:
    window-seconds: ${CONFIRMATION_WINDOW_SECONDS:5}
    # 临到期强提醒前置秒数：生产 86400（剩余 24h）；若 > window（dev 5s）则 workflow 自动跳过。
    reminder-lead-seconds: ${CONFIRMATION_REMINDER_LEAD_SECONDS:86400}
    # 商家要求补证（退回重交）次数上限（D-03 §3）。
    supplement-cap: ${CONFIRMATION_SUPPLEMENT_CAP:2}
    # merchant_rejection 客服裁定 SLA：3 工作日首期按 3 自然日秒数执行；超时默认 for_recommender。
    cs-sla-seconds: ${CONFIRMATION_CS_SLA_SECONDS:259200}
    # 补启派发器：消除 DB 提交与 Temporal start 的间隙（进程崩溃/网络失败时下轮扫描补启）。
    dispatcher-enabled: ${MARKETPLACE_CONFIRMATION_DISPATCHER_ENABLED:true}
    dispatcher-poll-ms: ${MARKETPLACE_CONFIRMATION_DISPATCHER_POLL_MS:2000}
    dispatcher-batch-size: ${MARKETPLACE_CONFIRMATION_DISPATCHER_BATCH_SIZE:32}
  # F6 contest durable intent 补偿派发器；与 confirmation dispatcher 分开开关，测试可独立禁用。
  contest:
    dispatcher-enabled: ${MARKETPLACE_CONTEST_DISPATCHER_ENABLED:true}
    dispatcher-poll-ms: ${MARKETPLACE_CONTEST_DISPATCHER_POLL_MS:2000}
    dispatcher-batch-size: ${MARKETPLACE_CONTEST_DISPATCHER_BATCH_SIZE:32}
  commerce:
    # HMAC 派生可重复展示的高熵核销码；数据库只保存 SHA-256，不长期保存明文。
    redeem-code-secret: ${MARKETPLACE_COMMERCE_REDEEM_CODE_SECRET:local-commerce-redeem-secret-change-me}
    # 支付/退款/分账 durable intent 补偿 + 过期未核销自动退款。
    dispatcher-enabled: ${MARKETPLACE_COMMERCE_DISPATCHER_ENABLED:true}
    dispatcher-poll-ms: ${MARKETPLACE_COMMERCE_DISPATCHER_POLL_MS:3000}
    dispatcher-batch-size: ${MARKETPLACE_COMMERCE_DISPATCHER_BATCH_SIZE:32}
  outbox:
    topic: ${MARKETPLACE_OUTBOX_TOPIC:grassland.marketplace.events}
    enabled: ${MARKETPLACE_OUTBOX_ENABLED:true}
    poll-interval-ms: ${MARKETPLACE_OUTBOX_POLL_INTERVAL_MS:2000}
    batch-size: ${MARKETPLACE_OUTBOX_BATCH_SIZE:50}
    max-concurrency: ${MARKETPLACE_OUTBOX_MAX_CONCURRENCY:8}
    ack-timeout: ${MARKETPLACE_OUTBOX_ACK_TIMEOUT:10s}
    claim-duration: ${MARKETPLACE_OUTBOX_CLAIM_DURATION:5m}
    initial-backoff: ${MARKETPLACE_OUTBOX_INITIAL_BACKOFF:1s}
    max-backoff: ${MARKETPLACE_OUTBOX_MAX_BACKOFF:5m}
  # trust 事件消费方（Slice 6C Phase E）：消费 grassland.trust.events 的 DisputeFinalized → 同步结算态。
  # 默认 false：测试/本地无 Kafka 不启用（@ConditionalOnProperty）；compose 置 true。
  trust-consumer:
    enabled: ${MARKETPLACE_TRUST_CONSUMER_ENABLED:false}
    topic: ${MARKETPLACE_TRUST_CONSUMER_TOPIC:grassland.trust.events}
    group-id: ${MARKETPLACE_TRUST_CONSUMER_GROUP:marketplace-trust-consumer}
    auto-startup: ${MARKETPLACE_TRUST_CONSUMER_AUTOSTARTUP:true}
  # 死信登记消费方（GL-P1-OPS-001 Stage 2）：把 *.DLT 落到 ops_dlt_message 并开处置单，
  # 否则死信只躺在 topic 里，运营既看不到也重投不了。topics 逗号分隔（SpEL split）。
  # 用默认 container factory：trust 那个带 DLT recoverer，本消费者失败会投到 *.DLT.DLT 无限套娃。
  dlt-consumer:
    enabled: ${MARKETPLACE_DLT_CONSUMER_ENABLED:false}
    topics: ${MARKETPLACE_DLT_CONSUMER_TOPICS:grassland.trust.events.DLT}
    group-id: ${MARKETPLACE_DLT_CONSUMER_GROUP:marketplace-dlt-registrar}
    auto-startup: ${MARKETPLACE_DLT_CONSUMER_AUTOSTARTUP:true}
  # 运营死信指标 + retention 清理（GL-P3-PLATFORM-001，承接 OPS-001 Stage 2）。
  # dlt-metrics 总是开（gauge 反映 DB 真相，与 consumer 是否启用无关）；dlt-cleanup 默认关，
  # compose 在 java-edge profile 下置 MARKETPLACE_OPS_DLT_CLEANUP_ENABLED=true 开启定时清理。
  ops:
    dlt-metrics:
      refresh-ms: ${MARKETPLACE_OPS_DLT_METRICS_REFRESH_MS:15000}
    dlt-cleanup:
      enabled: ${MARKETPLACE_OPS_DLT_CLEANUP_ENABLED:false}
      retention-days: ${MARKETPLACE_OPS_DLT_CLEANUP_RETENTION_DAYS:30}
      interval-ms: ${MARKETPLACE_OPS_DLT_CLEANUP_INTERVAL_MS:3600000}
  # 结算对账派发器（Slice 7B）：争议终局后确定性地启对账 workflow，确认资金到位才发布结算。
  # dispatcher-enabled 默认开（生产）；测试基座关闭。redispatch-seconds 控制 started 行多久后可重派发。
  reconciliation:
    dispatcher-enabled: ${MARKETPLACE_RECONCILIATION_DISPATCHER_ENABLED:true}
    poll-ms: ${MARKETPLACE_RECONCILIATION_POLL_MS:2000}
    batch-size: ${MARKETPLACE_RECONCILIATION_BATCH_SIZE:16}
    redispatch-seconds: ${MARKETPLACE_RECONCILIATION_REDISPATCH_SECONDS:30}
    start-failure-backoff-seconds: ${MARKETPLACE_RECONCILIATION_START_FAILURE_BACKOFF_SECONDS:10}

# 内部身份断言（GL-P0-ASSERT-001 keyring 模式）：
# marketplace 签发服务断言到 finance/trust/intelligence/identity（purpose=service），
# 验证 edge-bff 签发的用户断言（purpose=user）。
identity-assertion:
  enabled: ${IDENTITY_ASSERTION_ENABLED:false}
  issuer: ${IDENTITY_ASSERTION_ISSUER:marketplace}
  header-name: ${IDENTITY_ASSERTION_HEADER_NAME:X-Grassland-Identity}
  # marketplace 签发服务断言到各下游（purpose=service）
  signing-keys:
    - kid: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_FINANCE_KID:marketplace-service-finance-v1}
      purpose: service
      audience: grassland-finance
      secret: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_FINANCE:}
    - kid: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_TRUST_KID:marketplace-service-trust-v1}
      purpose: service
      audience: grassland-trust
      secret: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_TRUST:}
    - kid: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_INTELLIGENCE_KID:marketplace-service-intelligence-v1}
      purpose: service
      audience: grassland-intelligence
      secret: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_INTELLIGENCE:}
    - kid: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_IDENTITY_KID:marketplace-service-identity-v1}
      purpose: service
      audience: grassland-identity
      secret: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_IDENTITY:}
  # marketplace 验证 edge-bff 用户断言 + trust 服务断言（内部争议参与方授权）
  verify-keys:
    - kid: ${IDENTITY_ASSERTION_KEY_EDGE_USER_MARKETPLACE_KID:edge-user-marketplace-v1}
      issuer: edge-bff
      purpose: user
      audience: grassland-marketplace
      secret: ${IDENTITY_ASSERTION_KEY_EDGE_USER_MARKETPLACE:}
    - kid: ${IDENTITY_ASSERTION_KEY_EDGE_USER_MARKETPLACE_PREVIOUS_KID:}
      issuer: edge-bff
      purpose: user
      audience: grassland-marketplace
      secret: ${IDENTITY_ASSERTION_KEY_EDGE_USER_MARKETPLACE_PREVIOUS:}
    - kid: ${IDENTITY_ASSERTION_KEY_TRUST_SERVICE_MARKETPLACE_KID:trust-service-marketplace-v1}
      issuer: trust
      purpose: service
      audience: grassland-marketplace
      secret: ${IDENTITY_ASSERTION_KEY_TRUST_SERVICE_MARKETPLACE:}
    - kid: ${IDENTITY_ASSERTION_KEY_TRUST_SERVICE_MARKETPLACE_PREVIOUS_KID:}
      issuer: trust
      purpose: service
      audience: grassland-marketplace
      secret: ${IDENTITY_ASSERTION_KEY_TRUST_SERVICE_MARKETPLACE_PREVIOUS:}
    - kid: ${IDENTITY_ASSERTION_KEY_INTELLIGENCE_SERVICE_MARKETPLACE_KID:intelligence-service-marketplace-v1}
      issuer: intelligence
      purpose: service
      audience: grassland-marketplace
      secret: ${IDENTITY_ASSERTION_KEY_INTELLIGENCE_SERVICE_MARKETPLACE:}
    - kid: ${IDENTITY_ASSERTION_KEY_INTELLIGENCE_SERVICE_MARKETPLACE_PREVIOUS_KID:}
      issuer: intelligence
      purpose: service
      audience: grassland-marketplace
      secret: ${IDENTITY_ASSERTION_KEY_INTELLIGENCE_SERVICE_MARKETPLACE_PREVIOUS:}
  replay-protection:
    enabled: ${IDENTITY_ASSERTION_REPLAY_ENABLED:false}
    storage: ${IDENTITY_ASSERTION_REPLAY_STORAGE:redis}
    redis-url: ${IDENTITY_ASSERTION_REPLAY_REDIS_URL:}
    key-prefix: ${IDENTITY_ASSERTION_REPLAY_KEY_PREFIX:grassland:identity-assertion:replay:}

# 跨服务调 finance（Slice 4F Saga ReserveFunds/ReleaseFunds 出站 base url）。
finance:
  service:
    base-url: ${FINANCE_SERVICE_BASE_URL:http://finance-service:8084}

identity:
  service:
    base-url: ${IDENTITY_SERVICE_BASE_URL:http://identity-service:8082}

# 跨服务调 trust（Slice 6A 结算窗口查开放争议出站 base url）。
trust:
  service:
    base-url: ${TRUST_SERVICE_BASE_URL:http://trust-service:8085}

# 跨服务调 intelligence（Slice 11 Stage 2 履约附件 metadata/download-url 中转出站 base url）。
intelligence:
  service:
    base-url: ${INTELLIGENCE_SERVICE_BASE_URL:http://intelligence-service:8086}
