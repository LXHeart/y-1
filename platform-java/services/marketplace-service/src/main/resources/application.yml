spring:
  application:
    name: marketplace-service
  temporal:
    # 连接：容器内用 service name（temporal:7233），本地 bootRun 注 localhost:7233。
    connection:
      target: ${TEMPORAL_TARGET:temporal:7233}
    # 显式定义 worker：@ActivityImpl(workers) 按 name 引用，@WorkflowImpl(taskQueues) 按 task-queue 注册。
    # 两者用相同值（grassland-demo）使 workflow 与其 activity 落在同一 worker。
    workers:
      - name: grassland-demo
        task-queue: grassland-demo
    # 自动发现 workflow/activity（v1.35+ 需显式开启包扫描）。
    workers-auto-discovery:
      packages:
        - com.grassland.marketplace.workflow
    # 测试隔离：IT/纯 context 测试置 true 用内存 test server，不依赖 temporal 容器。
    test-server:
      enabled: ${TEMPORAL_TEST_SERVER:false}
server:
  port: ${SERVER_PORT:8083}
management:
  endpoints:
    web:
      exposure:
        include: health,info

# 对象存储（platform-storage 共享库，autoconfigure 在 enabled=true 时装配）。
# endpoint 是服务端访问 MinIO 的地址；public-base-url 是浏览器直传地址（SigV4 签 Host 必须匹配）。
object-storage:
  enabled: ${OBJECT_STORAGE_ENABLED:true}
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  public-base-url: ${MINIO_PUBLIC_BASE_URL:http://localhost:9000}
  region: ${MINIO_REGION:us-east-1}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:grassland}
  path-style-access: ${MINIO_PATH_STYLE:true}
  auto-create-bucket: ${MINIO_AUTO_CREATE_BUCKET:true}
