spring:
  application:
    name: finance-service
server:
  port: ${SERVER_PORT:8084}
management:
  endpoints:
    web:
      exposure:
        include: health,info

# DB 地基（Epic 4 Slice 4D）：从 DATABASE_URL 派生 JDBC(Flyway)+R2DBC；独立 Flyway 历史表 finance_flyway_schema。
finance:
  datasource:
    from-database-url: ${FINANCE_DATASOURCE_FROM_DATABASE_URL:false}

# BFF 内部身份断言消费（与 edge-bff/identity/marketplace 同 secret/audience）。
identity-assertion:
  enabled: ${IDENTITY_ASSERTION_ENABLED:false}
  secret: ${IDENTITY_ASSERTION_SECRET:}
  audience: ${IDENTITY_ASSERTION_AUDIENCE:grassland-internal}
  header-name: ${IDENTITY_ASSERTION_HEADER_NAME:X-Grassland-Identity}
