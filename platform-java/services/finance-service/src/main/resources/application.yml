spring:
  application:
    name: finance-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
        max.block.ms: 5000
        retries: 5
server:
  port: ${SERVER_PORT:8084}
management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9082}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

# DB 地基（Epic 4 Slice 4D）：从 DATABASE_URL 派生 JDBC(Flyway)+R2DBC；独立 Flyway 历史表 finance_flyway_schema。
finance:
  datasource:
    from-database-url: ${FINANCE_DATASOURCE_FROM_DATABASE_URL:false}
  # PSP/存管 adapter 模式（ADR-D01）：sandbox = stub（只写内部账本，不真动钱）。
  # 选定真实合作方后置 FINANCE_PSP_MODE=<provider> 并提供对应 PaymentProviderAdapter bean。
  psp:
    mode: ${FINANCE_PSP_MODE:sandbox}
  outbox:
    topic: ${FINANCE_OUTBOX_TOPIC:grassland.finance.events}
    enabled: ${FINANCE_OUTBOX_ENABLED:true}
    poll-interval-ms: ${FINANCE_OUTBOX_POLL_INTERVAL_MS:2000}
    batch-size: ${FINANCE_OUTBOX_BATCH_SIZE:50}
    max-concurrency: ${FINANCE_OUTBOX_MAX_CONCURRENCY:8}
    ack-timeout-ms: ${FINANCE_OUTBOX_ACK_TIMEOUT_MS:10000}
    claim-lease-ms: ${FINANCE_OUTBOX_CLAIM_LEASE_MS:300000}
    initial-backoff-ms: ${FINANCE_OUTBOX_INITIAL_BACKOFF_MS:1000}
    max-backoff-ms: ${FINANCE_OUTBOX_MAX_BACKOFF_MS:60000}

# 内部身份断言（GL-P0-ASSERT-001 keyring 模式）：
# finance 验证 edge-bff 用户断言 + marketplace/trust 服务断言。
identity-assertion:
  enabled: ${IDENTITY_ASSERTION_ENABLED:false}
  issuer: ${IDENTITY_ASSERTION_ISSUER:finance}
  header-name: ${IDENTITY_ASSERTION_HEADER_NAME:X-Grassland-Identity}
  # finance 验证 edge-bff 用户断言 + marketplace/trust 服务断言
  verify-keys:
    - kid: ${IDENTITY_ASSERTION_KEY_EDGE_USER_FINANCE_KID:edge-user-finance-v1}
      issuer: edge-bff
      purpose: user
      audience: grassland-finance
      secret: ${IDENTITY_ASSERTION_KEY_EDGE_USER_FINANCE:}
    - kid: ${IDENTITY_ASSERTION_KEY_EDGE_USER_FINANCE_PREVIOUS_KID:}
      issuer: edge-bff
      purpose: user
      audience: grassland-finance
      secret: ${IDENTITY_ASSERTION_KEY_EDGE_USER_FINANCE_PREVIOUS:}
    - kid: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_FINANCE_KID:marketplace-service-finance-v1}
      issuer: marketplace
      purpose: service
      audience: grassland-finance
      secret: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_FINANCE:}
    - kid: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_FINANCE_PREVIOUS_KID:}
      issuer: marketplace
      purpose: service
      audience: grassland-finance
      secret: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_FINANCE_PREVIOUS:}
    - kid: ${IDENTITY_ASSERTION_KEY_TRUST_SERVICE_FINANCE_KID:trust-service-finance-v1}
      issuer: trust
      purpose: service
      audience: grassland-finance
      secret: ${IDENTITY_ASSERTION_KEY_TRUST_SERVICE_FINANCE:}
    - kid: ${IDENTITY_ASSERTION_KEY_TRUST_SERVICE_FINANCE_PREVIOUS_KID:}
      issuer: trust
      purpose: service
      audience: grassland-finance
      secret: ${IDENTITY_ASSERTION_KEY_TRUST_SERVICE_FINANCE_PREVIOUS:}
    - kid: ${IDENTITY_ASSERTION_KEY_INTELLIGENCE_SERVICE_FINANCE_KID:intelligence-service-finance-v1}
      issuer: intelligence
      purpose: service
      audience: grassland-finance
      secret: ${IDENTITY_ASSERTION_KEY_INTELLIGENCE_SERVICE_FINANCE:}
    - kid: ${IDENTITY_ASSERTION_KEY_INTELLIGENCE_SERVICE_FINANCE_PREVIOUS_KID:}
      issuer: intelligence
      purpose: service
      audience: grassland-finance
      secret: ${IDENTITY_ASSERTION_KEY_INTELLIGENCE_SERVICE_FINANCE_PREVIOUS:}
    - kid: ${IDENTITY_ASSERTION_KEY_IDENTITY_SERVICE_FINANCE_KID:identity-service-finance-v1}
      issuer: identity
      purpose: service
      audience: grassland-finance
      secret: ${IDENTITY_ASSERTION_KEY_IDENTITY_SERVICE_FINANCE:}
    - kid: ${IDENTITY_ASSERTION_KEY_IDENTITY_SERVICE_FINANCE_PREVIOUS_KID:}
      issuer: identity
      purpose: service
      audience: grassland-finance
      secret: ${IDENTITY_ASSERTION_KEY_IDENTITY_SERVICE_FINANCE_PREVIOUS:}
  replay-protection:
    enabled: ${IDENTITY_ASSERTION_REPLAY_ENABLED:false}
    storage: ${IDENTITY_ASSERTION_REPLAY_STORAGE:redis}
    redis-url: ${IDENTITY_ASSERTION_REPLAY_REDIS_URL:}
    key-prefix: ${IDENTITY_ASSERTION_REPLAY_KEY_PREFIX:grassland:identity-assertion:replay:}

# 积分内部端点共享密钥（GL-P3-AI-001 下属切片）。/internal/credits/{consume,refund,award} 由
# CreditsInternalAuthFilter 校验 X-Internal-Key；未配 → 503 fail-closed（与 legacy bridge 同口径）。
# intelligence FinanceCreditsClient 与 legacy Express 代理共用此密钥。
credits:
  internal-key: ${INTERNAL_API_KEY:}
  ai-quota:
    base-daily: ${AI_FREE_QUOTA_BASE_DAILY:0}
    zone-id: ${AI_FREE_QUOTA_ZONE_ID:Asia/Shanghai}
