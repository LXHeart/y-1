spring:
  application:
    name: intelligence-service
  # 视频制作通过 JSON 携带 1-9 张 base64 图片；对齐 legacy express.json({limit:'10mb'}) 契约。
  # Boot 4 属性前缀是 spring.http.codecs（不是 Boot 3 的 spring.codec）；默认 256KB 会在 controller 前 413。
  http:
    codecs:
      max-in-memory-size: 10MB
  webflux:
    multipart:
      # generate-image 最多 4 张；image-analysis/analyze 等最多 6 张图片 + 8 文本字段 = 14 parts。大文件落临时盘，controller 再按字节严格校验。
      max-in-memory-size: 32KB
      max-disk-usage-per-part: 5MB
      max-parts: 16
      streaming: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
        max.block.ms: 5000
        retries: 5
  r2dbc:
    url: ${INTELLIGENCE_R2DBC_URL:}
server:
  port: ${SERVER_PORT:8086}
  # SSE 流式透传不能压缩/缓冲（与 edge-bff 一致：块到块透传）。
  compression:
    enabled: false
  max-http-request-header-size: 16KB
management:
  endpoints:
    web:
      exposure:
        include: health,info

# DB 地基：从 DATABASE_URL 派生 JDBC(Flyway)+R2DBC；独立 Flyway 历史表 intelligence_flyway_schema。
intelligence:
  datasource:
    from-database-url: ${INTELLIGENCE_DATASOURCE_FROM_DATABASE_URL:false}
  outbox:
    topic: ${INTELLIGENCE_OUTBOX_TOPIC:grassland.intelligence.events}
    enabled: ${INTELLIGENCE_OUTBOX_ENABLED:true}
    poll-interval-ms: ${INTELLIGENCE_OUTBOX_POLL_INTERVAL_MS:2000}
    batch-size: ${INTELLIGENCE_OUTBOX_BATCH_SIZE:50}
    max-concurrency: ${INTELLIGENCE_OUTBOX_MAX_CONCURRENCY:8}
    ack-timeout-ms: ${INTELLIGENCE_OUTBOX_ACK_TIMEOUT_MS:10000}
    claim-lease-ms: ${INTELLIGENCE_OUTBOX_CLAIM_LEASE_MS:300000}
    initial-backoff-ms: ${INTELLIGENCE_OUTBOX_INITIAL_BACKOFF_MS:1000}
    max-backoff-ms: ${INTELLIGENCE_OUTBOX_MAX_BACKOFF_MS:60000}

# BFF 内部身份断言消费（与 edge-bff/identity 同 secret/audience）。
identity-assertion:
  enabled: ${IDENTITY_ASSERTION_ENABLED:false}
  secret: ${IDENTITY_ASSERTION_SECRET:}
  audience: ${IDENTITY_ASSERTION_AUDIENCE:grassland-internal}
  header-name: ${IDENTITY_ASSERTION_HEADER_NAME:X-Grassland-Identity}

# 平台默认 AI 模型（HLD §12.3 平台默认配置的第一步；BYOK/model-control-plane 留后续 slice）。
# intelligence 不读 legacy per-user 设置——所有用户统一用平台默认 Qwen。
ai:
  qwen:
    base-url: ${QWEN_BASE_URL:}
    api-key: ${QWEN_API_KEY:}
    model: ${QWEN_MODEL:qwen-plus}
    connect-timeout-ms: ${QWEN_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${QWEN_READ_TIMEOUT_MS:120000}
  # 图片生成可使用独立 OpenAI-compatible provider；未配时回落上面的平台 Qwen。
  image-generation:
    base-url: ${IMAGE_GENERATION_BASE_URL:}
    api-key: ${IMAGE_GENERATION_API_KEY:}
    model: ${IMAGE_GENERATION_MODEL:}
    connect-timeout-ms: ${IMAGE_GENERATION_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${IMAGE_GENERATION_READ_TIMEOUT_MS:300000}

# 对象存储（platform-storage）：文章生成图片从本地卷迁到 MinIO/S3（草场 Slice 8）。
# enabled 默认 true（与 marketplace 一致）→ S3GeneratedImageStore（多副本共享，@PostConstruct 建 bucket，缺失即显式失败）。
# 测试/本地未启 MinIO 时设 object-storage.enabled=false → 回落 LocalGeneratedImageStore。
object-storage:
  enabled: ${OBJECT_STORAGE_ENABLED:true}
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  public-base-url: ${MINIO_PUBLIC_BASE_URL:http://localhost:9000}
  region: ${MINIO_REGION:us-east-1}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:grassland}
  path-style-access: ${MINIO_PATH_STYLE:true}
  auto-create-bucket: ${MINIO_AUTO_CREATE_BUCKET:true}

article-images:
  search:
    endpoint: ${ARTICLE_IMAGE_SEARCH_ENDPOINT:https://www.bing.com/images/search}
    timeout-ms: ${ARTICLE_IMAGE_SEARCH_TIMEOUT_MS:15000}
  generated:
    # S3 key 前缀（对象 key 形如 {key-prefix}/{uuid}.png）；本地兜底实现忽略此值。
    key-prefix: ${ARTICLE_GENERATED_IMAGE_KEY_PREFIX:article-generated}
    ttl-seconds: ${ARTICLE_GENERATED_IMAGE_TTL_SECONDS:1800}
    cleanup-interval-ms: ${ARTICLE_GENERATED_IMAGE_CLEANUP_INTERVAL_MS:300000}

# 积分扣减：经 legacy 内部端点（过渡期；legacy 不认 X-Grassland-Identity，用共享密钥）。
credits:
  legacy:
    base-url: ${LEGACY_CREDITS_BASE_URL:http://backend:3000}
    internal-key: ${INTERNAL_API_KEY:}
    consume-path: /api/internal/credits/consume
