spring:
  application:
    name: edge-bff
  codec:
    max-in-memory-size: 64KB

server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: false

management:
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    export:
      enabled: ${OTEL_TRACING_ENABLED:false}
      otlp:
        enabled: ${OTEL_EXPORT_ENABLED:false}
    sampling:
      probability: ${OTEL_TRACING_SAMPLING_PROBABILITY:0.1}
    propagation:
      consume: W3C
      produce: W3C
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:}
  server:
    port: ${MANAGEMENT_SERVER_PORT:9080}
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

edge:
  # Unknown, method-mismatched, or disabled routes return 404 at Edge; there is no backend fallback.
  default-upstream: fail-closed
  security:
    # Cookie 写请求的全局 Origin/Referer 门禁；0/false 仅用于应急排障。
    csrf-origin-check: ${SECURITY_CSRF_ORIGIN_CHECK:1}
    allowed-origins: ${CORS_ORIGIN:},${PUBLIC_BACKEND_ORIGIN:}
    internal-identity-header: ${IDENTITY_ASSERTION_HEADER_NAME:X-Grassland-Identity}
  identity:
    # true 时 edge-bff 直读 session 表签发内部身份断言（HLD 7.4）；与 identity-assertion.enabled 同开。
    from-database-url: ${EDGE_IDENTITY_FROM_DATABASE_URL:false}
  # GL-P3-IDENTITY-001：移动端 access token 验签。secret 未配 → bean 不装 → bearer 分支跳过（Web 不受影响）。
  access-token:
    secret: ${EDGE_ACCESS_TOKEN_SECRET:}
    kid: ${EDGE_ACCESS_TOKEN_KID:access-token-v1}
    # 轮换窗口内保留旧验签密钥，格式 kid=secret,kid2=secret2。
    previous-keys: ${EDGE_ACCESS_TOKEN_PREVIOUS_KEYS:}
    leeway-seconds: ${EDGE_ACCESS_TOKEN_LEEWAY_SECONDS:5}
  upstreams:
    identity: ${IDENTITY_SERVICE_BASE_URL:http://localhost:8082}
    marketplace: ${MARKETPLACE_SERVICE_BASE_URL:http://localhost:8083}
    finance: ${FINANCE_SERVICE_BASE_URL:http://localhost:8084}
    trust: ${TRUST_SERVICE_BASE_URL:http://localhost:8085}
    intelligence: ${INTELLIGENCE_SERVICE_BASE_URL:http://localhost:8086}
  routes:
    - method: GET
      path: /api/auth/me
      upstream: identity
      enabled: ${EDGE_ROUTE_AUTH_ME_IDENTITY:true}
    - method: POST
      path: /api/auth/login
      upstream: identity
      enabled: ${EDGE_ROUTE_AUTH_LOGIN_IDENTITY:true}
    - method: POST
      path: /api/auth/logout
      upstream: identity
      enabled: ${EDGE_ROUTE_AUTH_LOGOUT_IDENTITY:true}
    - method: GET
      path: /api/auth/captcha
      upstream: identity
      enabled: ${EDGE_ROUTE_AUTH_CAPTCHA_IDENTITY:true}
    - method: POST
      path: /api/auth/send-code
      upstream: identity
      enabled: ${EDGE_ROUTE_AUTH_SENDCODE_IDENTITY:true}
    - method: POST
      path: /api/auth/register
      upstream: identity
      enabled: ${EDGE_ROUTE_AUTH_REGISTER_IDENTITY:true}
    # 移动端 refresh/revoke 必须直达 identity；其它 Java 路由由 AccessTokenFilter 消费 access token 并换内部断言。
    - method: POST
      path: /api/auth/refresh
      upstream: identity
      exact: true
      enabled: ${EDGE_ROUTE_AUTH_REFRESH_IDENTITY:true}
    - method: POST
      path: /api/auth/revoke
      upstream: identity
      exact: true
      enabled: ${EDGE_ROUTE_AUTH_REVOKE_IDENTITY:true}
    # 任务大厅（task-catalog + application，Epic 4 Slice 4A/4B）→ marketplace-service。
    # 无 method：匹配所有方法；path 前缀覆盖 /api/tasks 与 /api/tasks/{id}/applications/* 全部子路径。
    # marketplace 为内部上游 → InternalAssertionFilter 签发 X-Grassland-Identity（HLD 7.4）。
    - path: /api/tasks
      upstream: marketplace
      enabled: ${EDGE_ROUTE_TASKS_MARKETPLACE:true}
    - path: /api/analytics
      upstream: marketplace
      enabled: ${EDGE_ROUTE_ANALYTICS_MARKETPLACE:true}
    # ADR-D07 消费者套餐/订单/核销新契约。finance 私网 /internal 不暴露给 Edge。
    - path: /api/v2
      upstream: marketplace
      enabled: ${EDGE_ROUTE_COMMERCE_MARKETPLACE:true}
    # ---- 身份域非 auth 端点（Slice 2E–2L）→ identity-service。----
    # 组织/门店/成员/权限申请/额度（前缀覆盖全部子路径）。
    - path: /api/organizations
      upstream: identity
      enabled: ${EDGE_ROUTE_ORGANIZATIONS_IDENTITY:true}
    # 门店公开详情页（任务书 #24）→ identity-service。GET /api/stores/{storeId}/public-profile；
    # 登录即可看、未登录也放行（identity 侧 resolveOptional）；内部批量端点 /internal/** 不进本清单。
    - path: /api/stores
      upstream: identity
      enabled: ${EDGE_ROUTE_STORES_PUBLIC_IDENTITY:true}
    # 活动身份 + 多设备 session + 本人身份审计（/api/me/identity-audit）。
    - path: /api/me
      upstream: identity
      enabled: ${EDGE_ROUTE_ME_IDENTITY:true}
    # 平台 admin 权限审核队列。⚠️ 必须用精确前缀 /api/admin/permission-requests——
    # 避免前缀匹配误抢其它 /api/admin/* 路由。
    - path: /api/admin/permission-requests
      upstream: identity
      enabled: ${EDGE_ROUTE_ADMIN_PERMREQ_IDENTITY:true}
    # 平台 admin KYB 审核队列（GL-P3-MERCHANT-001）。同上，必须用精确前缀 /api/admin/kyb-requests。
    - path: /api/admin/kyb-requests
      upstream: identity
      enabled: ${EDGE_ROUTE_ADMIN_KYB_IDENTITY:true}
    # 平台 admin 推荐官认证审核队列（GL-P2-ADMIN-002）。精确前缀，不抢其它 /api/admin/*。
    - path: /api/admin/recommender-requests
      upstream: identity
      enabled: ${EDGE_ROUTE_ADMIN_RECOMMENDER_IDENTITY:true}
    # 平台 AI 控制面（GL-P3-AI-001）→ intelligence-service。
    # /api/ai 前缀：BYOK 密钥管理（/api/ai/keys，Phase 1 已交付）+ 控制面 Run（/api/ai/runs）。
    # /api/ai/keys 与 /api/ai/runs 统一由 intelligence 承载。
    - path: /api/ai
      upstream: intelligence
      enabled: ${EDGE_ROUTE_AI_INTELLIGENCE:true}
    # 游客有限体验（任务书 #36 / ADR-D14）：未登录可用的 AI 试用窄面（3 项白名单 + gtid 额度 + IP 限流，
    # 智能化侧匿名放行）。生产可经 flag 整体关闭；fail-closed：不注册即 404。
    - path: /api/guest-trial
      upstream: intelligence
      enabled: ${EDGE_ROUTE_GUEST_TRIAL_INTELLIGENCE:true}
    # 平台模型配置 admin CRUD（/api/admin/ai/models）。⚠️ 精确前缀 /api/admin/ai——
    # 不抢其它 /api/admin/* 路由（同 kyb-requests 口径）。
    - path: /api/admin/ai
      upstream: intelligence
      enabled: ${EDGE_ROUTE_ADMIN_AI_INTELLIGENCE:true}
    # 财务对账台（GL-P2-ADMIN-006）→ finance。精确前缀，不抢 /api/finance/* 用户侧流量。
    - path: /api/admin/finance
      upstream: finance
      enabled: ${EDGE_ROUTE_ADMIN_FINANCE:true}
    # 积分包 SKU 管理与购买订单监控（AI 套餐 v1）→ finance。用户侧购买端点骑 /api/credits 前缀，零新路由。
    - path: /api/admin/credits-packages
      upstream: finance
      enabled: ${EDGE_ROUTE_ADMIN_CREDITS_PACKAGES_FINANCE:true}
    - path: /api/admin/credits-purchase-orders
      upstream: finance
      enabled: ${EDGE_ROUTE_ADMIN_CREDITS_PURCHASE_ORDERS_FINANCE:true}
    - path: /api/admin/commerce
      upstream: marketplace
      enabled: ${EDGE_ROUTE_ADMIN_COMMERCE_MARKETPLACE:true}
    - path: /api/admin/analytics
      upstream: marketplace
      enabled: ${EDGE_ROUTE_ADMIN_ANALYTICS_MARKETPLACE:true}
    # 任务内容审核（GL-P2-ADMIN-003）→ marketplace。精确前缀，不抢 /api/tasks/* 用户侧流量。
    - path: /api/admin/tasks
      upstream: marketplace
      enabled: ${EDGE_ROUTE_ADMIN_TASKS_MARKETPLACE:true}
    # 推荐官等级策略与单账号 Lv5 准入（GL-P2-ADMIN-007）→ marketplace。
    # 两个窄前缀共用回滚开关，避免配置读写与账号准入只切换一半。
    - path: /api/admin/reputation-config
      upstream: marketplace
      enabled: ${EDGE_ROUTE_ADMIN_REPUTATION_MARKETPLACE:true}
    - path: /api/admin/reputation
      upstream: marketplace
      enabled: ${EDGE_ROUTE_ADMIN_REPUTATION_MARKETPLACE:true}
    # 审判官运营准入（GL-P2-TRUST-001）→ trust。不得扩大为 /api/admin，避免抢占其它后台域。
    - path: /api/admin/trust
      upstream: trust
      enabled: ${EDGE_ROUTE_ADMIN_TRUST:true}
    # 内容素材库（PRD §4.8 / Slice 14）→ intelligence。/api/content-assets 三类库 CRUD + 授权 + 下载；
    # 物理资产三步上传走既有 /api/media 路由（无需另配）。
    - path: /api/content-assets
      upstream: intelligence
      enabled: ${EDGE_ROUTE_CONTENT_ASSETS_INTELLIGENCE:true}
    # 公共素材审核端点（/api/admin/content-assets/review + .../review/{approve|reject}）→ intelligence。
    # 精确前缀，不抢其它 /api/admin/*。
    - path: /api/admin/content-assets
      upstream: intelligence
      enabled: ${EDGE_ROUTE_ADMIN_CONTENT_ASSETS_INTELLIGENCE:true}
    # 智能创作助手（PRD §4.9 / Slice 15）→ intelligence。/api/creation-assistant 全部 5 个 SSE 端点
    #（score/suggest/guide/task-coverage/topic-from-hot）。
    - path: /api/creation-assistant
      upstream: intelligence
      enabled: ${EDGE_ROUTE_CREATION_ASSISTANT_INTELLIGENCE:true}
    # 创作草稿持久化（§4.9.7）→ intelligence。/api/creation-drafts CRUD + 自动保存。
    - path: /api/creation-drafts
      upstream: intelligence
      enabled: ${EDGE_ROUTE_CREATION_DRAFTS_INTELLIGENCE:true}
    # P1 任务创作上下文快照：开始创作时由 intelligence 冻结任务/规则/素材/AI 配置。
    - path: /api/creation-contexts
      upstream: intelligence
      enabled: ${EDGE_ROUTE_CREATION_CONTEXTS_INTELLIGENCE:true}
    # 平台 admin 用户管理 + 积分调整 → identity。
    # 精确路径，不抢同前缀的 permission-requests/kyb-requests/ai（它们排在前面，更具体优先）。
    # 同一 flag 绑定两者（同属一次迁移，不应分开切流）。
    - path: /api/admin/users
      upstream: identity
      enabled: ${EDGE_ROUTE_ADMIN_USERS_IDENTITY:true}
    - path: /api/admin/adjust-credits
      upstream: identity
      enabled: ${EDGE_ROUTE_ADMIN_USERS_IDENTITY:true}
    # 推荐官画像（PRD 六）→ identity。/api/recommenders/{accountId}/profile；
    # 自维护那半边走已有的 /api/me 前缀，无需另配。
    - path: /api/recommenders
      upstream: identity
      enabled: ${EDGE_ROUTE_RECOMMENDERS_IDENTITY:true}
    # 运营处置台（GL-P1-OPS-001）→ marketplace。前缀覆盖 /api/ops/cases、/api/ops/dlt、
    # /api/ops/pending-verifications。
    # 闸门在 marketplace 侧按平台角色（customer_service/admin）判，edge 只透传断言。
    - path: /api/ops
      upstream: marketplace
      enabled: ${EDGE_ROUTE_OPS_MARKETPLACE:true}
    # 推荐官声誉（PRD 五/六）→ marketplace。声誉指标全部从撮合事实派生，故落在 marketplace 而非 identity。
    - path: /api/reputation
      upstream: marketplace
      enabled: ${EDGE_ROUTE_REPUTATION_MARKETPLACE:true}
    # ---- finance（Epic 4 Slice 4D/4E + 6C Phase D）→ finance-service。账户/余额/escrow。----
    - path: /api/finance
      upstream: finance
      enabled: ${EDGE_ROUTE_FINANCE:true}
    # ---- 积分读端（GL-P3-AI-001 下属切片）→ finance-service。balance/history 由 finance 承载，
    # 用户断言由 InternalAssertionFilter 自动签发（grassland-finance audience）。flag=false 时 404。
    - path: /api/credits
      upstream: finance
      enabled: ${EDGE_ROUTE_CREDITS_FINANCE:true}
    # ---- trust（Epic 6 Slice 6A/6C）→ trust-service。争议受理/审判/投票/上诉/客服终审。----
    - path: /api/trust
      upstream: trust
      enabled: ${EDGE_ROUTE_TRUST:true}
    # ---- intelligence（草场 intelligence Slice 1）→ intelligence-service。AI 基建 + 冒烟端点。----
    - path: /api/intelligence
      upstream: intelligence
      enabled: ${EDGE_ROUTE_INTELLIGENCE_SMOKED:true}
    # ---- 用户级分析设置 → intelligence-service。AI provider 配置同域。----
    # /api/settings/analysis（GET/PUT）、/analysis/models、/analysis/verify-model、/api/settings/homepage。
    # 密钥在响应中掩码（**** + 末4位）；PUT 掩码原样回传 = 不变，空串 = 清空。
    - path: /api/settings
      upstream: intelligence
      enabled: ${EDGE_ROUTE_SETTINGS_INTELLIGENCE:true}
    # ---- 首页热点聚合 → intelligence-service。GET /api/homepage/hot-items。----
    # 不强制登录：登录用户按其 homepage settings 选 provider（60s/alapi），未登录走平台默认 60s。
    - path: /api/homepage
      upstream: intelligence
      enabled: ${EDGE_ROUTE_HOMEPAGE_INTELLIGENCE:true}
    # ---- media-reference（草场 Slice 8 第二步）→ intelligence-service。----
    # 鉴权三步上传 / confirm / 签名读 / 删除审计；内部上游自动签发身份断言。
    - path: /api/media
      upstream: intelligence
      enabled: ${EDGE_ROUTE_MEDIA_INTELLIGENCE:true}
    # ---- comedy 生成（草场 intelligence Slice 2）→ intelligence-service。路径沿用旧公开契约，
    # /api/comedy-generation/generate-script，前端零改动；扣积分 + 李继刚 prompt 在 intelligence。
    # flag=false 时停用并返回 404。
    - path: /api/comedy-generation
      upstream: intelligence
      enabled: ${EDGE_ROUTE_COMEDY_INTELLIGENCE:true}
    # ---- 朋友圈内容生成（PRD §4.4 图片+文字）→ intelligence-service。
    # POST /api/moments-generation/generate（SSE 非帧流：progress/result/error + [DONE]），
    # 扣 moments_generation 积分；flag=false 时停用并返回 404。
    - path: /api/moments-generation
      upstream: intelligence
      enabled: ${EDGE_ROUTE_MOMENTS_GENERATION_INTELLIGENCE:true}
    # ---- 文章生成（草场 intelligence Slice 3/5）→ intelligence-service。精确 method+path 防误吞未知端点。
    - method: POST
      path: /api/article-generation/titles
      upstream: intelligence
      exact: true
      enabled: ${EDGE_ROUTE_ARTICLE_TITLES_INTELLIGENCE:true}
    - method: POST
      path: /api/article-generation/outline
      upstream: intelligence
      exact: true
      enabled: ${EDGE_ROUTE_ARTICLE_OUTLINE_INTELLIGENCE:true}
    - method: POST
      path: /api/article-generation/content
      upstream: intelligence
      exact: true
      enabled: ${EDGE_ROUTE_ARTICLE_CONTENT_INTELLIGENCE:true}
    # ---- 文章图片（草场 intelligence Slice 5）→ intelligence-service。推荐/搜图各自回滚，
    # 生图与生成图片读取共享一个回滚开关，避免本地文件落在一端却从另一端读取；
    # 三个 POST 为精确叶子，generated-images 保持前缀以匹配 UUID 子路径。
    - method: POST
      path: /api/article-generation/image-recommendations
      upstream: intelligence
      exact: true
      enabled: ${EDGE_ROUTE_ARTICLE_IMAGE_RECOMMENDATIONS_INTELLIGENCE:true}
    - method: POST
      path: /api/article-generation/search-images
      upstream: intelligence
      exact: true
      enabled: ${EDGE_ROUTE_ARTICLE_SEARCH_IMAGES_INTELLIGENCE:true}
    - method: POST
      path: /api/article-generation/generate-image
      upstream: intelligence
      exact: true
      enabled: ${EDGE_ROUTE_ARTICLE_GENERATED_MEDIA_INTELLIGENCE:true}
    - method: GET
      path: /api/article-generation/generated-images
      upstream: intelligence
      enabled: ${EDGE_ROUTE_ARTICLE_GENERATED_MEDIA_INTELLIGENCE:true}
    # ---- 视频制作（草场 intelligence Slice 4 / GL-P3-VIDEO-001）→ intelligence-service。
    # 脚本、异步任务、任务查询和能力探测共用独立开关；关闭后 404。
    - method: POST
      path: /api/video-production/generate-script
      upstream: intelligence
      exact: true
      enabled: ${EDGE_ROUTE_VIDEO_SCRIPT_INTELLIGENCE:true}
    - method: GET
      path: /api/video-production/capabilities
      upstream: intelligence
      exact: true
      enabled: ${EDGE_ROUTE_VIDEO_GENERATION_INTELLIGENCE:true}
    - method: POST
      path: /api/video-production/generate-video
      upstream: intelligence
      exact: true
      enabled: ${EDGE_ROUTE_VIDEO_GENERATION_INTELLIGENCE:true}
    - method: POST
      path: /api/video-production/webhooks
      upstream: intelligence
      exact: false
      enabled: ${EDGE_ROUTE_VIDEO_GENERATION_INTELLIGENCE:true}
    - method: GET
      path: /api/video-production/jobs
      upstream: intelligence
      enabled: ${EDGE_ROUTE_VIDEO_GENERATION_INTELLIGENCE:true}
    - method: POST
      path: /api/video-production/jobs
      upstream: intelligence
      enabled: ${EDGE_ROUTE_VIDEO_GENERATION_INTELLIGENCE:true}
    # ---- 视频改编出图（草场 intelligence Slice 9）→ intelligence-service。
    # 4 个图片端点用 method+path 精确路由，避免捕获未知 sibling；共享一个停用开关。
    - method: POST
      path: /api/video-recreation/generate-asset-image
      upstream: intelligence
      exact: true
      enabled: ${EDGE_ROUTE_VIDEO_RECREATION_IMAGES_INTELLIGENCE:true}
    - method: POST
      path: /api/video-recreation/generate-all-asset-images
      upstream: intelligence
      exact: true
      enabled: ${EDGE_ROUTE_VIDEO_RECREATION_IMAGES_INTELLIGENCE:true}
    - method: POST
      path: /api/video-recreation/generate-scene-image
      upstream: intelligence
      exact: true
      enabled: ${EDGE_ROUTE_VIDEO_RECREATION_IMAGES_INTELLIGENCE:true}
    - method: POST
      path: /api/video-recreation/generate-all-scene-images
      upstream: intelligence
      exact: true
      enabled: ${EDGE_ROUTE_VIDEO_RECREATION_IMAGES_INTELLIGENCE:true}
    # ---- 视频改编内容（草场 intelligence Slice 10）→ intelligence-service。adapt-content 携带
    # multipart（4×5MB + 嵌套 JSON），由 Java 承载；显式 false 停用并返回 404。家族限流由 BFF
    # VideoRecreationRateLimitFilter 在分流前对整个 /api/video-recreation 共享 10/min，不另开桶。
    - method: POST
      path: /api/video-recreation/adapt-content
      upstream: intelligence
      exact: true
      enabled: ${EDGE_ROUTE_VIDEO_RECREATION_ADAPTATION_INTELLIGENCE:true}
    # ---- 图片评价文案（草场 intelligence Slice 6）→ intelligence-service。按 leaf method+path 精确路由，分三域开关：
    # 生成（analyze + step/*）、风格数据（style-preferences* + save-style-memory）、飞书导出（export-feishu）。
    # /analyze 的 20/min 限流由 intelligence 的 ImageAnalysisPreflightFilter 负责。
    - method: POST
      path: /api/image-analysis/analyze
      upstream: intelligence
      exact: true
      enabled: ${EDGE_ROUTE_IMAGE_ANALYSIS_GENERATION_INTELLIGENCE:true}
    - method: POST
      path: /api/image-analysis/step/draft
      upstream: intelligence
      exact: true
      enabled: ${EDGE_ROUTE_IMAGE_ANALYSIS_GENERATION_INTELLIGENCE:true}
    - method: POST
      path: /api/image-analysis/step/optimize
      upstream: intelligence
      exact: true
      enabled: ${EDGE_ROUTE_IMAGE_ANALYSIS_GENERATION_INTELLIGENCE:true}
    - method: POST
      path: /api/image-analysis/step/style-refine
      upstream: intelligence
      exact: true
      enabled: ${EDGE_ROUTE_IMAGE_ANALYSIS_GENERATION_INTELLIGENCE:true}
    - method: GET
      path: /api/image-analysis/style-preferences
      upstream: intelligence
      exact: true
      enabled: ${EDGE_ROUTE_IMAGE_ANALYSIS_STYLE_INTELLIGENCE:true}
    - method: PUT
      path: /api/image-analysis/style-preferences
      upstream: intelligence
      exact: true
      enabled: ${EDGE_ROUTE_IMAGE_ANALYSIS_STYLE_INTELLIGENCE:true}
    - method: POST
      path: /api/image-analysis/style-preferences/optimize
      upstream: intelligence
      exact: true
      enabled: ${EDGE_ROUTE_IMAGE_ANALYSIS_STYLE_INTELLIGENCE:true}
    - method: POST
      path: /api/image-analysis/save-style-memory
      upstream: intelligence
      exact: true
      enabled: ${EDGE_ROUTE_IMAGE_ANALYSIS_STYLE_INTELLIGENCE:true}
    - method: POST
      path: /api/image-analysis/export-feishu
      upstream: intelligence
      exact: true
      enabled: ${EDGE_ROUTE_IMAGE_ANALYSIS_EXPORT_INTELLIGENCE:true}
    # ---- 抖音热点（草场 Slice 13 Stage 1）→ intelligence-service。公开端点，无 auth/credits；
    # exact 精确切，不抢 /api/douyin 媒体子路径（完整媒体路由见下方）。
    - method: GET
      path: /api/douyin/hot-items
      upstream: intelligence
      exact: true
      enabled: ${EDGE_ROUTE_DOUYIN_HOT_ITEMS_INTELLIGENCE:true}
    # ---- Bilibili 完整媒体链路 → intelligence-service。DASH mux、Range、分段分析均由 Java 承载。
    # 同一开关整族启停；显式 false 时 Edge 返回 404。
    - method: POST
      path: /api/bilibili/extract-video
      upstream: intelligence
      exact: true
      enabled: ${EDGE_ROUTE_BILIBILI_MEDIA_INTELLIGENCE:true}
    - method: POST
      path: /api/bilibili/analyze-video
      upstream: intelligence
      exact: true
      enabled: ${EDGE_ROUTE_BILIBILI_MEDIA_INTELLIGENCE:true}
    # ---- Bilibili 视频 proxy/download（草场 Slice 13 Stage 4）→ intelligence-service。GET 前缀路由
    # 覆盖 /api/bilibili/{proxy|download}/{token}；progressive 直连 Range，DASH 先 mux 后本地 Range。
    - method: GET
      path: /api/bilibili/proxy
      upstream: intelligence
      enabled: ${EDGE_ROUTE_BILIBILI_MEDIA_INTELLIGENCE:true}
    - method: GET
      path: /api/bilibili/download
      upstream: intelligence
      enabled: ${EDGE_ROUTE_BILIBILI_MEDIA_INTELLIGENCE:true}
    - method: GET
      path: /api/bilibili/analysis-media
      upstream: intelligence
      enabled: ${EDGE_ROUTE_BILIBILI_MEDIA_INTELLIGENCE:true}
    # ---- Douyin 完整媒体链路 → intelligence-service。含 Playwright session、音频、分段分析和 Range。
    # 同一开关整族启停；显式 false 时 Edge 返回 404。
    - method: POST
      path: /api/douyin/extract-video
      upstream: intelligence
      exact: true
      enabled: ${EDGE_ROUTE_DOUYIN_MEDIA_INTELLIGENCE:true}
    - method: POST
      path: /api/douyin/analyze-video
      upstream: intelligence
      exact: true
      enabled: ${EDGE_ROUTE_DOUYIN_MEDIA_INTELLIGENCE:true}
    - method: GET
      path: /api/douyin/proxy
      upstream: intelligence
      enabled: ${EDGE_ROUTE_DOUYIN_MEDIA_INTELLIGENCE:true}
    - method: GET
      path: /api/douyin/download
      upstream: intelligence
      enabled: ${EDGE_ROUTE_DOUYIN_MEDIA_INTELLIGENCE:true}
    - method: GET
      path: /api/douyin/audio
      upstream: intelligence
      enabled: ${EDGE_ROUTE_DOUYIN_MEDIA_INTELLIGENCE:true}
    - method: GET
      path: /api/douyin/analysis-media
      upstream: intelligence
      enabled: ${EDGE_ROUTE_DOUYIN_MEDIA_INTELLIGENCE:true}
    - path: /api/douyin/session
      upstream: intelligence
      enabled: ${EDGE_ROUTE_DOUYIN_MEDIA_INTELLIGENCE:true}

# 内部身份断言（HLD 7.4 + GL-P0-ASSERT-001 keyring 模式）：
# edge-bff 按 target upstream 选对应签名钥签发用户断言（purpose=user）。
# 每个受众服务一把独立钥，泄露某服务验签钥只影响该服务。
identity-assertion:
  enabled: ${IDENTITY_ASSERTION_ENABLED:false}
  # keyring 模式必须设置 issuer（edge-bff）
  issuer: ${IDENTITY_ASSERTION_ISSUER:edge-bff}
  ttl-seconds: ${IDENTITY_ASSERTION_TTL_SECONDS:60}
  header-name: ${IDENTITY_ASSERTION_HEADER_NAME:X-Grassland-Identity}
  leeway-seconds: ${IDENTITY_ASSERTION_LEEWAY_SECONDS:5}
  # edge-bff 签发用户断言到各领域服务（purpose=user）
  signing-keys:
    - kid: ${IDENTITY_ASSERTION_KEY_EDGE_USER_IDENTITY_KID:edge-user-identity-v1}
      purpose: user
      audience: grassland-identity
      secret: ${IDENTITY_ASSERTION_KEY_EDGE_USER_IDENTITY:}
    - kid: ${IDENTITY_ASSERTION_KEY_EDGE_USER_MARKETPLACE_KID:edge-user-marketplace-v1}
      purpose: user
      audience: grassland-marketplace
      secret: ${IDENTITY_ASSERTION_KEY_EDGE_USER_MARKETPLACE:}
    - kid: ${IDENTITY_ASSERTION_KEY_EDGE_USER_FINANCE_KID:edge-user-finance-v1}
      purpose: user
      audience: grassland-finance
      secret: ${IDENTITY_ASSERTION_KEY_EDGE_USER_FINANCE:}
    - kid: ${IDENTITY_ASSERTION_KEY_EDGE_USER_TRUST_KID:edge-user-trust-v1}
      purpose: user
      audience: grassland-trust
      secret: ${IDENTITY_ASSERTION_KEY_EDGE_USER_TRUST:}
    - kid: ${IDENTITY_ASSERTION_KEY_EDGE_USER_INTELLIGENCE_KID:edge-user-intelligence-v1}
      purpose: user
      audience: grassland-intelligence
      secret: ${IDENTITY_ASSERTION_KEY_EDGE_USER_INTELLIGENCE:}
  # replay 防护：生产 Compose 使用 Redis 跨副本原子消费；memory 仅限单实例测试。
  replay-protection:
    enabled: ${IDENTITY_ASSERTION_REPLAY_ENABLED:false}
    storage: ${IDENTITY_ASSERTION_REPLAY_STORAGE:redis}
    redis-url: ${IDENTITY_ASSERTION_REPLAY_REDIS_URL:}
    key-prefix: ${IDENTITY_ASSERTION_REPLAY_KEY_PREFIX:grassland:identity-assertion:replay:}

identity:
  session:
    cookie-name: ${SESSION_COOKIE_NAME:y1.sid}
    secret: ${SESSION_SECRET:}
