spring:
  application:
    name: trust-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
        max.block.ms: 5000
        retries: 5
  temporal:
    # 连接：容器内 service name（temporal:7233），本地 bootRun 注 localhost:7233。
    connection:
      target: ${TEMPORAL_TARGET:temporal:7233}
    # 显式 worker：trust-adjudication 承载审判 workflow 与其 activity。
    workers:
      - name: trust-adjudication
        task-queue: trust-adjudication
    # 自动发现 workflow/activity（com.grassland.trust.workflow 递归覆盖）。
    workers-auto-discovery:
      packages:
        - com.grassland.trust.workflow
    # 测试隔离：IT/纯 context 测试置 true 用内存 test server，不依赖 temporal 容器。
    test-server:
      enabled: ${TEMPORAL_TEST_SERVER:false}
server:
  port: ${SERVER_PORT:8085}
management:
  endpoints:
    web:
      exposure:
        include: health,info

# DB 地基（Epic 6 Slice 6A）：从 DATABASE_URL 派生 JDBC(Flyway)+R2DBC；独立 Flyway 历史表 trust_flyway_schema。
trust:
  datasource:
    from-database-url: ${TRUST_DATASOURCE_FROM_DATABASE_URL:false}
  outbox:
    topic: ${TRUST_OUTBOX_TOPIC:grassland.trust.events}
    enabled: ${TRUST_OUTBOX_ENABLED:true}
    poll-interval-ms: ${TRUST_OUTBOX_POLL_INTERVAL_MS:2000}
    batch-size: ${TRUST_OUTBOX_BATCH_SIZE:50}
    max-concurrency: ${TRUST_OUTBOX_MAX_CONCURRENCY:8}
    ack-timeout-ms: ${TRUST_OUTBOX_ACK_TIMEOUT_MS:10000}
    claim-lease-ms: ${TRUST_OUTBOX_CLAIM_LEASE_MS:300000}
    initial-backoff-ms: ${TRUST_OUTBOX_INITIAL_BACKOFF_MS:1000}
    max-backoff-ms: ${TRUST_OUTBOX_MAX_BACKOFF_MS:60000}
  # 审判 adjudication（Slice 6C）：7 官面板 / 24h 投票 / 平票重开轮次 / 上诉窗口 / 审判官资格阈值（声誉模块未建，占位）。
  adjudication:
    panel-size: ${TRUST_ADJUDICATION_PANEL_SIZE:7}
    vote-window-hours: ${TRUST_ADJUDICATION_VOTE_WINDOW_HOURS:24}
    max-rounds: ${TRUST_ADJUDICATION_MAX_ROUNDS:2}
    appeal-window-hours: ${TRUST_ADJUDICATION_APPEAL_WINDOW_HOURS:48}
    # 秒级覆盖（>0 时优先于上面的小时值）：窗口原本最小 1 小时，dev/e2e 无法验证
    # 「窗口到期→自动 tally→decided→上诉窗口→终局」这条时间驱动主链路。
    # 对齐 marketplace 的 SETTLEMENT_WINDOW_SECONDS 约定；生产留 0 即用小时值。
    vote-window-seconds: ${TRUST_ADJUDICATION_VOTE_WINDOW_SECONDS:0}
    appeal-window-seconds: ${TRUST_ADJUDICATION_APPEAL_WINDOW_SECONDS:0}
    judge-eligibility-tier: ${TRUST_ADJUDICATION_JUDGE_ELIGIBILITY_TIER:1}

# 跨服务调 finance（Slice 6C ReleaseHoldAndApplyDecision 出站 base url）。
finance:
  service:
    base-url: ${FINANCE_SERVICE_BASE_URL:http://finance-service:8084}

# 跨服务调 marketplace（Slice 12 安全收口：开争议前查参与方授权 + canonical task organization）。
marketplace:
  service:
    base-url: ${MARKETPLACE_SERVICE_BASE_URL:http://marketplace-service:8083}


# 内部身份断言（GL-P0-ASSERT-001 keyring 模式）：
# trust 签发服务断言到 finance/marketplace（purpose=service），
# 验证 edge-bff 用户断言 + marketplace 服务断言。
identity-assertion:
  enabled: ${IDENTITY_ASSERTION_ENABLED:false}
  issuer: ${IDENTITY_ASSERTION_ISSUER:trust}
  header-name: ${IDENTITY_ASSERTION_HEADER_NAME:X-Grassland-Identity}
  # trust 签发服务断言到下游（purpose=service）
  signing-keys:
    - kid: ${IDENTITY_ASSERTION_KEY_TRUST_SERVICE_FINANCE_KID:trust-service-finance-v1}
      purpose: service
      audience: grassland-finance
      secret: ${IDENTITY_ASSERTION_KEY_TRUST_SERVICE_FINANCE:}
    - kid: ${IDENTITY_ASSERTION_KEY_TRUST_SERVICE_MARKETPLACE_KID:trust-service-marketplace-v1}
      purpose: service
      audience: grassland-marketplace
      secret: ${IDENTITY_ASSERTION_KEY_TRUST_SERVICE_MARKETPLACE:}
  # trust 验证 edge-bff 用户断言 + marketplace 服务断言
  verify-keys:
    - kid: ${IDENTITY_ASSERTION_KEY_EDGE_USER_TRUST_KID:edge-user-trust-v1}
      issuer: edge-bff
      purpose: user
      audience: grassland-trust
      secret: ${IDENTITY_ASSERTION_KEY_EDGE_USER_TRUST:}
    - kid: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_TRUST_KID:marketplace-service-trust-v1}
      issuer: marketplace
      purpose: service
      audience: grassland-trust
      secret: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_TRUST:}
  replay-protection:
    enabled: ${IDENTITY_ASSERTION_REPLAY_ENABLED:false}
