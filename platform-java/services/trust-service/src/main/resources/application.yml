spring:
  application:
    name: trust-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    template:
      observation-enabled: true
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-512}
      sasl.jaas.config: org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME:}" password="${KAFKA_PASSWORD:}";
      ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
      ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
      ssl.truststore.type: ${KAFKA_SSL_TRUSTSTORE_TYPE:PKCS12}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
        max.block.ms: 5000
        retries: 5
  temporal:
    # 连接：容器内 service name（temporal:7233），本地 bootRun 注 localhost:7233。
    connection:
      target: ${TEMPORAL_TARGET:temporal:7233}
      enable-https: ${TEMPORAL_ENABLE_HTTPS:false}
    namespace: ${TEMPORAL_NAMESPACE:default}
    # 显式 worker：trust-adjudication 承载审判 workflow 与其 activity。
    workers:
      - name: trust-adjudication
        task-queue: trust-adjudication
    # 自动发现 workflow/activity（com.grassland.trust.workflow 递归覆盖）。
    workers-auto-discovery:
      packages:
        - com.grassland.trust.workflow
    # 测试隔离：IT/纯 context 测试置 true 用内存 test server，不依赖 temporal 容器。
    test-server:
      enabled: ${TEMPORAL_TEST_SERVER:false}
server:
  port: ${SERVER_PORT:8085}
management:
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    export:
      enabled: ${OTEL_TRACING_ENABLED:false}
      otlp:
        enabled: ${OTEL_EXPORT_ENABLED:false}
    sampling:
      probability: ${OTEL_TRACING_SAMPLING_PROBABILITY:0.1}
    propagation:
      consume: W3C
      produce: W3C
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:}
  server:
    port: ${MANAGEMENT_SERVER_PORT:9082}
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

# DB 地基（Epic 6 Slice 6A）：从 DATABASE_URL 派生 JDBC(Flyway)+R2DBC；独立 Flyway 历史表 trust_flyway_schema。
trust:
  datasource:
    from-database-url: ${TRUST_DATASOURCE_FROM_DATABASE_URL:false}
  outbox:
    topic: ${TRUST_OUTBOX_TOPIC:grassland.trust.events}
    enabled: ${TRUST_OUTBOX_ENABLED:true}
    poll-interval-ms: ${TRUST_OUTBOX_POLL_INTERVAL_MS:2000}
    batch-size: ${TRUST_OUTBOX_BATCH_SIZE:50}
    max-concurrency: ${TRUST_OUTBOX_MAX_CONCURRENCY:8}
    ack-timeout-ms: ${TRUST_OUTBOX_ACK_TIMEOUT_MS:10000}
    claim-lease-ms: ${TRUST_OUTBOX_CLAIM_LEASE_MS:300000}
    initial-backoff-ms: ${TRUST_OUTBOX_INITIAL_BACKOFF_MS:1000}
    max-backoff-ms: ${TRUST_OUTBOX_MAX_BACKOFF_MS:60000}
  marketplace-consumer:
    enabled: ${TRUST_MARKETPLACE_CONSUMER_ENABLED:true}
    topic: ${TRUST_MARKETPLACE_CONSUMER_TOPIC:grassland.marketplace.events}
    group-id: ${TRUST_MARKETPLACE_CONSUMER_GROUP_ID:trust-marketplace-reputation}
    auto-startup: ${TRUST_MARKETPLACE_CONSUMER_AUTO_STARTUP:true}
  evidence:
    retention-days: ${TRUST_EVIDENCE_RETENTION_DAYS:365}
    pseudonym-secret: ${TRUST_EVIDENCE_PSEUDONYM_SECRET:}
  # 审判 adjudication：7 官面板 / 24h 投票 / 平票重开轮次 / 上诉窗口 / Lv5+运营准入。
  adjudication:
    panel-size: ${TRUST_ADJUDICATION_PANEL_SIZE:7}
    vote-window-hours: ${TRUST_ADJUDICATION_VOTE_WINDOW_HOURS:24}
    max-rounds: ${TRUST_ADJUDICATION_MAX_ROUNDS:2}
    appeal-window-hours: ${TRUST_ADJUDICATION_APPEAL_WINDOW_HOURS:48}
    # GL-P2-TRUST-001：争议开启后需等待的小时数才可启动审判（默认 48h）
    adjudication-window-hours: ${TRUST_ADJUDICATION_WINDOW_HOURS:48}
    # GL-P2-TRUST-001 T4：审判启动窗口总开关。1=启用（生产默认，争议开后须等 48h 才能开审，
    # 让双方有时间自行解决/补充证据）；0=禁用（测试环境跳过，见 TrustItSupport）。
    # 历史上该键缺失 → 绑定 Java int 默认 0 → 窗口静默禁用（注释却写"默认启用"），本轮修正。
    adjudication-window-enabled: ${TRUST_ADJUDICATION_WINDOW_ENABLED:1}
    # GL-P2-TRUST-001 T5：争议冷却期秒级覆盖（>0 时优先于 dispute-cooldown-hours），dev/e2e 用。
    dispute-cooldown-seconds: ${TRUST_ADJUDICATION_DISPUTE_COOLDOWN_SECONDS:0}
    # 任务书 #31 / ADR-D15：审判官每票激励积分（平坦 per-vote；0=关闭）。默认 20。
    judge-reward-credits-per-vote: ${TRUST_JUDGE_REWARD_CREDITS_PER_VOTE:20}
    # GL-P2-TRUST-001：争议终局后冷却期，防止恶意重复开争议（默认 7 天=168h）
    dispute-cooldown-hours: ${TRUST_ADJUDICATION_DISPUTE_COOLDOWN_HOURS:168}
    # 秒级覆盖（>0 时优先于上面的小时值）：窗口原本最小 1 小时，dev/e2e 无法验证
    # 「窗口到期→自动 tally→decided→上诉窗口→终局」这条时间驱动主链路。
    # 对齐 marketplace 的 SETTLEMENT_WINDOW_SECONDS 约定；生产留 0 即用小时值。
    vote-window-seconds: ${TRUST_ADJUDICATION_VOTE_WINDOW_SECONDS:0}
    appeal-window-seconds: ${TRUST_ADJUDICATION_APPEAL_WINDOW_SECONDS:0}
    adjudication-window-seconds: ${TRUST_ADJUDICATION_WINDOW_SECONDS:0}
    judge-eligibility-tier: ${TRUST_ADJUDICATION_JUDGE_ELIGIBILITY_TIER:5}
    dispatcher:
      enabled: ${TRUST_ADJUDICATION_DISPATCHER_ENABLED:true}
      poll-ms: ${TRUST_ADJUDICATION_DISPATCHER_POLL_MS:2000}
      batch-size: ${TRUST_ADJUDICATION_DISPATCHER_BATCH_SIZE:32}

# 跨服务调 finance（Slice 6C ReleaseHoldAndApplyDecision 出站 base url）。
finance:
  service:
    base-url: ${FINANCE_SERVICE_BASE_URL:http://finance-service:8084}

# 跨服务调 marketplace（Slice 12 安全收口：开争议前查参与方授权 + canonical task organization）。
marketplace:
  service:
    base-url: ${MARKETPLACE_SERVICE_BASE_URL:http://marketplace-service:8083}
    reputation-timeout-seconds: ${MARKETPLACE_REPUTATION_TIMEOUT_SECONDS:3}


# 内部身份断言（GL-P0-ASSERT-001 keyring 模式）：
# trust 签发服务断言到 finance/marketplace/identity（purpose=service），
# 验证 edge-bff 用户断言 + marketplace 服务断言。
identity-assertion:
  enabled: ${IDENTITY_ASSERTION_ENABLED:false}
  issuer: ${IDENTITY_ASSERTION_ISSUER:trust}
  header-name: ${IDENTITY_ASSERTION_HEADER_NAME:X-Grassland-Identity}
  # trust 签发服务断言到下游（purpose=service）
  signing-keys:
    - kid: ${IDENTITY_ASSERTION_KEY_TRUST_SERVICE_FINANCE_KID:trust-service-finance-v1}
      purpose: service
      audience: grassland-finance
      secret: ${IDENTITY_ASSERTION_KEY_TRUST_SERVICE_FINANCE:}
    - kid: ${IDENTITY_ASSERTION_KEY_TRUST_SERVICE_MARKETPLACE_KID:trust-service-marketplace-v1}
      purpose: service
      audience: grassland-marketplace
      secret: ${IDENTITY_ASSERTION_KEY_TRUST_SERVICE_MARKETPLACE:}
    - kid: ${IDENTITY_ASSERTION_KEY_TRUST_SERVICE_IDENTITY_KID:trust-service-identity-v1}
      purpose: service
      audience: grassland-identity
      secret: ${IDENTITY_ASSERTION_KEY_TRUST_SERVICE_IDENTITY:}
  # trust 验证 edge-bff 用户断言 + marketplace 服务断言
  verify-keys:
    - kid: ${IDENTITY_ASSERTION_KEY_EDGE_USER_TRUST_KID:edge-user-trust-v1}
      issuer: edge-bff
      purpose: user
      audience: grassland-trust
      secret: ${IDENTITY_ASSERTION_KEY_EDGE_USER_TRUST:}
    - kid: ${IDENTITY_ASSERTION_KEY_EDGE_USER_TRUST_PREVIOUS_KID:}
      issuer: edge-bff
      purpose: user
      audience: grassland-trust
      secret: ${IDENTITY_ASSERTION_KEY_EDGE_USER_TRUST_PREVIOUS:}
    - kid: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_TRUST_KID:marketplace-service-trust-v1}
      issuer: marketplace
      purpose: service
      audience: grassland-trust
      secret: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_TRUST:}
    - kid: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_TRUST_PREVIOUS_KID:}
      issuer: marketplace
      purpose: service
      audience: grassland-trust
      secret: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_TRUST_PREVIOUS:}
  replay-protection:
    enabled: ${IDENTITY_ASSERTION_REPLAY_ENABLED:false}
    storage: ${IDENTITY_ASSERTION_REPLAY_STORAGE:redis}
    redis-url: ${IDENTITY_ASSERTION_REPLAY_REDIS_URL:}
    key-prefix: ${IDENTITY_ASSERTION_REPLAY_KEY_PREFIX:grassland:identity-assertion:replay:}

identity:
  service:
    base-url: ${IDENTITY_SERVICE_BASE_URL:http://identity-service:8082}
    membership-timeout-seconds: ${IDENTITY_MEMBERSHIP_TIMEOUT_SECONDS:3}
