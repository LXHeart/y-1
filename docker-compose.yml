services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
      - "9002:9002"  # 草场 Slice 11 Stage 3: MinIO CORS 反代端口
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      CORS_ORIGIN: ${CORS_ORIGIN}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      DOUYIN_FETCH_TIMEOUT_MS: ${DOUYIN_FETCH_TIMEOUT_MS:-15000}
      DOUYIN_LOGIN_TIMEOUT_MS: ${DOUYIN_LOGIN_TIMEOUT_MS:-180000}
      DOUYIN_LOGIN_URL: ${DOUYIN_LOGIN_URL:-https://www.douyin.com/}
      DOUYIN_STORAGE_STATE_PATH: ${DOUYIN_STORAGE_STATE_PATH:-server/.data/douyin-storage-state.json}
      DOUYIN_MEDIA_PROCESS_TIMEOUT_MS: ${DOUYIN_MEDIA_PROCESS_TIMEOUT_MS:-45000}
      DOUYIN_MEDIA_TEMP_DIR: ${DOUYIN_MEDIA_TEMP_DIR:-server/.data/douyin-audio}
      DOUYIN_USER_AGENT: ${DOUYIN_USER_AGENT}
      DOUYIN_PROXY_TOKEN_SECRET: ${DOUYIN_PROXY_TOKEN_SECRET}
      PUBLIC_BACKEND_ORIGIN: ${PUBLIC_BACKEND_ORIGIN}
      VIDEO_ANALYSIS_API_PATH: ${VIDEO_ANALYSIS_API_PATH:-}
      VIDEO_ANALYSIS_API_TIMEOUT_MS: ${VIDEO_ANALYSIS_API_TIMEOUT_MS:-180000}
      BILIBILI_FETCH_TIMEOUT_MS: ${BILIBILI_FETCH_TIMEOUT_MS:-15000}
      BILIBILI_MEDIA_TEMP_DIR: ${BILIBILI_MEDIA_TEMP_DIR:-server/.data/bilibili-media}
      BILIBILI_USER_AGENT: ${BILIBILI_USER_AGENT}
      BILIBILI_PROXY_TOKEN_SECRET: ${BILIBILI_PROXY_TOKEN_SECRET}
      FFMPEG_PATH: ${FFMPEG_PATH:-ffmpeg}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      # GL-P0-AUTH-001：cookie 属性须与 identity-service 完全一致（同一张 session 表）。
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-y1.sid}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-auto}
      SESSION_COOKIE_SAME_SITE: ${SESSION_COOKIE_SAME_SITE:-Lax}
      # 生产（HTTPS 入口）置 1 开 HSTS；HTTP 入口下即使置 1 也不会发（见 security-headers.ts）。
      SECURITY_HSTS_ENABLED: ${SECURITY_HSTS_ENABLED:-0}
      IDENTITY_DATASOURCE_FROM_DATABASE_URL: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # 草场 intelligence → legacy credits 过渡通道的共享密钥（两端同值；未配则 legacy 端点 fail-closed 503）。
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - backend_data:/app/server/.data
    restart: unless-stopped

  # 可选 Java identity-service（Epic 2 Slice 2A）：只读 legacy session/app_users，提供 /internal/identity/me。
  # 仅在使用 --profile java-edge 时启动；复用 backend 的 DATABASE_URL（自动派生 r2dbc）。
  identity-service:
    profiles: ["java-edge"]
    build:
      context: ./platform-java
      dockerfile: services/identity-service/Dockerfile
    environment:
      SERVER_PORT: "8082"
      DATABASE_URL: ${DATABASE_URL:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      # GL-P0-AUTH-001：与 backend 同值，否则同一张 session 表上会写出属性不一致的 cookie。
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-y1.sid}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-auto}
      SESSION_COOKIE_SAME_SITE: ${SESSION_COOKIE_SAME_SITE:-Lax}
      SESSION_COOKIE_MAX_AGE_MS: ${SESSION_COOKIE_MAX_AGE_MS:-0}
      IDENTITY_DATASOURCE_FROM_DATABASE_URL: "true"
      # HLD 7.4 内部身份断言消费（与 edge-bff 同 secret/audience）；复用 SESSION_SECRET 保证一致。
      IDENTITY_ASSERTION_ENABLED: "true"
      IDENTITY_ASSERTION_ISSUER: ${IDENTITY_ASSERTION_ISSUER:-identity}
      IDENTITY_ASSERTION_KEY_EDGE_USER_IDENTITY_KID: ${IDENTITY_ASSERTION_KEY_EDGE_USER_IDENTITY_KID:-edge-user-identity-v1}
      IDENTITY_ASSERTION_KEY_EDGE_USER_IDENTITY: ${IDENTITY_ASSERTION_KEY_EDGE_USER_IDENTITY:-}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Slice 12 通知中心：消费 identity 自有 topic 派生站内通知。默认开（与 marketplace trust-consumer 同款）。
      IDENTITY_NOTIFICATION_CONSUMER_ENABLED: "true"
      # Slice 12 Stage 3：同时消费 marketplace / trust / finance topic（报名/凭证退回/结算/争议/钱包通知）。
      IDENTITY_NOTIFICATION_EXTERNAL_ENABLED: "true"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      backend:
        condition: service_started
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # 可选 Java Edge BFF 评估入口。
  # 仅在使用 --profile java-edge 时启动；默认不参与，且 Nginx 仍直连 backend:3000。
  # /api/auth/me 经 RouteManifest 路由到 identity-service，其余透传 Express。
  edge-bff:
    profiles: ["java-edge"]
    build:
      context: ./platform-java
      dockerfile: services/edge-bff/Dockerfile
    environment:
      SERVER_PORT: "8080"
      LEGACY_EXPRESS_BASE_URL: http://backend:3000
      IDENTITY_SERVICE_BASE_URL: http://identity-service:8082
      MARKETPLACE_SERVICE_BASE_URL: http://marketplace-service:8083
      FINANCE_SERVICE_BASE_URL: http://finance-service:8084
      TRUST_SERVICE_BASE_URL: http://trust-service:8085
      INTELLIGENCE_SERVICE_BASE_URL: http://intelligence-service:8086
      EDGE_ROUTE_AUTH_ME_IDENTITY: "true"
      EDGE_ROUTE_TASKS_MARKETPLACE: "true"
      EDGE_ROUTE_ARTICLE_IMAGE_RECOMMENDATIONS_INTELLIGENCE: "true"
      EDGE_ROUTE_ARTICLE_SEARCH_IMAGES_INTELLIGENCE: "true"
      EDGE_ROUTE_ARTICLE_GENERATED_MEDIA_INTELLIGENCE: "true"
      # Slice 13 Stage 3/4/5 Bilibili 媒体链路：默认 false，显式注入以便灰度启用/一键回退。
      EDGE_ROUTE_BILIBILI_MEDIA_INTELLIGENCE: ${EDGE_ROUTE_BILIBILI_MEDIA_INTELLIGENCE:-false}
      # HLD 7.4：直读 session 表签发内部身份断言（DATABASE_URL 复用 identity 库，只读；secret 与 identity-service 一致）。
      EDGE_IDENTITY_FROM_DATABASE_URL: "true"
      DATABASE_URL: ${DATABASE_URL:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-y1.sid}
      # GL-P0-ASSERT-001 keyring 模式：edge-bff 签发用户断言到各领域服务
      IDENTITY_ASSERTION_ENABLED: "true"
      IDENTITY_ASSERTION_ISSUER: ${IDENTITY_ASSERTION_ISSUER:-edge-bff}
      IDENTITY_ASSERTION_KEY_EDGE_USER_IDENTITY_KID: ${IDENTITY_ASSERTION_KEY_EDGE_USER_IDENTITY_KID:-edge-user-identity-v1}
      IDENTITY_ASSERTION_KEY_EDGE_USER_IDENTITY: ${IDENTITY_ASSERTION_KEY_EDGE_USER_IDENTITY:-}
      IDENTITY_ASSERTION_KEY_EDGE_USER_MARKETPLACE_KID: ${IDENTITY_ASSERTION_KEY_EDGE_USER_MARKETPLACE_KID:-edge-user-marketplace-v1}
      IDENTITY_ASSERTION_KEY_EDGE_USER_MARKETPLACE: ${IDENTITY_ASSERTION_KEY_EDGE_USER_MARKETPLACE:-}
      IDENTITY_ASSERTION_KEY_EDGE_USER_FINANCE_KID: ${IDENTITY_ASSERTION_KEY_EDGE_USER_FINANCE_KID:-edge-user-finance-v1}
      IDENTITY_ASSERTION_KEY_EDGE_USER_FINANCE: ${IDENTITY_ASSERTION_KEY_EDGE_USER_FINANCE:-}
      IDENTITY_ASSERTION_KEY_EDGE_USER_TRUST_KID: ${IDENTITY_ASSERTION_KEY_EDGE_USER_TRUST_KID:-edge-user-trust-v1}
      IDENTITY_ASSERTION_KEY_EDGE_USER_TRUST: ${IDENTITY_ASSERTION_KEY_EDGE_USER_TRUST:-}
      IDENTITY_ASSERTION_KEY_EDGE_USER_INTELLIGENCE_KID: ${IDENTITY_ASSERTION_KEY_EDGE_USER_INTELLIGENCE_KID:-edge-user-intelligence-v1}
      IDENTITY_ASSERTION_KEY_EDGE_USER_INTELLIGENCE: ${IDENTITY_ASSERTION_KEY_EDGE_USER_INTELLIGENCE:-}
    ports:
      - "${EDGE_BFF_PORT:-8081}:8080"
    depends_on:
      - backend
      - identity-service
      - marketplace-service
      - finance-service
      - trust-service
      - intelligence-service
    restart: unless-stopped

  # 可选 Java marketplace-service（Epic 4）：任务/报名/履约。profile java-edge。
  # 独立 Flyway 历史（marketplace_flyway_schema）；与 identity 共用 neon；消费 BFF 断言。
  marketplace-service:
    profiles: ["java-edge"]
    build:
      context: ./platform-java
      dockerfile: services/marketplace-service/Dockerfile
    # 不发布宿主端口（GL-P0-SEC-002）：仅 Docker 网络内可达，同 identity-service。
    # 容器间调用走服务名（MARKETPLACE_SERVICE_BASE_URL=http://marketplace-service:8083）。
    # 对外入口只有 Nginx :80 与 edge-bff（java-edge profile）。
    environment:
      SERVER_PORT: "8083"
      DATABASE_URL: ${DATABASE_URL:-}
      MARKETPLACE_DATASOURCE_FROM_DATABASE_URL: "true"
      # GL-P0-ASSERT-001 keyring 模式：marketplace 签发服务断言到 finance/trust/intelligence，验证 edge-bff 用户断言
      IDENTITY_ASSERTION_ENABLED: "true"
      IDENTITY_ASSERTION_ISSUER: ${IDENTITY_ASSERTION_ISSUER:-marketplace}
      IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_FINANCE_KID: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_FINANCE_KID:-marketplace-service-finance-v1}
      IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_FINANCE: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_FINANCE:-}
      IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_TRUST_KID: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_TRUST_KID:-marketplace-service-trust-v1}
      IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_TRUST: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_TRUST:-}
      IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_INTELLIGENCE_KID: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_INTELLIGENCE_KID:-marketplace-service-intelligence-v1}
      IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_INTELLIGENCE: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_INTELLIGENCE:-}
      IDENTITY_ASSERTION_KEY_EDGE_USER_MARKETPLACE_KID: ${IDENTITY_ASSERTION_KEY_EDGE_USER_MARKETPLACE_KID:-edge-user-marketplace-v1}
      IDENTITY_ASSERTION_KEY_EDGE_USER_MARKETPLACE: ${IDENTITY_ASSERTION_KEY_EDGE_USER_MARKETPLACE:-}
      # 无 MinIO 凭据：媒体上传走 intelligence-service 鉴权链路（GL-P0-SEC-002）
      TEMPORAL_TARGET: temporal:7233
      TEMPORAL_TEST_SERVER: ${TEMPORAL_TEST_SERVER:-false}
      SETTLEMENT_WINDOW_SECONDS: ${SETTLEMENT_WINDOW_SECONDS:-5}
      FINANCE_SERVICE_BASE_URL: http://finance-service:8084
      TRUST_SERVICE_BASE_URL: http://trust-service:8085
      INTELLIGENCE_SERVICE_BASE_URL: http://intelligence-service:8086
      MARKETPLACE_TRUST_CONSUMER_ENABLED: ${MARKETPLACE_TRUST_CONSUMER_ENABLED:-true}
    depends_on:
      backend:
        condition: service_started
      minio:
        condition: service_started
      temporal:
        condition: service_started
      finance-service:
        condition: service_started
      trust-service:
        condition: service_started
      intelligence-service:
        condition: service_started
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # 可选 Java finance-service（Epic 4 Slice 4D）：账户/余额地基。profile java-edge。
  # 独立 Flyway 历史（finance_flyway_schema）；与 identity/marketplace 共用 neon；消费 BFF 断言。
  # 为后续「接受报名→资金预留→激活/补偿」Saga 扫清依赖（ReserveFunds/escrow 留后续 slice）。
  finance-service:
    profiles: ["java-edge"]
    build:
      context: ./platform-java
      dockerfile: services/finance-service/Dockerfile
    # 不发布宿主端口（GL-P0-SEC-002）：仅 Docker 网络内可达，同 identity-service。
    environment:
      SERVER_PORT: "8084"
      DATABASE_URL: ${DATABASE_URL:-}
      FINANCE_DATASOURCE_FROM_DATABASE_URL: "true"
      # GL-P0-ASSERT-001 keyring 模式：finance 验证 edge-bff 用户断言 + marketplace/trust 服务断言
      IDENTITY_ASSERTION_ENABLED: "true"
      IDENTITY_ASSERTION_ISSUER: ${IDENTITY_ASSERTION_ISSUER:-finance}
      IDENTITY_ASSERTION_KEY_EDGE_USER_FINANCE_KID: ${IDENTITY_ASSERTION_KEY_EDGE_USER_FINANCE_KID:-edge-user-finance-v1}
      IDENTITY_ASSERTION_KEY_EDGE_USER_FINANCE: ${IDENTITY_ASSERTION_KEY_EDGE_USER_FINANCE:-}
      IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_FINANCE_KID: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_FINANCE_KID:-marketplace-service-finance-v1}
      IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_FINANCE: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_FINANCE:-}
      IDENTITY_ASSERTION_KEY_TRUST_SERVICE_FINANCE_KID: ${IDENTITY_ASSERTION_KEY_TRUST_SERVICE_FINANCE_KID:-trust-service-finance-v1}
      IDENTITY_ASSERTION_KEY_TRUST_SERVICE_FINANCE: ${IDENTITY_ASSERTION_KEY_TRUST_SERVICE_FINANCE:-}
    depends_on:
      backend:
        condition: service_started
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # 可选 Java trust-service（Epic 6 Slice 6A）：争议受理（dispute-case）。profile java-edge。
  # 独立 Flyway 历史（trust_flyway_schema）；与 identity/marketplace/finance 共用 neon；消费 BFF/服务断言。
  trust-service:
    profiles: ["java-edge"]
    build:
      context: ./platform-java
      dockerfile: services/trust-service/Dockerfile
    # 不发布宿主端口（GL-P0-SEC-002）：仅 Docker 网络内可达，同 identity-service。
    environment:
      SERVER_PORT: "8085"
      DATABASE_URL: ${DATABASE_URL:-}
      TRUST_DATASOURCE_FROM_DATABASE_URL: "true"
      # dev 窗口缩到 60s（生产为 24h/48h），使「窗口到期→自动 tally→decided→上诉窗口→终局」
      # 这条时间驱动主链路可在本地实跑验证。对齐 SETTLEMENT_WINDOW_SECONDS 约定。
      TRUST_ADJUDICATION_VOTE_WINDOW_SECONDS: ${TRUST_ADJUDICATION_VOTE_WINDOW_SECONDS:-60}
      TRUST_ADJUDICATION_APPEAL_WINDOW_SECONDS: ${TRUST_ADJUDICATION_APPEAL_WINDOW_SECONDS:-60}
      # GL-P0-ASSERT-001 keyring 模式：trust 签发服务断言到 finance/marketplace，验证 edge-bff 用户断言 + marketplace 服务断言
      IDENTITY_ASSERTION_ENABLED: "true"
      IDENTITY_ASSERTION_ISSUER: ${IDENTITY_ASSERTION_ISSUER:-trust}
      IDENTITY_ASSERTION_KEY_TRUST_SERVICE_FINANCE_KID: ${IDENTITY_ASSERTION_KEY_TRUST_SERVICE_FINANCE_KID:-trust-service-finance-v1}
      IDENTITY_ASSERTION_KEY_TRUST_SERVICE_FINANCE: ${IDENTITY_ASSERTION_KEY_TRUST_SERVICE_FINANCE:-}
      IDENTITY_ASSERTION_KEY_TRUST_SERVICE_MARKETPLACE_KID: ${IDENTITY_ASSERTION_KEY_TRUST_SERVICE_MARKETPLACE_KID:-trust-service-marketplace-v1}
      IDENTITY_ASSERTION_KEY_TRUST_SERVICE_MARKETPLACE: ${IDENTITY_ASSERTION_KEY_TRUST_SERVICE_MARKETPLACE:-}
      IDENTITY_ASSERTION_KEY_EDGE_USER_TRUST_KID: ${IDENTITY_ASSERTION_KEY_EDGE_USER_TRUST_KID:-edge-user-trust-v1}
      IDENTITY_ASSERTION_KEY_EDGE_USER_TRUST: ${IDENTITY_ASSERTION_KEY_EDGE_USER_TRUST:-}
      IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_TRUST_KID: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_TRUST_KID:-marketplace-service-trust-v1}
      IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_TRUST: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_TRUST:-}
      # Slice 12 安全收口：开争议前查参与方授权 + canonical task organization（不经 BFF）。
      MARKETPLACE_SERVICE_BASE_URL: http://marketplace-service:8083
    depends_on:
      backend:
        condition: service_started
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # 可选 Java intelligence-service（草场 intelligence Slice 1）：AI 基建层 + 冒烟端点。profile java-edge。
  # 独立 Flyway 历史（intelligence_flyway_schema）；平台默认 Qwen（env 注入，不读 legacy per-user 设置）；
  # 积分经共享密钥走 legacy 内部端点（直连 backend，不经 BFF，避免 intelligence↔BFF 循环）。
  intelligence-service:
    profiles: ["java-edge"]
    build:
      context: ./platform-java
      dockerfile: services/intelligence-service/Dockerfile
    # 不发布宿主端口（GL-P0-SEC-002）：仅 Docker 网络内可达，同 identity-service。
    environment:
      SERVER_PORT: "8086"
      DATABASE_URL: ${DATABASE_URL:-}
      INTELLIGENCE_DATASOURCE_FROM_DATABASE_URL: "true"
      # GL-P0-ASSERT-001 keyring 模式：intelligence 验证 edge-bff 用户断言 + marketplace 服务断言
      IDENTITY_ASSERTION_ENABLED: "true"
      IDENTITY_ASSERTION_ISSUER: ${IDENTITY_ASSERTION_ISSUER:-intelligence}
      IDENTITY_ASSERTION_KEY_EDGE_USER_INTELLIGENCE_KID: ${IDENTITY_ASSERTION_KEY_EDGE_USER_INTELLIGENCE_KID:-edge-user-intelligence-v1}
      IDENTITY_ASSERTION_KEY_EDGE_USER_INTELLIGENCE: ${IDENTITY_ASSERTION_KEY_EDGE_USER_INTELLIGENCE:-}
      IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_INTELLIGENCE_KID: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_INTELLIGENCE_KID:-marketplace-service-intelligence-v1}
      IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_INTELLIGENCE: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_INTELLIGENCE:-}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # 平台默认 Qwen（HLD §12.3 第一步）；QWEN_API_KEY 未配则 PlatformModelConfig 启动 fail-fast。
      QWEN_BASE_URL: ${QWEN_BASE_URL:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      QWEN_MODEL: ${QWEN_MODEL:-qwen-plus}
      IMAGE_GENERATION_BASE_URL: ${IMAGE_GENERATION_BASE_URL:-}
      IMAGE_GENERATION_API_KEY: ${IMAGE_GENERATION_API_KEY:-}
      IMAGE_GENERATION_MODEL: ${IMAGE_GENERATION_MODEL:-}
      # Slice 13 Bilibili：共享 HMAC token secret；public origin 必须是浏览器/模型可达的 edge-bff 外部地址。
      # 未启 Bilibili Java 路由时可留空；启用前须配置 secret（≥32 chars）及 PUBLIC_BACKEND_ORIGIN。
      BILIBILI_PROXY_TOKEN_SECRET: ${BILIBILI_PROXY_TOKEN_SECRET:-}
      APP_PUBLIC_BACKEND_ORIGIN: ${PUBLIC_BACKEND_ORIGIN:-}
      BILIBILI_ANALYSIS_PROVIDER: ${BILIBILI_ANALYSIS_PROVIDER:-qwen}
      BILIBILI_ANALYSIS_TIMEOUT_MS: ${BILIBILI_ANALYSIS_TIMEOUT_MS:-180000}
      BILIBILI_ANALYSIS_MAX_SINGLE_SEGMENT_SECONDS: ${BILIBILI_ANALYSIS_MAX_SINGLE_SEGMENT_SECONDS:-60}
      # 对象存储（草场 Slice 8）：生成图片迁 MinIO/S3（多副本共享），不再用本地卷。
      OBJECT_STORAGE_ENABLED: "true"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL:-http://localhost:9002}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-grassland}
      # 积分扣减走 legacy 内部端点（共享 INTERNAL_API_KEY；legacy 不认 BFF 断言）。
      LEGACY_CREDITS_BASE_URL: http://backend:3000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    depends_on:
      backend:
        condition: service_started
      minio:
        condition: service_started
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # Epic 3：事件基础设施
  kafka:
    image: apache/kafka:4.2.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  # Epic 3：对象存储（S3 兼容）。无 profile 常驻（与 kafka/redis 一致），service name minio。
  # bucket 由 platform-storage 适配器在服务启动时幂等创建，无需 mc init 容器。
  # bucket CORS：Slice 11 Stage 3 改用 nginx 反代注入 CORS 头（port 9002，见 nginx.conf + frontend ports）。
  # MinIO putBucketCors API 各版本损坏（latest/2025-01=501，2024-06-13=400），不再使用。
  # MINIO_PUBLIC_BASE_URL 设为 http://localhost:9002 → presigned URL 经 nginx 注 CORS 后转 MinIO。
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    restart: unless-stopped

  # Epic 3：Temporal 工作流引擎（dev server）。无 profile 常驻（与 kafka/redis/minio 一致）。
  # CLI dev-server 自带 sqlite，零外部 DB 依赖；gRPC + Web UI 同在 :7233。
  # 本地开发用；生产应换 temporalio/server + postgres + AUTO_SETUP。
  temporal:
    image: temporalio/temporal:latest
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--log-level", "error", "--db-filename", "/tmp/temporal-dev.db"]
    ports:
      - "${TEMPORAL_GRPC_PORT:-7233}:7233"
    volumes:
      - temporal_dev_data:/tmp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "describe"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 本地 postgres —— **默认数据库**（无 profile 常驻，同 kafka/redis/minio）。
  #
  # 起因：neon 连接不稳（实测宿主机直连 3 次 2 失败、成功一次 15.9s）、每次活动 ~10s 延迟，
  # 使 e2e 无法可靠完成。本地库实测 40/40 成功、3s 完成同一压测。生产另行换库。
  #
  # 用法：docker compose --profile java-edge up -d   （DATABASE_URL 见 .env）
  # 宿主机连（跑脚本/psql）：postgresql://grassland:grassland@localhost:55432/grassland
  #
  # ⚠️ 空库初始化顺序：Java 服务 Flyway 只建草场表；session/app_users 等 legacy 表由
  # server/sql/ 管理，须先跑 `npm run db:migrate:local`，否则 identity 报 relation "session" does not exist。
  # 一键种 e2e 数据：`npm run e2e:seed`
  postgres-local:
    image: postgres:18-alpine
    container_name: y-1-postgres-local
    environment:
      POSTGRES_USER: ${LOCAL_DB_USER:-grassland}
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-grassland}
      POSTGRES_DB: ${LOCAL_DB_NAME:-grassland}
    ports:
      # 55432 避开宿主机可能已占用的 5432
      - "${LOCAL_DB_PORT:-55432}:5432"
    volumes:
      # postgres 18+ 要求挂 /var/lib/postgresql（非 /data 子目录），
      # 否则报 "incompatible data directory" 并重启循环。
      - postgres_local_data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOCAL_DB_USER:-grassland} -d ${LOCAL_DB_NAME:-grassland}"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  backend_data:
  minio_data:
  temporal_dev_data:
  postgres_local_data:
