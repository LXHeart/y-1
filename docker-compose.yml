      EDGE_ROUTE_VIDEO_GENERATION_INTELLIGENCE: ${EDGE_ROUTE_VIDEO_GENERATION_INTELLIGENCE:-true}
      EDGE_ROUTE_VIDEO_RECREATION_IMAGES_INTELLIGENCE: ${EDGE_ROUTE_VIDEO_RECREATION_IMAGES_INTELLIGENCE:-true}
