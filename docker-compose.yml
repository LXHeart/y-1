services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
      - "${MINIO_PROXY_PORT:-9002}:9002"  # 草场 Slice 11 Stage 3: MinIO CORS 反代端口
    environment:
      # 公网 API 默认统一经 edge-bff；应急整入口回退可临时设 backend:3000 后 recreate frontend。
      API_UPSTREAM: ${API_UPSTREAM:-edge-bff:8080}
      # 可信公网协议；TLS 在上游 LB/ingress 终止时必须显式设为 https，禁止透传客户端 XFP。
      PUBLIC_FORWARDED_PROTO: ${PUBLIC_FORWARDED_PROTO:-http}
      # 只信任实际 LB/ingress 网段；默认 loopback 不扩大公网信任面。
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:-127.0.0.1/32}
    depends_on:
      edge-bff:
        condition: service_started
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      CORS_ORIGIN: ${CORS_ORIGIN}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      DOUYIN_FETCH_TIMEOUT_MS: ${DOUYIN_FETCH_TIMEOUT_MS:-15000}
      DOUYIN_LOGIN_TIMEOUT_MS: ${DOUYIN_LOGIN_TIMEOUT_MS:-180000}
      DOUYIN_LOGIN_URL: ${DOUYIN_LOGIN_URL:-https://www.douyin.com/}
      DOUYIN_STORAGE_STATE_PATH: ${DOUYIN_STORAGE_STATE_PATH:-server/.data/douyin-storage-state.json}
      DOUYIN_MEDIA_PROCESS_TIMEOUT_MS: ${DOUYIN_MEDIA_PROCESS_TIMEOUT_MS:-45000}
      DOUYIN_MEDIA_TEMP_DIR: ${DOUYIN_MEDIA_TEMP_DIR:-server/.data/douyin-audio}
      DOUYIN_USER_AGENT: ${DOUYIN_USER_AGENT}
      DOUYIN_PROXY_TOKEN_SECRET: ${DOUYIN_PROXY_TOKEN_SECRET}
      PUBLIC_BACKEND_ORIGIN: ${PUBLIC_BACKEND_ORIGIN}
      VIDEO_ANALYSIS_API_PATH: ${VIDEO_ANALYSIS_API_PATH:-}
      VIDEO_ANALYSIS_API_TIMEOUT_MS: ${VIDEO_ANALYSIS_API_TIMEOUT_MS:-180000}
      BILIBILI_FETCH_TIMEOUT_MS: ${BILIBILI_FETCH_TIMEOUT_MS:-15000}
      BILIBILI_MEDIA_TEMP_DIR: ${BILIBILI_MEDIA_TEMP_DIR:-server/.data/bilibili-media}
      BILIBILI_USER_AGENT: ${BILIBILI_USER_AGENT}
      BILIBILI_PROXY_TOKEN_SECRET: ${BILIBILI_PROXY_TOKEN_SECRET}
      FFMPEG_PATH: ${FFMPEG_PATH:-ffmpeg}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      # GL-P0-AUTH-001：cookie 属性须与 identity-service 完全一致（同一张 session 表）。
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-y1.sid}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-auto}
      SESSION_COOKIE_SAME_SITE: ${SESSION_COOKIE_SAME_SITE:-Lax}
      # 生产（HTTPS 入口）置 1 开 HSTS；HTTP 入口下即使置 1 也不会发（见 security-headers.ts）。
      SECURITY_HSTS_ENABLED: ${SECURITY_HSTS_ENABLED:-0}
      IDENTITY_DATASOURCE_FROM_DATABASE_URL: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # 草场 intelligence → legacy credits 过渡通道的共享密钥（两端同值；未配则 legacy 端点 fail-closed 503）。
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    ports:
      # legacy 只保留宿主机本地调试入口，公网流量必须经 Nginx -> edge-bff。
      - "127.0.0.1:${BACKEND_PORT:-3000}:3000"
    volumes:
      - backend_data:/app/server/.data
    restart: unless-stopped

  # Java identity-service：默认应用栈组成部分，复用 backend 的 DATABASE_URL（自动派生 r2dbc）。
  identity-service:
    build:
      context: ./platform-java
      dockerfile: services/identity-service/Dockerfile
    environment:
      SERVER_PORT: "8082"
      DATABASE_URL: ${DATABASE_URL:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      # GL-P0-AUTH-001：与 backend 同值，否则同一张 session 表上会写出属性不一致的 cookie。
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-y1.sid}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-auto}
      SESSION_COOKIE_SAME_SITE: ${SESSION_COOKIE_SAME_SITE:-Lax}
      SESSION_COOKIE_MAX_AGE_MS: ${SESSION_COOKIE_MAX_AGE_MS:-0}
      IDENTITY_DATASOURCE_FROM_DATABASE_URL: "true"
      # HLD 7.4 内部身份断言消费（与 edge-bff 同 secret/audience）；复用 SESSION_SECRET 保证一致。
      IDENTITY_ASSERTION_ENABLED: "true"
      IDENTITY_ASSERTION_ISSUER: ${IDENTITY_ASSERTION_ISSUER:-identity}
      IDENTITY_ASSERTION_KEY_EDGE_USER_IDENTITY_KID: ${IDENTITY_ASSERTION_KEY_EDGE_USER_IDENTITY_KID:-edge-user-identity-v1}
      IDENTITY_ASSERTION_KEY_EDGE_USER_IDENTITY: ${IDENTITY_ASSERTION_KEY_EDGE_USER_IDENTITY:-}
      IDENTITY_ASSERTION_KEY_IDENTITY_SERVICE_INTELLIGENCE_KID: ${IDENTITY_ASSERTION_KEY_IDENTITY_SERVICE_INTELLIGENCE_KID:-identity-service-intelligence-v1}
      IDENTITY_ASSERTION_KEY_IDENTITY_SERVICE_INTELLIGENCE: ${IDENTITY_ASSERTION_KEY_IDENTITY_SERVICE_INTELLIGENCE:-}
      INTELLIGENCE_SERVICE_BASE_URL: http://intelligence-service:8086
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Slice 12 通知中心：消费 identity 自有 topic 派生站内通知。默认开（与 marketplace trust-consumer 同款）。
      IDENTITY_NOTIFICATION_CONSUMER_ENABLED: "true"
      # Slice 12 Stage 3：同时消费 marketplace / trust / finance topic（报名/凭证退回/结算/争议/钱包通知）。
      IDENTITY_NOTIFICATION_EXTERNAL_ENABLED: "true"
      # GL-P1-NOTIFY-001 事务邮件 outbox：SMTP 配了即开（publisher 内部再判 isConfigured）。
      IDENTITY_MAIL_OUTBOX_ENABLED: "true"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # GL-P3-MERCHANT-001：KYB 敏感字段信封加密 KEK（与 intelligence BYOK 同一变量）。
      # 未配置时 KYB 敏感字段端点 fail-closed 503，不落明文。
      CRYPTO_KEK_BASE64: ${CRYPTO_KEK_BASE64:-}
      IDENTITY_KYB_REVIEW_SLA_SECONDS: ${IDENTITY_KYB_REVIEW_SLA_SECONDS:-259200}
      IDENTITY_KYB_RETENTION_ENABLED: ${IDENTITY_KYB_RETENTION_ENABLED:-true}
      IDENTITY_KYB_RETENTION_LIVE_LEASE_SECONDS: ${IDENTITY_KYB_RETENTION_LIVE_LEASE_SECONDS:-604800}
      IDENTITY_KYB_RETENTION_RENEW_AHEAD_SECONDS: ${IDENTITY_KYB_RETENTION_RENEW_AHEAD_SECONDS:-172800}
      IDENTITY_KYB_APPROVED_RETENTION_DAYS: ${IDENTITY_KYB_APPROVED_RETENTION_DAYS:-2555}
      IDENTITY_KYB_REJECTED_RETENTION_DAYS: ${IDENTITY_KYB_REJECTED_RETENTION_DAYS:-365}
      # 移动端 token 认证（GL-P3-IDENTITY-001）。secret 留空 = 移动端登录/刷新/撤销一律 503
      # （fail-closed），Web cookie 路径不受影响。启用时须与 edge-bff 验签方同值。
      IDENTITY_ACCESS_TOKEN_SECRET: ${IDENTITY_ACCESS_TOKEN_SECRET:-}
      IDENTITY_ACCESS_TOKEN_TTL_SECONDS: ${IDENTITY_ACCESS_TOKEN_TTL_SECONDS:-900}
      IDENTITY_REFRESH_TOKEN_TTL_DAYS: ${IDENTITY_REFRESH_TOKEN_TTL_DAYS:-30}
      IDENTITY_REFRESH_TOKEN_MAX_ACTIVE: ${IDENTITY_REFRESH_TOKEN_MAX_ACTIVE:-10}
      # 过期行清理定时任务：默认关（本地/测试不起），容器内开。
      IDENTITY_REFRESH_TOKEN_CLEANUP_ENABLED: ${IDENTITY_REFRESH_TOKEN_CLEANUP_ENABLED:-true}
    depends_on:
      backend:
        condition: service_started
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # GL-P3-PLATFORM-001：私网 Prometheus，抓 identity 邮件死信 + marketplace 运营死信指标，加载告警规则。
  # 不发布宿主端口、不经 Nginx；告警推送至下方 Alertmanager（接收端凭据属部署侧）。
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./platform-java/deploy/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./platform-java/deploy/observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    depends_on:
      identity-service:
        condition: service_started
      marketplace-service:
        condition: service_started
    restart: unless-stopped

  # GL-P3-PLATFORM-001：私网 Alertmanager，承接 Prometheus 告警。UI 在内网 alertmanager:9093。
  # 真接收端（Slack/SMTP/PagerDuty）属部署侧凭据，alertmanager.yml 用占位 webhook，接入时改 receivers。
  alertmanager:
    profiles: ["observability"]
    image: prom/alertmanager:v0.27.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./platform-java/deploy/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    restart: unless-stopped

  # 统一 Java Edge BFF 入口。Nginx 的 /api 与 /health 默认只指向本服务；
  # RouteManifest 将已迁移路由送往 Java 领域服务，其余透明回落 Express。
  edge-bff:
    build:
      context: ./platform-java
      dockerfile: services/edge-bff/Dockerfile
    environment:
      SERVER_PORT: "8080"
      LEGACY_EXPRESS_BASE_URL: http://backend:3000
      IDENTITY_SERVICE_BASE_URL: http://identity-service:8082
      MARKETPLACE_SERVICE_BASE_URL: http://marketplace-service:8083
      FINANCE_SERVICE_BASE_URL: http://finance-service:8084
      TRUST_SERVICE_BASE_URL: http://trust-service:8085
      INTELLIGENCE_SERVICE_BASE_URL: http://intelligence-service:8086
      # RouteManifest 启动期切流开关。必须在 compose 显式透传，否则 .env 中的回滚配置不会进入容器。
      EDGE_ROUTE_AUTH_ME_IDENTITY: ${EDGE_ROUTE_AUTH_ME_IDENTITY:-true}
      EDGE_ROUTE_AUTH_LOGIN_IDENTITY: ${EDGE_ROUTE_AUTH_LOGIN_IDENTITY:-true}
      EDGE_ROUTE_AUTH_LOGOUT_IDENTITY: ${EDGE_ROUTE_AUTH_LOGOUT_IDENTITY:-true}
      EDGE_ROUTE_AUTH_CAPTCHA_IDENTITY: ${EDGE_ROUTE_AUTH_CAPTCHA_IDENTITY:-true}
      EDGE_ROUTE_AUTH_SENDCODE_IDENTITY: ${EDGE_ROUTE_AUTH_SENDCODE_IDENTITY:-true}
      EDGE_ROUTE_AUTH_REGISTER_IDENTITY: ${EDGE_ROUTE_AUTH_REGISTER_IDENTITY:-true}
      EDGE_ROUTE_AUTH_REFRESH_IDENTITY: ${EDGE_ROUTE_AUTH_REFRESH_IDENTITY:-true}
      EDGE_ROUTE_AUTH_REVOKE_IDENTITY: ${EDGE_ROUTE_AUTH_REVOKE_IDENTITY:-true}
      EDGE_ROUTE_TASKS_MARKETPLACE: ${EDGE_ROUTE_TASKS_MARKETPLACE:-true}
      EDGE_ROUTE_ORGANIZATIONS_IDENTITY: ${EDGE_ROUTE_ORGANIZATIONS_IDENTITY:-true}
      EDGE_ROUTE_ME_IDENTITY: ${EDGE_ROUTE_ME_IDENTITY:-true}
      EDGE_ROUTE_ADMIN_PERMREQ_IDENTITY: ${EDGE_ROUTE_ADMIN_PERMREQ_IDENTITY:-true}
      EDGE_ROUTE_ADMIN_KYB_IDENTITY: ${EDGE_ROUTE_ADMIN_KYB_IDENTITY:-true}
      EDGE_ROUTE_ADMIN_RECOMMENDER_IDENTITY: ${EDGE_ROUTE_ADMIN_RECOMMENDER_IDENTITY:-true}
      EDGE_ROUTE_AI_INTELLIGENCE: ${EDGE_ROUTE_AI_INTELLIGENCE:-true}
      EDGE_ROUTE_ADMIN_AI_INTELLIGENCE: ${EDGE_ROUTE_ADMIN_AI_INTELLIGENCE:-true}
      EDGE_ROUTE_ADMIN_USERS_IDENTITY: ${EDGE_ROUTE_ADMIN_USERS_IDENTITY:-true}
      EDGE_ROUTE_ADMIN_FINANCE: ${EDGE_ROUTE_ADMIN_FINANCE:-true}
      EDGE_ROUTE_ADMIN_TASKS_MARKETPLACE: ${EDGE_ROUTE_ADMIN_TASKS_MARKETPLACE:-true}
      EDGE_ROUTE_RECOMMENDERS_IDENTITY: ${EDGE_ROUTE_RECOMMENDERS_IDENTITY:-true}
      EDGE_ROUTE_OPS_MARKETPLACE: ${EDGE_ROUTE_OPS_MARKETPLACE:-true}
      EDGE_ROUTE_REPUTATION_MARKETPLACE: ${EDGE_ROUTE_REPUTATION_MARKETPLACE:-true}
      EDGE_ROUTE_FINANCE: ${EDGE_ROUTE_FINANCE:-true}
      EDGE_ROUTE_CREDITS_FINANCE: ${EDGE_ROUTE_CREDITS_FINANCE:-true}
      EDGE_ROUTE_TRUST: ${EDGE_ROUTE_TRUST:-true}
      EDGE_ROUTE_INTELLIGENCE_SMOKED: ${EDGE_ROUTE_INTELLIGENCE_SMOKED:-true}
      EDGE_ROUTE_MEDIA_INTELLIGENCE: ${EDGE_ROUTE_MEDIA_INTELLIGENCE:-true}
      EDGE_ROUTE_COMEDY_INTELLIGENCE: ${EDGE_ROUTE_COMEDY_INTELLIGENCE:-true}
      EDGE_ROUTE_ARTICLE_TITLES_INTELLIGENCE: ${EDGE_ROUTE_ARTICLE_TITLES_INTELLIGENCE:-true}
      EDGE_ROUTE_ARTICLE_OUTLINE_INTELLIGENCE: ${EDGE_ROUTE_ARTICLE_OUTLINE_INTELLIGENCE:-true}
      EDGE_ROUTE_ARTICLE_CONTENT_INTELLIGENCE: ${EDGE_ROUTE_ARTICLE_CONTENT_INTELLIGENCE:-true}
      EDGE_ROUTE_ARTICLE_IMAGE_RECOMMENDATIONS_INTELLIGENCE: ${EDGE_ROUTE_ARTICLE_IMAGE_RECOMMENDATIONS_INTELLIGENCE:-true}
      EDGE_ROUTE_ARTICLE_SEARCH_IMAGES_INTELLIGENCE: ${EDGE_ROUTE_ARTICLE_SEARCH_IMAGES_INTELLIGENCE:-true}
      EDGE_ROUTE_ARTICLE_GENERATED_MEDIA_INTELLIGENCE: ${EDGE_ROUTE_ARTICLE_GENERATED_MEDIA_INTELLIGENCE:-true}
      EDGE_ROUTE_VIDEO_SCRIPT_INTELLIGENCE: ${EDGE_ROUTE_VIDEO_SCRIPT_INTELLIGENCE:-true}
      EDGE_ROUTE_VIDEO_RECREATION_IMAGES_INTELLIGENCE: ${EDGE_ROUTE_VIDEO_RECREATION_IMAGES_INTELLIGENCE:-true}
      EDGE_ROUTE_VIDEO_RECREATION_ADAPTATION_INTELLIGENCE: ${EDGE_ROUTE_VIDEO_RECREATION_ADAPTATION_INTELLIGENCE:-false}
      EDGE_ROUTE_IMAGE_ANALYSIS_GENERATION_INTELLIGENCE: ${EDGE_ROUTE_IMAGE_ANALYSIS_GENERATION_INTELLIGENCE:-true}
      EDGE_ROUTE_IMAGE_ANALYSIS_STYLE_INTELLIGENCE: ${EDGE_ROUTE_IMAGE_ANALYSIS_STYLE_INTELLIGENCE:-true}
      EDGE_ROUTE_IMAGE_ANALYSIS_EXPORT_INTELLIGENCE: ${EDGE_ROUTE_IMAGE_ANALYSIS_EXPORT_INTELLIGENCE:-true}
      # Bilibili/Douyin 媒体链路默认 false，显式开启前需完成凭据与回切演练。
      EDGE_ROUTE_BILIBILI_MEDIA_INTELLIGENCE: ${EDGE_ROUTE_BILIBILI_MEDIA_INTELLIGENCE:-false}
      EDGE_ROUTE_DOUYIN_MEDIA_INTELLIGENCE: ${EDGE_ROUTE_DOUYIN_MEDIA_INTELLIGENCE:-false}
      EDGE_ROUTE_DOUYIN_HOT_ITEMS_INTELLIGENCE: ${EDGE_ROUTE_DOUYIN_HOT_ITEMS_INTELLIGENCE:-false}
      # Legacy 迁移：用户级分析设置 + 首页热点聚合 → intelligence-service。
      EDGE_ROUTE_SETTINGS_INTELLIGENCE: ${EDGE_ROUTE_SETTINGS_INTELLIGENCE:-true}
      EDGE_ROUTE_HOMEPAGE_INTELLIGENCE: ${EDGE_ROUTE_HOMEPAGE_INTELLIGENCE:-true}
      # HLD 7.4：直读 session 表签发内部身份断言（DATABASE_URL 复用 identity 库，只读；secret 与 identity-service 一致）。
      EDGE_IDENTITY_FROM_DATABASE_URL: "true"
      # GL-P3-IDENTITY-001：移动端 access token 验签 secret（与 identity-service 的 IDENTITY_ACCESS_TOKEN_SECRET 同值）。
      EDGE_ACCESS_TOKEN_SECRET: ${IDENTITY_ACCESS_TOKEN_SECRET:-}
      DATABASE_URL: ${DATABASE_URL:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-y1.sid}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      PUBLIC_BACKEND_ORIGIN: ${PUBLIC_BACKEND_ORIGIN:-}
      SECURITY_CSRF_ORIGIN_CHECK: ${SECURITY_CSRF_ORIGIN_CHECK:-1}
      # GL-P0-ASSERT-001 keyring 模式：edge-bff 签发用户断言到各领域服务
      IDENTITY_ASSERTION_ENABLED: "true"
      IDENTITY_ASSERTION_ISSUER: ${IDENTITY_ASSERTION_ISSUER:-edge-bff}
      IDENTITY_ASSERTION_KEY_EDGE_USER_IDENTITY_KID: ${IDENTITY_ASSERTION_KEY_EDGE_USER_IDENTITY_KID:-edge-user-identity-v1}
      IDENTITY_ASSERTION_KEY_EDGE_USER_IDENTITY: ${IDENTITY_ASSERTION_KEY_EDGE_USER_IDENTITY:-}
      IDENTITY_ASSERTION_KEY_EDGE_USER_MARKETPLACE_KID: ${IDENTITY_ASSERTION_KEY_EDGE_USER_MARKETPLACE_KID:-edge-user-marketplace-v1}
      IDENTITY_ASSERTION_KEY_EDGE_USER_MARKETPLACE: ${IDENTITY_ASSERTION_KEY_EDGE_USER_MARKETPLACE:-}
      IDENTITY_ASSERTION_KEY_EDGE_USER_FINANCE_KID: ${IDENTITY_ASSERTION_KEY_EDGE_USER_FINANCE_KID:-edge-user-finance-v1}
      IDENTITY_ASSERTION_KEY_EDGE_USER_FINANCE: ${IDENTITY_ASSERTION_KEY_EDGE_USER_FINANCE:-}
      IDENTITY_ASSERTION_KEY_EDGE_USER_TRUST_KID: ${IDENTITY_ASSERTION_KEY_EDGE_USER_TRUST_KID:-edge-user-trust-v1}
      IDENTITY_ASSERTION_KEY_EDGE_USER_TRUST: ${IDENTITY_ASSERTION_KEY_EDGE_USER_TRUST:-}
      IDENTITY_ASSERTION_KEY_EDGE_USER_INTELLIGENCE_KID: ${IDENTITY_ASSERTION_KEY_EDGE_USER_INTELLIGENCE_KID:-edge-user-intelligence-v1}
      IDENTITY_ASSERTION_KEY_EDGE_USER_INTELLIGENCE: ${IDENTITY_ASSERTION_KEY_EDGE_USER_INTELLIGENCE:-}
    ports:
      # Vite 本地开发仍可访问 localhost:8081；公网只能经 frontend Nginx。
      - "127.0.0.1:${EDGE_BFF_PORT:-8081}:8080"
    depends_on:
      - backend
      - identity-service
      - marketplace-service
      - finance-service
      - trust-service
      - intelligence-service
    restart: unless-stopped

  # Java marketplace-service（Epic 4）：默认应用栈组成部分。
  # 独立 Flyway 历史（marketplace_flyway_schema）；与 identity 共用 neon；消费 BFF 断言。
  marketplace-service:
    build:
      context: ./platform-java
      dockerfile: services/marketplace-service/Dockerfile
    # 不发布宿主端口（GL-P0-SEC-002）：仅 Docker 网络内可达，同 identity-service。
    # 容器间调用走服务名（MARKETPLACE_SERVICE_BASE_URL=http://marketplace-service:8083）。
    # 对外入口只有 Nginx；edge-bff 的宿主端口仅绑定 loopback 供本地调试。
    environment:
      SERVER_PORT: "8083"
      DATABASE_URL: ${DATABASE_URL:-}
      MARKETPLACE_DATASOURCE_FROM_DATABASE_URL: "true"
      # GL-P0-ASSERT-001 keyring 模式：marketplace 签发服务断言到 finance/trust/intelligence，验证 edge-bff 用户断言与 trust 服务断言
      IDENTITY_ASSERTION_ENABLED: "true"
      IDENTITY_ASSERTION_ISSUER: ${IDENTITY_ASSERTION_ISSUER:-marketplace}
      IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_FINANCE_KID: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_FINANCE_KID:-marketplace-service-finance-v1}
      IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_FINANCE: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_FINANCE:-}
      IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_TRUST_KID: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_TRUST_KID:-marketplace-service-trust-v1}
      IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_TRUST: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_TRUST:-}
      IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_INTELLIGENCE_KID: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_INTELLIGENCE_KID:-marketplace-service-intelligence-v1}
      IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_INTELLIGENCE: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_INTELLIGENCE:-}
      IDENTITY_ASSERTION_KEY_EDGE_USER_MARKETPLACE_KID: ${IDENTITY_ASSERTION_KEY_EDGE_USER_MARKETPLACE_KID:-edge-user-marketplace-v1}
      IDENTITY_ASSERTION_KEY_EDGE_USER_MARKETPLACE: ${IDENTITY_ASSERTION_KEY_EDGE_USER_MARKETPLACE:-}
      IDENTITY_ASSERTION_KEY_TRUST_SERVICE_MARKETPLACE_KID: ${IDENTITY_ASSERTION_KEY_TRUST_SERVICE_MARKETPLACE_KID:-trust-service-marketplace-v1}
      IDENTITY_ASSERTION_KEY_TRUST_SERVICE_MARKETPLACE: ${IDENTITY_ASSERTION_KEY_TRUST_SERVICE_MARKETPLACE:-}
      # 无 MinIO 凭据：媒体上传走 intelligence-service 鉴权链路（GL-P0-SEC-002）
      TEMPORAL_TARGET: temporal:7233
      TEMPORAL_TEST_SERVER: ${TEMPORAL_TEST_SERVER:-false}
      SETTLEMENT_WINDOW_SECONDS: ${SETTLEMENT_WINDOW_SECONDS:-5}
      # D-03：dev 默认 5s；生产设 259200（3 天）。窗口短于 24h 前置时提醒自动跳过。
      CONFIRMATION_WINDOW_SECONDS: ${CONFIRMATION_WINDOW_SECONDS:-5}
      CONFIRMATION_REMINDER_LEAD_SECONDS: ${CONFIRMATION_REMINDER_LEAD_SECONDS:-86400}
      CONFIRMATION_SUPPLEMENT_CAP: ${CONFIRMATION_SUPPLEMENT_CAP:-2}
      CONFIRMATION_CS_SLA_SECONDS: ${CONFIRMATION_CS_SLA_SECONDS:-259200}
      FINANCE_SERVICE_BASE_URL: http://finance-service:8084
      TRUST_SERVICE_BASE_URL: http://trust-service:8085
      INTELLIGENCE_SERVICE_BASE_URL: http://intelligence-service:8086
      MARKETPLACE_TRUST_CONSUMER_ENABLED: ${MARKETPLACE_TRUST_CONSUMER_ENABLED:-true}
      # 死信登记（GL-P1-OPS-001）：跟随 trust 消费者一起开，否则重试耗尽的事件会静静躺在 *.DLT 里没人看。
      MARKETPLACE_DLT_CONSUMER_ENABLED: ${MARKETPLACE_DLT_CONSUMER_ENABLED:-${MARKETPLACE_TRUST_CONSUMER_ENABLED:-true}}
      MARKETPLACE_DLT_CONSUMER_TOPICS: ${MARKETPLACE_DLT_CONSUMER_TOPICS:-grassland.trust.events.DLT}
      # 运营死信 retention 清理（GL-P3-PLATFORM-001）：跟随 dlt 消费者一起开，否则 ops_dlt_message 只增不减。
      # dlt-metrics gauge 总是开（与消费者无关），这里只配清理任务。
      MARKETPLACE_OPS_DLT_CLEANUP_ENABLED: ${MARKETPLACE_OPS_DLT_CLEANUP_ENABLED:-${MARKETPLACE_DLT_CONSUMER_ENABLED:-${MARKETPLACE_TRUST_CONSUMER_ENABLED:-true}}}
      MARKETPLACE_OPS_DLT_CLEANUP_RETENTION_DAYS: ${MARKETPLACE_OPS_DLT_CLEANUP_RETENTION_DAYS:-30}
    depends_on:
      backend:
        condition: service_started
      temporal:
        condition: service_healthy
      finance-service:
        condition: service_started
      trust-service:
        condition: service_started
      intelligence-service:
        condition: service_started
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # Java finance-service（Epic 4 Slice 4D）：默认应用栈组成部分。
  # 独立 Flyway 历史（finance_flyway_schema）；与 identity/marketplace 共用 neon；消费 BFF 断言。
  # 为后续「接受报名→资金预留→激活/补偿」Saga 扫清依赖（ReserveFunds/escrow 留后续 slice）。
  finance-service:
    build:
      context: ./platform-java
      dockerfile: services/finance-service/Dockerfile
    # 不发布宿主端口（GL-P0-SEC-002）：仅 Docker 网络内可达，同 identity-service。
    environment:
      SERVER_PORT: "8084"
      DATABASE_URL: ${DATABASE_URL:-}
      FINANCE_DATASOURCE_FROM_DATABASE_URL: "true"
      # GL-P0-ASSERT-001 keyring 模式：finance 验证 edge-bff 用户断言 + marketplace/trust 服务断言
      IDENTITY_ASSERTION_ENABLED: "true"
      IDENTITY_ASSERTION_ISSUER: ${IDENTITY_ASSERTION_ISSUER:-finance}
      IDENTITY_ASSERTION_KEY_EDGE_USER_FINANCE_KID: ${IDENTITY_ASSERTION_KEY_EDGE_USER_FINANCE_KID:-edge-user-finance-v1}
      IDENTITY_ASSERTION_KEY_EDGE_USER_FINANCE: ${IDENTITY_ASSERTION_KEY_EDGE_USER_FINANCE:-}
      IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_FINANCE_KID: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_FINANCE_KID:-marketplace-service-finance-v1}
      IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_FINANCE: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_FINANCE:-}
      IDENTITY_ASSERTION_KEY_TRUST_SERVICE_FINANCE_KID: ${IDENTITY_ASSERTION_KEY_TRUST_SERVICE_FINANCE_KID:-trust-service-finance-v1}
      IDENTITY_ASSERTION_KEY_TRUST_SERVICE_FINANCE: ${IDENTITY_ASSERTION_KEY_TRUST_SERVICE_FINANCE:-}
    depends_on:
      backend:
        condition: service_started
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # Java trust-service（Epic 6 Slice 6A）：默认应用栈组成部分。
  # 独立 Flyway 历史（trust_flyway_schema）；与 identity/marketplace/finance 共用 neon；消费 BFF/服务断言。
  trust-service:
    build:
      context: ./platform-java
      dockerfile: services/trust-service/Dockerfile
    # 不发布宿主端口（GL-P0-SEC-002）：仅 Docker 网络内可达，同 identity-service。
    environment:
      SERVER_PORT: "8085"
      DATABASE_URL: ${DATABASE_URL:-}
      TRUST_DATASOURCE_FROM_DATABASE_URL: "true"
      # dev 窗口缩到 60s（生产为 24h/48h），使「窗口到期→自动 tally→decided→上诉窗口→终局」
      # 这条时间驱动主链路可在本地实跑验证。对齐 SETTLEMENT_WINDOW_SECONDS 约定。
      TRUST_ADJUDICATION_VOTE_WINDOW_SECONDS: ${TRUST_ADJUDICATION_VOTE_WINDOW_SECONDS:-60}
      TRUST_ADJUDICATION_APPEAL_WINDOW_SECONDS: ${TRUST_ADJUDICATION_APPEAL_WINDOW_SECONDS:-60}
      # GL-P0-ASSERT-001 keyring 模式：trust 签发服务断言到 finance/marketplace，验证 edge-bff 用户断言 + marketplace 服务断言
      IDENTITY_ASSERTION_ENABLED: "true"
      IDENTITY_ASSERTION_ISSUER: ${IDENTITY_ASSERTION_ISSUER:-trust}
      IDENTITY_ASSERTION_KEY_TRUST_SERVICE_FINANCE_KID: ${IDENTITY_ASSERTION_KEY_TRUST_SERVICE_FINANCE_KID:-trust-service-finance-v1}
      IDENTITY_ASSERTION_KEY_TRUST_SERVICE_FINANCE: ${IDENTITY_ASSERTION_KEY_TRUST_SERVICE_FINANCE:-}
      IDENTITY_ASSERTION_KEY_TRUST_SERVICE_MARKETPLACE_KID: ${IDENTITY_ASSERTION_KEY_TRUST_SERVICE_MARKETPLACE_KID:-trust-service-marketplace-v1}
      IDENTITY_ASSERTION_KEY_TRUST_SERVICE_MARKETPLACE: ${IDENTITY_ASSERTION_KEY_TRUST_SERVICE_MARKETPLACE:-}
      IDENTITY_ASSERTION_KEY_EDGE_USER_TRUST_KID: ${IDENTITY_ASSERTION_KEY_EDGE_USER_TRUST_KID:-edge-user-trust-v1}
      IDENTITY_ASSERTION_KEY_EDGE_USER_TRUST: ${IDENTITY_ASSERTION_KEY_EDGE_USER_TRUST:-}
      IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_TRUST_KID: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_TRUST_KID:-marketplace-service-trust-v1}
      IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_TRUST: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_TRUST:-}
      # Slice 12 安全收口：开争议前查参与方授权 + canonical task organization（不经 BFF）。
      MARKETPLACE_SERVICE_BASE_URL: http://marketplace-service:8083
    depends_on:
      backend:
        condition: service_started
      temporal:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # Java intelligence-service（草场 intelligence Slice 1）：默认应用栈组成部分。
  # 独立 Flyway 历史（intelligence_flyway_schema）；平台默认 Qwen（env 注入，不读 legacy per-user 设置）；
  # 积分经共享密钥走 legacy 内部端点（直连 backend，不经 BFF，避免 intelligence↔BFF 循环）。
  intelligence-service:
    build:
      context: ./platform-java
      dockerfile: services/intelligence-service/Dockerfile
    # 不发布宿主端口（GL-P0-SEC-002）：仅 Docker 网络内可达，同 identity-service。
    environment:
      SERVER_PORT: "8086"
      DATABASE_URL: ${DATABASE_URL:-}
      INTELLIGENCE_DATASOURCE_FROM_DATABASE_URL: "true"
      # GL-P0-ASSERT-001 keyring 模式：intelligence 验证 edge-bff 用户断言 + marketplace 服务断言
      IDENTITY_ASSERTION_ENABLED: "true"
      IDENTITY_ASSERTION_ISSUER: ${IDENTITY_ASSERTION_ISSUER:-intelligence}
      IDENTITY_ASSERTION_KEY_EDGE_USER_INTELLIGENCE_KID: ${IDENTITY_ASSERTION_KEY_EDGE_USER_INTELLIGENCE_KID:-edge-user-intelligence-v1}
      IDENTITY_ASSERTION_KEY_EDGE_USER_INTELLIGENCE: ${IDENTITY_ASSERTION_KEY_EDGE_USER_INTELLIGENCE:-}
      IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_INTELLIGENCE_KID: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_INTELLIGENCE_KID:-marketplace-service-intelligence-v1}
      IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_INTELLIGENCE: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_INTELLIGENCE:-}
      IDENTITY_ASSERTION_KEY_IDENTITY_SERVICE_INTELLIGENCE_KID: ${IDENTITY_ASSERTION_KEY_IDENTITY_SERVICE_INTELLIGENCE_KID:-identity-service-intelligence-v1}
      IDENTITY_ASSERTION_KEY_IDENTITY_SERVICE_INTELLIGENCE: ${IDENTITY_ASSERTION_KEY_IDENTITY_SERVICE_INTELLIGENCE:-}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # 平台默认 Qwen（HLD §12.3 第一步）；QWEN_API_KEY 未配则 PlatformModelConfig 启动 fail-fast。
      QWEN_BASE_URL: ${QWEN_BASE_URL:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      QWEN_MODEL: ${QWEN_MODEL:-qwen-plus}
      IMAGE_GENERATION_BASE_URL: ${IMAGE_GENERATION_BASE_URL:-}
      IMAGE_GENERATION_API_KEY: ${IMAGE_GENERATION_API_KEY:-}
      IMAGE_GENERATION_MODEL: ${IMAGE_GENERATION_MODEL:-}
      # Slice 13 Bilibili：共享 HMAC token secret；public origin 必须是浏览器/模型可达的 edge-bff 外部地址。
      # 未启 Bilibili Java 路由时可留空；启用前须配置 secret（≥32 chars）及 PUBLIC_BACKEND_ORIGIN。
      BILIBILI_PROXY_TOKEN_SECRET: ${BILIBILI_PROXY_TOKEN_SECRET:-}
      # GL-P3-MEDIA-001 Douyin：共享 HMAC token secret；与 legacy Express 共享，须 ≥32 字符。
      DOUYIN_PROXY_TOKEN_SECRET: ${DOUYIN_PROXY_TOKEN_SECRET:-}
      APP_PUBLIC_BACKEND_ORIGIN: ${PUBLIC_BACKEND_ORIGIN:-}
      BILIBILI_ANALYSIS_PROVIDER: ${BILIBILI_ANALYSIS_PROVIDER:-qwen}
      BILIBILI_ANALYSIS_TIMEOUT_MS: ${BILIBILI_ANALYSIS_TIMEOUT_MS:-180000}
      BILIBILI_ANALYSIS_MAX_SINGLE_SEGMENT_SECONDS: ${BILIBILI_ANALYSIS_MAX_SINGLE_SEGMENT_SECONDS:-60}
      # GL-P3-MEDIA-001 Douyin analyze：与 Bilibili 同口径（provider 非 qwen / 超阈值 → 回落 legacy）。
      DOUYIN_ANALYSIS_PROVIDER: ${DOUYIN_ANALYSIS_PROVIDER:-qwen}
      DOUYIN_ANALYSIS_TIMEOUT_MS: ${DOUYIN_ANALYSIS_TIMEOUT_MS:-180000}
      DOUYIN_ANALYSIS_MAX_SINGLE_SEGMENT_SECONDS: ${DOUYIN_ANALYSIS_MAX_SINGLE_SEGMENT_SECONDS:-60}
      # Legacy 迁移（首页热点）：60s 聚合源 + ALAPI 全网热点（token 为用户级设置，不在此配）。
      DOUYIN_HOT_API_BASE_URL: ${DOUYIN_HOT_API_BASE_URL:-https://60s.viki.moe/v2/douyin}
      DOUYIN_HOT_API_TIMEOUT_MS: ${DOUYIN_HOT_API_TIMEOUT_MS:-8000}
      ALAPI_BASE_URL: ${ALAPI_BASE_URL:-https://v3.alapi.cn}
      ALAPI_TIMEOUT_MS: ${ALAPI_TIMEOUT_MS:-8000}
      # GL-P3-AI-001 BYOK 信封加密 KEK（32 字节 Base64）；未配置则 /api/ai/keys fail-closed 不注册。
      CRYPTO_KEK_BASE64: ${CRYPTO_KEK_BASE64:-}
      # 对象存储（草场 Slice 8）：生成图片迁 MinIO/S3（多副本共享），不再用本地卷。
      OBJECT_STORAGE_ENABLED: "true"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL:-http://localhost:9002}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-grassland}
      # 积分扣减走 legacy 内部端点（共享 INTERNAL_API_KEY；legacy 不认 BFF 断言）。
      LEGACY_CREDITS_BASE_URL: http://backend:3000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    depends_on:
      backend:
        condition: service_started
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # Epic 3：事件基础设施
  kafka:
    image: apache/kafka:4.2.1
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    restart: unless-stopped

  # Epic 3：对象存储（S3 兼容）。无 profile 常驻（与 kafka/redis 一致），service name minio。
  # bucket 由 platform-storage 适配器在服务启动时幂等创建，无需 mc init 容器。
  # bucket CORS：Slice 11 Stage 3 改用 nginx 反代注入 CORS 头（port 9002，见 nginx.conf + frontend ports）。
  # MinIO putBucketCors API 各版本损坏（latest/2025-01=501，2024-06-13=400），不再使用。
  # MINIO_PUBLIC_BASE_URL 设为 http://localhost:9002 → presigned URL 经 nginx 注 CORS 后转 MinIO。
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # Epic 3：Temporal 工作流引擎（dev server）。无 profile 常驻（与 kafka/redis/minio 一致）。
  # CLI dev-server 自带 sqlite，零外部 DB 依赖；gRPC + Web UI 同在 :7233。
  # 本地开发用；生产应换 temporalio/server + postgres + AUTO_SETUP。
  temporal:
    image: temporalio/temporal:1.8.1
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--log-level", "error", "--db-filename", "/tmp/temporal-dev.db"]
    ports:
      - "127.0.0.1:${TEMPORAL_GRPC_PORT:-7233}:7233"
    volumes:
      - temporal_dev_data:/tmp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "describe"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 本地 postgres —— **默认数据库**（无 profile 常驻，同 kafka/redis/minio）。
  #
  # 起因：neon 连接不稳（实测宿主机直连 3 次 2 失败、成功一次 15.9s）、每次活动 ~10s 延迟，
  # 使 e2e 无法可靠完成。本地库实测 40/40 成功、3s 完成同一压测。生产另行换库。
  #
  # 用法：docker compose up -d   （DATABASE_URL 见 .env）
  # 宿主机连（跑脚本/psql）：postgresql://grassland:grassland@localhost:55432/grassland
  #
  # ⚠️ 空库初始化顺序：Java 服务 Flyway 只建草场表；session/app_users 等 legacy 表由
  # server/sql/ 管理，须先跑 `npm run db:migrate:local`，否则 identity 报 relation "session" does not exist。
  # 一键种 e2e 数据：`npm run e2e:seed`
  postgres-local:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${LOCAL_DB_USER:-grassland}
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-grassland}
      POSTGRES_DB: ${LOCAL_DB_NAME:-grassland}
    ports:
      # 55432 避开宿主机可能已占用的 5432
      - "127.0.0.1:${LOCAL_DB_PORT:-55432}:5432"
    volumes:
      # postgres 18+ 要求挂 /var/lib/postgresql（非 /data 子目录），
      # 否则报 "incompatible data directory" 并重启循环。
      - postgres_local_data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOCAL_DB_USER:-grassland} -d ${LOCAL_DB_NAME:-grassland}"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  backend_data:
  minio_data:
  temporal_dev_data:
  postgres_local_data:
  prometheus_data:
  alertmanager_data:
