      EDGE_ROUTE_DOUYIN_MEDIA_INTELLIGENCE: ${EDGE_ROUTE_DOUYIN_MEDIA_INTELLIGENCE:-true}
      EDGE_ROUTE_DOUYIN_HOT_ITEMS_INTELLIGENCE: ${EDGE_ROUTE_DOUYIN_HOT_ITEMS_INTELLIGENCE:-true}
      # Legacy 迁移：用户级分析设置 + 首页热点聚合 → intelligence-service。
      EDGE_ROUTE_SETTINGS_INTELLIGENCE: ${EDGE_ROUTE_SETTINGS_INTELLIGENCE:-true}
      EDGE_ROUTE_HOMEPAGE_INTELLIGENCE: ${EDGE_ROUTE_HOMEPAGE_INTELLIGENCE:-true}
      # HLD 7.4：直读 session 表签发内部身份断言（DATABASE_URL 复用 identity 库，只读；secret 与 identity-service 一致）。
      EDGE_IDENTITY_FROM_DATABASE_URL: "true"
      # GL-P3-IDENTITY-001：移动端 access token 验签 secret（与 identity-service 的 IDENTITY_ACCESS_TOKEN_SECRET 同值）。
      EDGE_ACCESS_TOKEN_SECRET: ${IDENTITY_ACCESS_TOKEN_SECRET:-}
      EDGE_ACCESS_TOKEN_KID: ${IDENTITY_ACCESS_TOKEN_KID:-access-token-v1}
      EDGE_ACCESS_TOKEN_PREVIOUS_KEYS: ${EDGE_ACCESS_TOKEN_PREVIOUS_KEYS:-}
