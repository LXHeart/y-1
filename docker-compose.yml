services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
      # 治理台独立 origin（运营处置 + 管理后台，入口 ops.html）：与用户端分离部署，
      # 生产可对本端口做 IP 白名单/VPN 隔离；会话/授权仍由后端 backend_role 门禁。
      - "${OPS_FRONTEND_PORT:-8083}:81"
      - "${MINIO_PROXY_PORT:-9002}:9002"  # 草场 Slice 11 Stage 3: MinIO CORS 反代端口
    environment:
      # 公网 API 统一经 edge-bff；未登记路由由 Edge fail-closed 404。
      API_UPSTREAM: ${API_UPSTREAM:-edge-bff:8080}
      # 可信公网协议；TLS 在上游 LB/ingress 终止时必须显式设为 https，禁止透传客户端 XFP。
      PUBLIC_FORWARDED_PROTO: ${PUBLIC_FORWARDED_PROTO:-http}
      # 只信任实际 LB/ingress 网段；默认 loopback 不扩大公网信任面。
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:-127.0.0.1/32}
      # CSP 策略模式：默认 report-only 观察违规（/csp-report 收集），确认收敛后设 enforce 切强制。
      CSP_MODE: ${CSP_MODE:-report-only}
      # CSP 跨源补充（空格分隔）：presigned MinIO 等图片/连接来源，按 MINIO_PUBLIC_BASE_URL 填。
      CSP_EXTRA_ORIGINS: ${CSP_EXTRA_ORIGINS:-}
    depends_on:
      edge-bff:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # JBE-02: one-shot Java bootstrap for shared account/session/settings tables.
  # It is the only empty-database prerequisite for Java services; Express no longer owns bootstrap order.
  database-bootstrap:
    build:
      context: ./platform-java
      dockerfile: services/database-bootstrap/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_BOOTSTRAP_MAX_ATTEMPTS: ${DATABASE_BOOTSTRAP_MAX_ATTEMPTS:-30}
      DATABASE_BOOTSTRAP_RETRY_DELAY_MS: ${DATABASE_BOOTSTRAP_RETRY_DELAY_MS:-2000}
    restart: "no"

  # 独立 release migration job（进度指南「生产切流前阻塞项 #1」编码）：五服务 Flyway 迁移
  # 按固定顺序在一个 one-shot 容器执行。profile=release 门控——常规 up 不启动，由
  # scripts/production-release.sh migrate 显式运行（docker compose --profile release run --rm）。
  release-migrator:
    build:
      context: ./platform-java
      dockerfile: services/release-migrator/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
    profiles: ["release"]
    restart: "no"

  # Java identity-service：默认应用栈组成部分，使用共享 DATABASE_URL（自动派生 r2dbc）。
  identity-service:
    build:
      context: ./platform-java
      dockerfile: services/identity-service/Dockerfile
    environment:
      # 本地 tracing 开关（默认关）：OTEL_TRACING_ENABLED=true + observability profile 起 Tempo
      # 即可在 Grafana 查链路；endpoint 默认指向本地 Tempo，生产 overlay 以 :? 强制外部 endpoint。
      OTEL_TRACING_ENABLED: ${OTEL_TRACING_ENABLED:-false}
      OTEL_EXPORT_ENABLED: ${OTEL_EXPORT_ENABLED:-false}
      OTEL_TRACING_SAMPLING_PROBABILITY: ${OTEL_TRACING_SAMPLING_PROBABILITY:-1.0}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://tempo:4317}
      SERVER_PORT: "8082"
      DATABASE_URL: ${DATABASE_URL:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      # GL-P0-AUTH-001：Java Web 会话 cookie 策略的部署配置。
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-y1.sid}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-auto}
      SESSION_COOKIE_SAME_SITE: ${SESSION_COOKIE_SAME_SITE:-Lax}
      SESSION_COOKIE_MAX_AGE_MS: ${SESSION_COOKIE_MAX_AGE_MS:-0}
      IDENTITY_DATASOURCE_FROM_DATABASE_URL: "true"
      # HLD 7.4 内部身份断言消费（与 edge-bff 同 secret/audience）；复用 SESSION_SECRET 保证一致。
      IDENTITY_ASSERTION_ENABLED: "true"
      IDENTITY_ASSERTION_ISSUER: ${IDENTITY_ASSERTION_ISSUER:-identity}
      IDENTITY_ASSERTION_REPLAY_ENABLED: ${IDENTITY_ASSERTION_REPLAY_ENABLED:-true}
      IDENTITY_ASSERTION_REPLAY_STORAGE: redis
      IDENTITY_ASSERTION_REPLAY_REDIS_URL: ${IDENTITY_ASSERTION_REPLAY_REDIS_URL:-redis://redis:6379}
      IDENTITY_ASSERTION_KEY_EDGE_USER_IDENTITY_KID: ${IDENTITY_ASSERTION_KEY_EDGE_USER_IDENTITY_KID:-edge-user-identity-v1}
      IDENTITY_ASSERTION_KEY_EDGE_USER_IDENTITY: ${IDENTITY_ASSERTION_KEY_EDGE_USER_IDENTITY:-}
      IDENTITY_ASSERTION_KEY_EDGE_USER_IDENTITY_PREVIOUS_KID: ${IDENTITY_ASSERTION_KEY_EDGE_USER_IDENTITY_PREVIOUS_KID:-}
      IDENTITY_ASSERTION_KEY_EDGE_USER_IDENTITY_PREVIOUS: ${IDENTITY_ASSERTION_KEY_EDGE_USER_IDENTITY_PREVIOUS:-}
      IDENTITY_ASSERTION_KEY_TRUST_SERVICE_IDENTITY_KID: ${IDENTITY_ASSERTION_KEY_TRUST_SERVICE_IDENTITY_KID:-trust-service-identity-v1}
      IDENTITY_ASSERTION_KEY_TRUST_SERVICE_IDENTITY: ${IDENTITY_ASSERTION_KEY_TRUST_SERVICE_IDENTITY:-}
      IDENTITY_ASSERTION_KEY_TRUST_SERVICE_IDENTITY_PREVIOUS_KID: ${IDENTITY_ASSERTION_KEY_TRUST_SERVICE_IDENTITY_PREVIOUS_KID:-}
      IDENTITY_ASSERTION_KEY_TRUST_SERVICE_IDENTITY_PREVIOUS: ${IDENTITY_ASSERTION_KEY_TRUST_SERVICE_IDENTITY_PREVIOUS:-}
      IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_IDENTITY_KID: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_IDENTITY_KID:-marketplace-service-identity-v1}
      IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_IDENTITY: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_IDENTITY:-}
      IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_IDENTITY_PREVIOUS_KID: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_IDENTITY_PREVIOUS_KID:-}
      IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_IDENTITY_PREVIOUS: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_IDENTITY_PREVIOUS:-}
      IDENTITY_ASSERTION_KEY_INTELLIGENCE_SERVICE_IDENTITY_KID: ${IDENTITY_ASSERTION_KEY_INTELLIGENCE_SERVICE_IDENTITY_KID:-intelligence-service-identity-v1}
      IDENTITY_ASSERTION_KEY_INTELLIGENCE_SERVICE_IDENTITY: ${IDENTITY_ASSERTION_KEY_INTELLIGENCE_SERVICE_IDENTITY:-}
      IDENTITY_ASSERTION_KEY_INTELLIGENCE_SERVICE_IDENTITY_PREVIOUS_KID: ${IDENTITY_ASSERTION_KEY_INTELLIGENCE_SERVICE_IDENTITY_PREVIOUS_KID:-}
      IDENTITY_ASSERTION_KEY_INTELLIGENCE_SERVICE_IDENTITY_PREVIOUS: ${IDENTITY_ASSERTION_KEY_INTELLIGENCE_SERVICE_IDENTITY_PREVIOUS:-}
      IDENTITY_ASSERTION_KEY_IDENTITY_SERVICE_MARKETPLACE_KID: ${IDENTITY_ASSERTION_KEY_IDENTITY_SERVICE_MARKETPLACE_KID:-identity-service-marketplace-v1}
      IDENTITY_ASSERTION_KEY_IDENTITY_SERVICE_MARKETPLACE: ${IDENTITY_ASSERTION_KEY_IDENTITY_SERVICE_MARKETPLACE:-}
      IDENTITY_ASSERTION_KEY_IDENTITY_SERVICE_INTELLIGENCE_KID: ${IDENTITY_ASSERTION_KEY_IDENTITY_SERVICE_INTELLIGENCE_KID:-identity-service-intelligence-v1}
      IDENTITY_ASSERTION_KEY_IDENTITY_SERVICE_INTELLIGENCE: ${IDENTITY_ASSERTION_KEY_IDENTITY_SERVICE_INTELLIGENCE:-}
      IDENTITY_ASSERTION_KEY_IDENTITY_SERVICE_FINANCE_KID: ${IDENTITY_ASSERTION_KEY_IDENTITY_SERVICE_FINANCE_KID:-identity-service-finance-v1}
      IDENTITY_ASSERTION_KEY_IDENTITY_SERVICE_FINANCE: ${IDENTITY_ASSERTION_KEY_IDENTITY_SERVICE_FINANCE:-}
      IDENTITY_ASSERTION_KEY_IDENTITY_SERVICE_TRUST_KID: ${IDENTITY_ASSERTION_KEY_IDENTITY_SERVICE_TRUST_KID:-identity-service-trust-v1}
      IDENTITY_ASSERTION_KEY_IDENTITY_SERVICE_TRUST: ${IDENTITY_ASSERTION_KEY_IDENTITY_SERVICE_TRUST:-}
      MARKETPLACE_SERVICE_BASE_URL: http://marketplace-service:8083
      FINANCE_SERVICE_BASE_URL: http://finance-service:8084
      TRUST_SERVICE_BASE_URL: http://trust-service:8085
      INTELLIGENCE_SERVICE_BASE_URL: http://intelligence-service:8086
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Slice 12 通知中心：消费 identity 自有 topic 派生站内通知。默认开（与 marketplace trust-consumer 同款）。
      IDENTITY_NOTIFICATION_CONSUMER_ENABLED: "true"
      # Slice 12 Stage 3：同时消费 marketplace / trust / finance topic（报名/凭证退回/结算/争议/钱包通知）。
      IDENTITY_NOTIFICATION_EXTERNAL_ENABLED: "true"
      # GL-P1-NOTIFY-001 事务邮件 outbox：SMTP 配了即开（publisher 内部再判 isConfigured）。
      IDENTITY_MAIL_OUTBOX_ENABLED: "true"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # GL-P3-MERCHANT-001：KYB 敏感字段信封加密 KEK（与 intelligence BYOK 同一变量）。
      # 未配置时 KYB 敏感字段端点 fail-closed 503，不落明文。
      CRYPTO_KEK_BASE64: ${CRYPTO_KEK_BASE64:-}
      # KEK 轮换（双 KEK 并存）：两个服务必须配一致，见运行手册
      CRYPTO_KEK_VERSION: ${CRYPTO_KEK_VERSION:-1}
      CRYPTO_KEK_PREVIOUS: ${CRYPTO_KEK_PREVIOUS:-}
      IDENTITY_KYB_REVIEW_SLA_SECONDS: ${IDENTITY_KYB_REVIEW_SLA_SECONDS:-259200}
      IDENTITY_KYB_MEDIA_VALIDATION_TIMEOUT_MS: ${IDENTITY_KYB_MEDIA_VALIDATION_TIMEOUT_MS:-3000}
      IDENTITY_KYB_DOCUMENT_ANALYSIS_ENABLED: ${IDENTITY_KYB_DOCUMENT_ANALYSIS_ENABLED:-true}
      IDENTITY_PERMISSION_SLA_MONITOR_ENABLED: ${IDENTITY_PERMISSION_SLA_MONITOR_ENABLED:-true}
      IDENTITY_PERMISSION_SLA_MONITOR_POLL_INTERVAL_MS: ${IDENTITY_PERMISSION_SLA_MONITOR_POLL_INTERVAL_MS:-60000}
      IDENTITY_PERMISSION_AUTO_REVIEW_ENABLED: ${IDENTITY_PERMISSION_AUTO_REVIEW_ENABLED:-true}
      IDENTITY_PERMISSION_AUTO_REVIEW_POLL_INTERVAL_MS: ${IDENTITY_PERMISSION_AUTO_REVIEW_POLL_INTERVAL_MS:-5000}
      IDENTITY_KYB_RETENTION_ENABLED: ${IDENTITY_KYB_RETENTION_ENABLED:-true}
      IDENTITY_KYB_RETENTION_LIVE_LEASE_SECONDS: ${IDENTITY_KYB_RETENTION_LIVE_LEASE_SECONDS:-604800}
      IDENTITY_KYB_RETENTION_RENEW_AHEAD_SECONDS: ${IDENTITY_KYB_RETENTION_RENEW_AHEAD_SECONDS:-172800}
      IDENTITY_KYB_APPROVED_RETENTION_DAYS: ${IDENTITY_KYB_APPROVED_RETENTION_DAYS:-2555}
      IDENTITY_KYB_REJECTED_RETENTION_DAYS: ${IDENTITY_KYB_REJECTED_RETENTION_DAYS:-365}
      # 移动端 token 认证（GL-P3-IDENTITY-001）。secret 留空 = 移动端登录/刷新/撤销一律 503
      # （fail-closed），Web cookie 路径不受影响。启用时须与 edge-bff 验签方同值。
      IDENTITY_ACCESS_TOKEN_SECRET: ${IDENTITY_ACCESS_TOKEN_SECRET:-}
      # 登录防滥用限流（LoginRateLimiter）：默认生产口径；隔离 e2e 三浏览器矩阵共享 127.0.0.1，
      # 需在 ci-e2e.sh 里放宽（只影响 e2e 栈，默认值不动）。
      IDENTITY_SECURITY_LOGIN_RATE_LIMIT_IP_MAX: ${IDENTITY_SECURITY_LOGIN_RATE_LIMIT_IP_MAX:-10}
      IDENTITY_SECURITY_LOGIN_RATE_LIMIT_ACCOUNT_IP_MAX: ${IDENTITY_SECURITY_LOGIN_RATE_LIMIT_ACCOUNT_IP_MAX:-5}
      IDENTITY_ACCESS_TOKEN_KID: ${IDENTITY_ACCESS_TOKEN_KID:-access-token-v1}
      IDENTITY_ACCESS_TOKEN_TTL_SECONDS: ${IDENTITY_ACCESS_TOKEN_TTL_SECONDS:-900}
      IDENTITY_REFRESH_TOKEN_TTL_DAYS: ${IDENTITY_REFRESH_TOKEN_TTL_DAYS:-30}
      IDENTITY_REFRESH_TOKEN_MAX_ACTIVE: ${IDENTITY_REFRESH_TOKEN_MAX_ACTIVE:-10}
      IDENTITY_ACTIVE_IDENTITY_MAX_SESSIONS: ${IDENTITY_ACTIVE_IDENTITY_MAX_SESSIONS:-0}
      # 过期行清理定时任务：默认关（本地/测试不起），容器内开。
      IDENTITY_REFRESH_TOKEN_CLEANUP_ENABLED: ${IDENTITY_REFRESH_TOKEN_CLEANUP_ENABLED:-true}
    depends_on:
      database-bootstrap:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9082/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # GL-P3-PLATFORM-001：私网 Prometheus，抓六个 Java 服务与领域积压指标，加载告警规则。
  # 不发布宿主端口、不经 Nginx；告警推送至下方 Alertmanager（接收端凭据属部署侧）。
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./platform-java/deploy/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./platform-java/deploy/observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    depends_on:
      edge-bff:
        condition: service_started
      identity-service:
        condition: service_started
      marketplace-service:
        condition: service_started
      finance-service:
        condition: service_started
      trust-service:
        condition: service_started
      intelligence-service:
        condition: service_started
    restart: unless-stopped

  # GL-P3-PLATFORM-001：私网 Alertmanager。receiver URL 只从挂载 secret 文件读取。
  alertmanager:
    profiles: ["observability"]
    image: prom/alertmanager:v0.27.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./platform-java/deploy/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ${ALERTMANAGER_WEBHOOK_URL_FILE:-./platform-java/deploy/observability/alertmanager/webhook-url.example}:/run/secrets/alertmanager_webhook_url:ro
      - alertmanager_data:/alertmanager
    restart: unless-stopped

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ${GRAFANA_ADMIN_PASSWORD_FILE:-./platform-java/deploy/observability/grafana/admin-password.example}:/run/secrets/grafana_admin_password:ro
      - ./platform-java/deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./platform-java/deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    restart: unless-stopped

  # 本地日志聚合（观测三支柱补齐 logging）：Promtail 经 docker 服务发现收集本项目容器
  # stdout → Loki → Grafana（datasources/loki.yml 已 provision）。生产不跑本地 Loki——
  # 生产 overlay 以 LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs 输出结构化 JSON，由部署侧收集器接管。
  loki:
    profiles: ["observability"]
    image: grafana/loki:3.5.1
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./platform-java/deploy/observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    restart: unless-stopped

  promtail:
    profiles: ["observability"]
    image: grafana/promtail:3.5.1
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./platform-java/deploy/observability/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      # docker 服务发现需要 socket；日志文件读取需要容器目录（Docker Desktop VM 内路径，可直挂）。
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # 位置持久化：容器重建不回放整段历史（长存活容器回放会被 Loki 按批拒绝，见 loki.yml）。
      - promtail_data:/positions
    depends_on:
      loki:
        condition: service_started
    restart: unless-stopped

  # 本地 trace 后端（观测三支柱补齐 tracing）：Tempo 自带 OTLP 接收器，Java 服务开启
  # OTEL_TRACING_ENABLED=true 后直连 http://tempo:4317（基座 compose 已为六服务预置该
  # endpoint 默认值）。生产 trace 走外部 HTTPS collector，不跑本地 Tempo。
  tempo:
    profiles: ["observability"]
    image: grafana/tempo:2.9.0
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./platform-java/deploy/observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    restart: unless-stopped

  # 统一 Java Edge BFF 入口。Nginx 的 /api 与 /health 只指向本服务；
  # RouteManifest 未命中、method 不匹配或 flag=false 均在 Edge 返回 404。
  edge-bff:
    build:
      context: ./platform-java
      dockerfile: services/edge-bff/Dockerfile
    environment:
      # 本地 tracing 开关（默认关）：OTEL_TRACING_ENABLED=true + observability profile 起 Tempo
      # 即可在 Grafana 查链路；endpoint 默认指向本地 Tempo，生产 overlay 以 :? 强制外部 endpoint。
      OTEL_TRACING_ENABLED: ${OTEL_TRACING_ENABLED:-false}
      OTEL_EXPORT_ENABLED: ${OTEL_EXPORT_ENABLED:-false}
      OTEL_TRACING_SAMPLING_PROBABILITY: ${OTEL_TRACING_SAMPLING_PROBABILITY:-1.0}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://tempo:4317}
      SERVER_PORT: "8080"
      IDENTITY_SERVICE_BASE_URL: http://identity-service:8082
      MARKETPLACE_SERVICE_BASE_URL: http://marketplace-service:8083
      FINANCE_SERVICE_BASE_URL: http://finance-service:8084
      TRUST_SERVICE_BASE_URL: http://trust-service:8085
      INTELLIGENCE_SERVICE_BASE_URL: http://intelligence-service:8086
      # RouteManifest 启动期切流开关。必须在 compose 显式透传，否则 .env 中的回滚配置不会进入容器。
      EDGE_ROUTE_AUTH_ME_IDENTITY: ${EDGE_ROUTE_AUTH_ME_IDENTITY:-true}
      EDGE_ROUTE_AUTH_LOGIN_IDENTITY: ${EDGE_ROUTE_AUTH_LOGIN_IDENTITY:-true}
      # 任务书 #48：首登强制改密端点
      EDGE_ROUTE_AUTH_CHANGEPASSWORD_IDENTITY: ${EDGE_ROUTE_AUTH_CHANGEPASSWORD_IDENTITY:-true}
      EDGE_ROUTE_AUTH_LOGOUT_IDENTITY: ${EDGE_ROUTE_AUTH_LOGOUT_IDENTITY:-true}
      EDGE_ROUTE_AUTH_CAPTCHA_IDENTITY: ${EDGE_ROUTE_AUTH_CAPTCHA_IDENTITY:-true}
      EDGE_ROUTE_AUTH_SENDCODE_IDENTITY: ${EDGE_ROUTE_AUTH_SENDCODE_IDENTITY:-true}
      EDGE_ROUTE_AUTH_REGISTER_IDENTITY: ${EDGE_ROUTE_AUTH_REGISTER_IDENTITY:-true}
      EDGE_ROUTE_AUTH_REFRESH_IDENTITY: ${EDGE_ROUTE_AUTH_REFRESH_IDENTITY:-true}
      EDGE_ROUTE_AUTH_REVOKE_IDENTITY: ${EDGE_ROUTE_AUTH_REVOKE_IDENTITY:-true}
      EDGE_ROUTE_TASKS_MARKETPLACE: ${EDGE_ROUTE_TASKS_MARKETPLACE:-true}
      EDGE_ROUTE_ANALYTICS_MARKETPLACE: ${EDGE_ROUTE_ANALYTICS_MARKETPLACE:-true}
      EDGE_ROUTE_COMMERCE_MARKETPLACE: ${EDGE_ROUTE_COMMERCE_MARKETPLACE:-true}
      EDGE_ROUTE_ORGANIZATIONS_IDENTITY: ${EDGE_ROUTE_ORGANIZATIONS_IDENTITY:-true}
      EDGE_ROUTE_STORES_PUBLIC_IDENTITY: ${EDGE_ROUTE_STORES_PUBLIC_IDENTITY:-true}
      EDGE_ROUTE_ME_IDENTITY: ${EDGE_ROUTE_ME_IDENTITY:-true}
      EDGE_ROUTE_ADMIN_PERMREQ_IDENTITY: ${EDGE_ROUTE_ADMIN_PERMREQ_IDENTITY:-true}
      EDGE_ROUTE_ADMIN_KYB_IDENTITY: ${EDGE_ROUTE_ADMIN_KYB_IDENTITY:-true}
      EDGE_ROUTE_ADMIN_RECOMMENDER_IDENTITY: ${EDGE_ROUTE_ADMIN_RECOMMENDER_IDENTITY:-true}
      EDGE_ROUTE_ADMIN_ORGRENAME_IDENTITY: ${EDGE_ROUTE_ADMIN_ORGRENAME_IDENTITY:-true}
      # 任务书 #51：运营台主体搜索 + 成员账号前缀改名
      EDGE_ROUTE_ADMIN_ORGANIZATIONS_IDENTITY: ${EDGE_ROUTE_ADMIN_ORGANIZATIONS_IDENTITY:-true}
      EDGE_ROUTE_AI_INTELLIGENCE: ${EDGE_ROUTE_AI_INTELLIGENCE:-true}
      EDGE_ROUTE_IMAGE_STUDIO_INTELLIGENCE: ${EDGE_ROUTE_IMAGE_STUDIO_INTELLIGENCE:-true}
      EDGE_ROUTE_VIDEO_STUDIO_INTELLIGENCE: ${EDGE_ROUTE_VIDEO_STUDIO_INTELLIGENCE:-true}
      EDGE_ROUTE_GUEST_TRIAL_INTELLIGENCE: ${EDGE_ROUTE_GUEST_TRIAL_INTELLIGENCE:-true}
      EDGE_ROUTE_CONTENT_SAFETY_INTELLIGENCE: ${EDGE_ROUTE_CONTENT_SAFETY_INTELLIGENCE:-true}
      EDGE_ROUTE_ADMIN_CONTENT_SAFETY_INTELLIGENCE: ${EDGE_ROUTE_ADMIN_CONTENT_SAFETY_INTELLIGENCE:-true}
      EDGE_ROUTE_SPEECH_INTELLIGENCE: ${EDGE_ROUTE_SPEECH_INTELLIGENCE:-true}
      EDGE_ROUTE_ADMIN_AI_INTELLIGENCE: ${EDGE_ROUTE_ADMIN_AI_INTELLIGENCE:-true}
