      PUBLIC_BACKEND_ORIGIN: ${PUBLIC_BACKEND_ORIGIN:-}
      BILIBILI_PROXY_TOKEN_SECRET: ${BILIBILI_PROXY_TOKEN_SECRET:-}
      DOUYIN_PROXY_TOKEN_SECRET: ${DOUYIN_PROXY_TOKEN_SECRET:-}
      SECURITY_CSRF_ORIGIN_CHECK: ${SECURITY_CSRF_ORIGIN_CHECK:-1}
      # GL-P0-ASSERT-001 keyring 模式：edge-bff 签发用户断言到各领域服务
      IDENTITY_ASSERTION_ENABLED: "true"
      IDENTITY_ASSERTION_ISSUER: ${IDENTITY_ASSERTION_ISSUER:-edge-bff}
      IDENTITY_ASSERTION_REPLAY_ENABLED: ${IDENTITY_ASSERTION_REPLAY_ENABLED:-true}
      IDENTITY_ASSERTION_REPLAY_STORAGE: redis
      IDENTITY_ASSERTION_REPLAY_REDIS_URL: ${IDENTITY_ASSERTION_REPLAY_REDIS_URL:-redis://redis:6379}
      IDENTITY_ASSERTION_KEY_EDGE_USER_IDENTITY_KID: ${IDENTITY_ASSERTION_KEY_EDGE_USER_IDENTITY_KID:-edge-user-identity-v1}
      IDENTITY_ASSERTION_KEY_EDGE_USER_IDENTITY: ${IDENTITY_ASSERTION_KEY_EDGE_USER_IDENTITY:-}
      IDENTITY_ASSERTION_KEY_EDGE_USER_MARKETPLACE_KID: ${IDENTITY_ASSERTION_KEY_EDGE_USER_MARKETPLACE_KID:-edge-user-marketplace-v1}
      IDENTITY_ASSERTION_KEY_EDGE_USER_MARKETPLACE: ${IDENTITY_ASSERTION_KEY_EDGE_USER_MARKETPLACE:-}
      IDENTITY_ASSERTION_KEY_EDGE_USER_FINANCE_KID: ${IDENTITY_ASSERTION_KEY_EDGE_USER_FINANCE_KID:-edge-user-finance-v1}
      IDENTITY_ASSERTION_KEY_EDGE_USER_FINANCE: ${IDENTITY_ASSERTION_KEY_EDGE_USER_FINANCE:-}
      IDENTITY_ASSERTION_KEY_EDGE_USER_TRUST_KID: ${IDENTITY_ASSERTION_KEY_EDGE_USER_TRUST_KID:-edge-user-trust-v1}
      IDENTITY_ASSERTION_KEY_EDGE_USER_TRUST: ${IDENTITY_ASSERTION_KEY_EDGE_USER_TRUST:-}
      IDENTITY_ASSERTION_KEY_EDGE_USER_INTELLIGENCE_KID: ${IDENTITY_ASSERTION_KEY_EDGE_USER_INTELLIGENCE_KID:-edge-user-intelligence-v1}
      IDENTITY_ASSERTION_KEY_EDGE_USER_INTELLIGENCE: ${IDENTITY_ASSERTION_KEY_EDGE_USER_INTELLIGENCE:-}
    ports:
      # Vite 本地开发仍可访问 localhost:8081；公网只能经 frontend Nginx。
      - "127.0.0.1:${EDGE_BFF_PORT:-8081}:8080"
    depends_on:
      identity-service:
        condition: service_healthy
      marketplace-service:
        condition: service_healthy
      finance-service:
        condition: service_healthy
      trust-service:
        condition: service_healthy
      intelligence-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # Java marketplace-service（Epic 4）：默认应用栈组成部分。
  # 独立 Flyway 历史（marketplace_flyway_schema）；与 identity 共用 neon；消费 BFF 断言。
  marketplace-service:
    build:
      context: ./platform-java
      dockerfile: services/marketplace-service/Dockerfile
    # 不发布宿主端口（GL-P0-SEC-002）：仅 Docker 网络内可达，同 identity-service。
    # 容器间调用走服务名（MARKETPLACE_SERVICE_BASE_URL=http://marketplace-service:8083）。
    # 对外入口只有 Nginx；edge-bff 的宿主端口仅绑定 loopback 供本地调试。
    environment:
      # 本地 tracing 开关（默认关）：OTEL_TRACING_ENABLED=true + observability profile 起 Tempo
      # 即可在 Grafana 查链路；endpoint 默认指向本地 Tempo，生产 overlay 以 :? 强制外部 endpoint。
      OTEL_TRACING_ENABLED: ${OTEL_TRACING_ENABLED:-false}
      OTEL_EXPORT_ENABLED: ${OTEL_EXPORT_ENABLED:-false}
      OTEL_TRACING_SAMPLING_PROBABILITY: ${OTEL_TRACING_SAMPLING_PROBABILITY:-1.0}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://tempo:4317}
      SERVER_PORT: "8083"
      DATABASE_URL: ${DATABASE_URL:-}
      MARKETPLACE_DATASOURCE_FROM_DATABASE_URL: "true"
      MARKETPLACE_COMMERCE_REDEEM_CODE_SECRET: ${MARKETPLACE_COMMERCE_REDEEM_CODE_SECRET:-local-commerce-redeem-secret-change-me}
      MARKETPLACE_COMMERCE_DISPATCHER_ENABLED: ${MARKETPLACE_COMMERCE_DISPATCHER_ENABLED:-true}
      # GL-P0-ASSERT-001 keyring 模式：marketplace 签发服务断言到 finance/trust/intelligence，验证 edge-bff 用户断言与 trust 服务断言
      IDENTITY_ASSERTION_ENABLED: "true"
      IDENTITY_ASSERTION_ISSUER: ${IDENTITY_ASSERTION_ISSUER:-marketplace}
      IDENTITY_ASSERTION_REPLAY_ENABLED: ${IDENTITY_ASSERTION_REPLAY_ENABLED:-true}
      IDENTITY_ASSERTION_REPLAY_STORAGE: redis
      IDENTITY_ASSERTION_REPLAY_REDIS_URL: ${IDENTITY_ASSERTION_REPLAY_REDIS_URL:-redis://redis:6379}
      IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_FINANCE_KID: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_FINANCE_KID:-marketplace-service-finance-v1}
      IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_FINANCE: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_FINANCE:-}
      IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_TRUST_KID: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_TRUST_KID:-marketplace-service-trust-v1}
      IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_TRUST: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_TRUST:-}
      IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_INTELLIGENCE_KID: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_INTELLIGENCE_KID:-marketplace-service-intelligence-v1}
      IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_INTELLIGENCE: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_INTELLIGENCE:-}
      IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_IDENTITY_KID: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_IDENTITY_KID:-marketplace-service-identity-v1}
      IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_IDENTITY: ${IDENTITY_ASSERTION_KEY_MARKETPLACE_SERVICE_IDENTITY:-}
      IDENTITY_ASSERTION_KEY_EDGE_USER_MARKETPLACE_KID: ${IDENTITY_ASSERTION_KEY_EDGE_USER_MARKETPLACE_KID:-edge-user-marketplace-v1}
      IDENTITY_ASSERTION_KEY_EDGE_USER_MARKETPLACE: ${IDENTITY_ASSERTION_KEY_EDGE_USER_MARKETPLACE:-}
      IDENTITY_ASSERTION_KEY_EDGE_USER_MARKETPLACE_PREVIOUS_KID: ${IDENTITY_ASSERTION_KEY_EDGE_USER_MARKETPLACE_PREVIOUS_KID:-}
      IDENTITY_ASSERTION_KEY_EDGE_USER_MARKETPLACE_PREVIOUS: ${IDENTITY_ASSERTION_KEY_EDGE_USER_MARKETPLACE_PREVIOUS:-}
      IDENTITY_ASSERTION_KEY_TRUST_SERVICE_MARKETPLACE_KID: ${IDENTITY_ASSERTION_KEY_TRUST_SERVICE_MARKETPLACE_KID:-trust-service-marketplace-v1}
      IDENTITY_ASSERTION_KEY_TRUST_SERVICE_MARKETPLACE: ${IDENTITY_ASSERTION_KEY_TRUST_SERVICE_MARKETPLACE:-}
      IDENTITY_ASSERTION_KEY_TRUST_SERVICE_MARKETPLACE_PREVIOUS_KID: ${IDENTITY_ASSERTION_KEY_TRUST_SERVICE_MARKETPLACE_PREVIOUS_KID:-}
      IDENTITY_ASSERTION_KEY_TRUST_SERVICE_MARKETPLACE_PREVIOUS: ${IDENTITY_ASSERTION_KEY_TRUST_SERVICE_MARKETPLACE_PREVIOUS:-}
      IDENTITY_ASSERTION_KEY_INTELLIGENCE_SERVICE_MARKETPLACE_KID: ${IDENTITY_ASSERTION_KEY_INTELLIGENCE_SERVICE_MARKETPLACE_KID:-intelligence-service-marketplace-v1}
      IDENTITY_ASSERTION_KEY_INTELLIGENCE_SERVICE_MARKETPLACE: ${IDENTITY_ASSERTION_KEY_INTELLIGENCE_SERVICE_MARKETPLACE:-}
      IDENTITY_ASSERTION_KEY_INTELLIGENCE_SERVICE_MARKETPLACE_PREVIOUS_KID: ${IDENTITY_ASSERTION_KEY_INTELLIGENCE_SERVICE_MARKETPLACE_PREVIOUS_KID:-}
      IDENTITY_ASSERTION_KEY_INTELLIGENCE_SERVICE_MARKETPLACE_PREVIOUS: ${IDENTITY_ASSERTION_KEY_INTELLIGENCE_SERVICE_MARKETPLACE_PREVIOUS:-}
      IDENTITY_ASSERTION_KEY_IDENTITY_SERVICE_MARKETPLACE_KID: ${IDENTITY_ASSERTION_KEY_IDENTITY_SERVICE_MARKETPLACE_KID:-identity-service-marketplace-v1}
      IDENTITY_ASSERTION_KEY_IDENTITY_SERVICE_MARKETPLACE: ${IDENTITY_ASSERTION_KEY_IDENTITY_SERVICE_MARKETPLACE:-}
      IDENTITY_ASSERTION_KEY_IDENTITY_SERVICE_MARKETPLACE_PREVIOUS_KID: ${IDENTITY_ASSERTION_KEY_IDENTITY_SERVICE_MARKETPLACE_PREVIOUS_KID:-}
      IDENTITY_ASSERTION_KEY_IDENTITY_SERVICE_MARKETPLACE_PREVIOUS: ${IDENTITY_ASSERTION_KEY_IDENTITY_SERVICE_MARKETPLACE_PREVIOUS:-}
      # 无 MinIO 凭据：媒体上传走 intelligence-service 鉴权链路（GL-P0-SEC-002）
      TEMPORAL_TARGET: temporal:7233
      TEMPORAL_TEST_SERVER: ${TEMPORAL_TEST_SERVER:-false}
      # P2 等级权益把 T+2/T+1 的“天”映射为秒；安全默认是真实一天，E2E 脚本显式压缩为 2s。
      SETTLEMENT_DAY_SECONDS: ${SETTLEMENT_DAY_SECONDS:-86400}
      # D-03：dev 默认 5s；生产设 259200（3 天）。窗口短于 24h 前置时提醒自动跳过。
      CONFIRMATION_WINDOW_SECONDS: ${CONFIRMATION_WINDOW_SECONDS:-5}
      CONFIRMATION_REMINDER_LEAD_SECONDS: ${CONFIRMATION_REMINDER_LEAD_SECONDS:-86400}
      CONFIRMATION_SUPPLEMENT_CAP: ${CONFIRMATION_SUPPLEMENT_CAP:-2}
      CONFIRMATION_CS_SLA_SECONDS: ${CONFIRMATION_CS_SLA_SECONDS:-0}
      MARKETPLACE_CONFIRMATION_CS_SLA_BUSINESS_DAYS: ${MARKETPLACE_CONFIRMATION_CS_SLA_BUSINESS_DAYS:-3}
      MARKETPLACE_CONFIRMATION_HOLIDAYS: ${MARKETPLACE_CONFIRMATION_HOLIDAYS:-}
      MARKETPLACE_CONFIRMATION_WORKING_DAYS: ${MARKETPLACE_CONFIRMATION_WORKING_DAYS:-}
      FINANCE_SERVICE_BASE_URL: http://finance-service:8084
      TRUST_SERVICE_BASE_URL: http://trust-service:8085
      INTELLIGENCE_SERVICE_BASE_URL: http://intelligence-service:8086
      IDENTITY_SERVICE_BASE_URL: http://identity-service:8082
      MARKETPLACE_TRUST_CONSUMER_ENABLED: ${MARKETPLACE_TRUST_CONSUMER_ENABLED:-true}
      # 死信登记（GL-P1-OPS-001）：跟随 trust 消费者一起开，否则重试耗尽的事件会静静躺在 *.DLT 里没人看。
      MARKETPLACE_DLT_CONSUMER_ENABLED: ${MARKETPLACE_DLT_CONSUMER_ENABLED:-${MARKETPLACE_TRUST_CONSUMER_ENABLED:-true}}
      MARKETPLACE_DLT_CONSUMER_TOPICS: ${MARKETPLACE_DLT_CONSUMER_TOPICS:-grassland.trust.events.DLT}
      # 运营死信 retention 清理（GL-P3-PLATFORM-001）：跟随 dlt 消费者一起开，否则 ops_dlt_message 只增不减。
      # dlt-metrics gauge 总是开（与消费者无关），这里只配清理任务。
      MARKETPLACE_OPS_DLT_CLEANUP_ENABLED: ${MARKETPLACE_OPS_DLT_CLEANUP_ENABLED:-${MARKETPLACE_DLT_CONSUMER_ENABLED:-${MARKETPLACE_TRUST_CONSUMER_ENABLED:-true}}}
      MARKETPLACE_OPS_DLT_CLEANUP_RETENTION_DAYS: ${MARKETPLACE_OPS_DLT_CLEANUP_RETENTION_DAYS:-30}
    depends_on:
      database-bootstrap:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
      finance-service:
        condition: service_started
      trust-service:
        condition: service_started
      intelligence-service:
        condition: service_started
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9082/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # Java finance-service（Epic 4 Slice 4D）：默认应用栈组成部分。
  # 独立 Flyway 历史（finance_flyway_schema）；与 identity/marketplace 共用 neon；消费 BFF 断言。
  # 为后续「接受报名→资金预留→激活/补偿」Saga 扫清依赖（ReserveFunds/escrow 留后续 slice）。
  finance-service:
