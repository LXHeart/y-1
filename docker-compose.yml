services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      CORS_ORIGIN: ${CORS_ORIGIN}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      DOUYIN_FETCH_TIMEOUT_MS: ${DOUYIN_FETCH_TIMEOUT_MS:-15000}
      DOUYIN_LOGIN_TIMEOUT_MS: ${DOUYIN_LOGIN_TIMEOUT_MS:-180000}
      DOUYIN_LOGIN_URL: ${DOUYIN_LOGIN_URL:-https://www.douyin.com/}
      DOUYIN_STORAGE_STATE_PATH: ${DOUYIN_STORAGE_STATE_PATH:-server/.data/douyin-storage-state.json}
      DOUYIN_MEDIA_PROCESS_TIMEOUT_MS: ${DOUYIN_MEDIA_PROCESS_TIMEOUT_MS:-45000}
      DOUYIN_MEDIA_TEMP_DIR: ${DOUYIN_MEDIA_TEMP_DIR:-server/.data/douyin-audio}
      DOUYIN_USER_AGENT: ${DOUYIN_USER_AGENT}
      DOUYIN_PROXY_TOKEN_SECRET: ${DOUYIN_PROXY_TOKEN_SECRET}
      PUBLIC_BACKEND_ORIGIN: ${PUBLIC_BACKEND_ORIGIN}
      VIDEO_ANALYSIS_API_PATH: ${VIDEO_ANALYSIS_API_PATH:-}
      VIDEO_ANALYSIS_API_TIMEOUT_MS: ${VIDEO_ANALYSIS_API_TIMEOUT_MS:-180000}
      BILIBILI_FETCH_TIMEOUT_MS: ${BILIBILI_FETCH_TIMEOUT_MS:-15000}
      BILIBILI_MEDIA_TEMP_DIR: ${BILIBILI_MEDIA_TEMP_DIR:-server/.data/bilibili-media}
      BILIBILI_USER_AGENT: ${BILIBILI_USER_AGENT}
      BILIBILI_PROXY_TOKEN_SECRET: ${BILIBILI_PROXY_TOKEN_SECRET}
      FFMPEG_PATH: ${FFMPEG_PATH:-ffmpeg}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      IDENTITY_DATASOURCE_FROM_DATABASE_URL: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - backend_data:/app/server/.data
    restart: unless-stopped

  # 可选 Java identity-service（Epic 2 Slice 2A）：只读 legacy session/app_users，提供 /internal/identity/me。
  # 仅在使用 --profile java-edge 时启动；复用 backend 的 DATABASE_URL（自动派生 r2dbc）。
  identity-service:
    profiles: ["java-edge"]
    build:
      context: ./platform-java
      dockerfile: services/identity-service/Dockerfile
    environment:
      SERVER_PORT: "8082"
      DATABASE_URL: ${DATABASE_URL:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      IDENTITY_DATASOURCE_FROM_DATABASE_URL: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      - backend
    restart: unless-stopped

  # 可选 Java Edge BFF 评估入口。
  # 仅在使用 --profile java-edge 时启动；默认不参与，且 Nginx 仍直连 backend:3000。
  # /api/auth/me 经 RouteManifest 路由到 identity-service，其余透传 Express。
  edge-bff:
    profiles: ["java-edge"]
    build:
      context: ./platform-java
      dockerfile: services/edge-bff/Dockerfile
    environment:
      SERVER_PORT: "8080"
      LEGACY_EXPRESS_BASE_URL: http://backend:3000
      IDENTITY_SERVICE_BASE_URL: http://identity-service:8082
      EDGE_ROUTE_AUTH_ME_IDENTITY: "true"
    ports:
      - "${EDGE_BFF_PORT:-8081}:8080"
    depends_on:
      - backend
      - identity-service
    restart: unless-stopped

  # Epic 3：事件基础设施
  kafka:
    image: apache/kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  # Epic 3：对象存储（S3 兼容）。无 profile 常驻（与 kafka/redis 一致），service name minio。
  # bucket 由 platform-storage 适配器在服务启动时幂等创建，无需 mc init 容器。
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  backend_data:
  minio_data:
