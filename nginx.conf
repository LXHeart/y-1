    }
    client_max_body_size 1m;

    proxy_pass http://${API_UPSTREAM}/api/csp-report;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto "${PUBLIC_FORWARDED_PROTO}";
    proxy_set_header Forwarded "";
    proxy_set_header X-Grassland-Identity "";
  }

  location /api/ {
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Strict-Transport-Security;

    proxy_pass http://${API_UPSTREAM};
    proxy_http_version 1.1;
    client_max_body_size 32m;
    proxy_connect_timeout 30s;
    proxy_send_timeout 210s;
    proxy_read_timeout 210s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto "${PUBLIC_FORWARDED_PROTO}";
    proxy_set_header Forwarded "";
    proxy_set_header X-Grassland-Identity "";
  }

  location /health {
    proxy_pass http://${API_UPSTREAM}/health;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto "${PUBLIC_FORWARDED_PROTO}";
    proxy_set_header Forwarded "";
    proxy_set_header X-Grassland-Identity "";
  }

  # 与 80 端口 server 镜像：内容哈希资源缺失必须 404，禁止回退 ai.html（见 80 块说明）。
  location ^~ /assets/ {
    try_files $uri =404;
  }

  location / {
    # AI 应用 SPA 回退到 ai.html（不是 index.html）。
    try_files $uri $uri/ /ai.html;
  }
}

# 草场 Slice 11 Stage 3：MinIO CORS 反代。
# 浏览器 presigned PUT/OPTIONS 走此端口（宿主 9002），nginx 注入 CORS 头后转 MinIO:9000。
# MINIO_PUBLIC_BASE_URL=http://localhost:9002 → S3Presigner 签 URL host 为 localhost:9002；
# 浏览器 PUT 打到 nginx:9002 → proxy_pass minio:9000（转发原 Host 保持 SigV4 签名有效）。
# 版本无关：不依赖 putBucketCors API（MinIO latest 该端点返回 501 NotImplemented）。
server {
  listen 9002;
  server_name _;

  # 管理 API 不属于 presigned 对象传输面，公网直传端口始终关闭。
  location ^~ /minio/admin/ {
    return 404;
  }

  location / {
    # presigned 入口仅承载对象读写；禁止 DELETE/POST 等扩大凭据误配后的破坏面。
    if ($request_method !~ ^(GET|HEAD|PUT|OPTIONS)$) {
      return 405;
    }

    # 默认 1m 会让 >1MB 直传 PUT 在 nginx 即被 413（未到 MinIO）。
    # 对齐 /api 的 32m：覆盖媒体 20MB 帽与语音 25MB 帽（上限真值在 MediaController/前端预检）。
    client_max_body_size 32m;

    # OPTIONS preflight：直接 204，不转 MinIO（MinIO 不处理无凭据 OPTIONS）。
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin $http_origin always;
      add_header Access-Control-Allow-Methods "PUT, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type" always;
      add_header Access-Control-Max-Age 3600 always;
      return 204;
    }

    proxy_pass http://minio:9000;
    proxy_http_version 1.1;
    # 转发原始 Host（如 localhost:9002），保持 SigV4 presigned 签名有效。
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # MinIO 对「实际请求」（非 preflight）会自己回 CORS 头。若此处再 add_header，
    # 响应将出现两个 Access-Control-Allow-Origin —— curl 不校验（PUT 仍 200），
    # 但浏览器判定 "contains multiple values" 直接拒绝。故先 hide 上游的，再由
    # nginx 输出唯一一份，保证 preflight 与实际响应策略一致。
    # 验证时必须数 header 条数（grep -c），只看 200 会误判为通过。
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Expose-Headers;

    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Methods "PUT, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type" always;
    add_header Access-Control-Expose-Headers "ETag" always;
  }
}
