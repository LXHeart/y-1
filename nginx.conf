# 只信任部署明确配置的上一跳代理；默认 loopback 等价于不信任外部代理。
# real_ip 模块先还原客户端地址，随后 $proxy_add_x_forwarded_for 以该可信地址重建链尾。
set_real_ip_from ${TRUSTED_PROXY_CIDR};
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# GL-P0-AUTH-001：本容器监听 80，外部协议由部署参数明确指定。
# 不信任客户端 X-Forwarded-Proto，也不使用恒为 http 的容器内 $scheme。
# TLS 在 LB/ingress 终止时必须设置 PUBLIC_FORWARDED_PROTO=https。
map "${PUBLIC_FORWARDED_PROTO}" $hsts_header {
  default        "";
  "https"        "max-age=15552000; includeSubDomains";
}

# 静态资源缓存策略（发版正确性）：
# - /assets/* 是 Vite 内容哈希文件名，任何变化必然换 URL → 一年 immutable；
# - index.html 是 SPA 入口（try_files 的内部重定向最终 $uri=/index.html），
#   必须 no-cache 每次回源校验，否则发版后用户持续命中旧入口、加载已删除的旧 chunk。
# - 其余（favicon 等根级未哈希文件、/api、/health）值为空串 → nginx 不发送该头，维持现状。
# 与 HSTS/CSP 同一个 map 模式：add_header 值为空串时不发送，避免 location 级
# add_header 触发「丢弃 server 级全部 add_header」的继承陷阱。
# 刻意不带 always：404 等错误响应不发 immutable/no-cache（/assets/xxx 404 不应被长缓存）。
map $uri $static_cache_control {
  default        "";
  /index.html    "no-cache";
  /ops.html      "no-cache";
  /ai.html       "no-cache";
  # 跨应用 origin 运行时配置（任务书 #76）：改端口/域名必须即时生效，禁缓存。
  /app-config.js "no-store";
  ~^/assets/     "public, max-age=31536000, immutable";
}

# 文本类资源压缩。text/event-stream（SSE 生成流）与已压缩格式（图片/字体/woff2）刻意不在
# gzip_types 内；gzip_min_length 依赖 Content-Length，无 CL 的流式响应自动跳过。
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types text/plain text/css text/javascript application/javascript application/json
           application/xml image/svg+xml;

# CSP（report-only → 强制）：默认 report-only 观察违规，CSP_MODE=enforce 切强制头。
# nginx 的 add_header 在值为空串时不发送，两个互斥头靠 map 置空实现单选。
# script-src 不开 unsafe-inline（生产构建全部外链模块）；唯一的内联脚本是 index.html 的
# 防 FOUC 主题引导，以 sha256 hash 精确放行（index.html 改动必须同步这里的 hash，
# test/deployment/edge-entrypoint.contract.test.ts 锁定两者一致）；style-src 保留
# unsafe-inline（Vue 运行时样式属内联，收紧会打碎页面）；CSP_EXTRA_ORIGINS 补
# presigned MinIO 等跨源（img/connect/media），由部署按 MINIO_PUBLIC_BASE_URL 填写。
map "${CSP_MODE}" $csp_policy_enforced {
  default        "";
  "enforce"      "default-src 'self'; script-src 'self' 'sha256-z7NAGcgbkhx4FeGd4eVzTpJrT2dB+ZFt5yZ8YSbvDVw='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: ${CSP_EXTRA_ORIGINS}; media-src 'self' blob: ${CSP_EXTRA_ORIGINS}; connect-src 'self' blob: ${CSP_EXTRA_ORIGINS}; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; report-uri /csp-report";
}
map "${CSP_MODE}" $csp_policy_report_only {
  default        "default-src 'self'; script-src 'self' 'sha256-z7NAGcgbkhx4FeGd4eVzTpJrT2dB+ZFt5yZ8YSbvDVw='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: ${CSP_EXTRA_ORIGINS}; media-src 'self' blob: ${CSP_EXTRA_ORIGINS}; connect-src 'self' blob: ${CSP_EXTRA_ORIGINS}; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; report-uri /csp-report";
  "enforce"      "";
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # 静态资源与 API 都由公网 Nginx 统一发送这组安全头。
  # add_header 有继承陷阱：任一 location 内出现 add_header 会丢弃 server 级的全部 add_header，
  # 故此处不使用 CSP 之外的 location 级 add_header（/api/ 与 /health 均未加）。
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Strict-Transport-Security $hsts_header always;
  add_header Content-Security-Policy $csp_policy_enforced always;
  add_header Content-Security-Policy-Report-Only $csp_policy_report_only always;
  add_header Cache-Control $static_cache_control;

  # 内部服务间端点永不经公网入口（GL-P0-CRED-001）。
  location = /internal {
    return 404;
  }

  location /internal/ {
    return 404;
  }

  # 历史路径：内部 bridge 曾挂在 `/api/internal/credits`。保留显式 404，
  # 防止 `/api/` 的 proxy_pass 把它重新暴露出去。
  location = /api/internal {
    return 404;
  }

  location /api/internal/ {
    return 404;
  }

  # 跨应用 origin 运行时配置（任务书 #76）：envsubst 注入部署变量，产出一行 JS。
  # 精确匹配优先于 dist 内 public/app-config.js 兜底文件；CSP script-src 'self' 放行同源外链。
  # 刻意不写 add_header（会丢弃 server 级整组安全头），Cache-Control 经 $static_cache_control map。
  location = /app-config.js {
    default_type application/javascript;
    return 200 'window.__GRASSLAND_APP_CONFIG__ = { aiAppOrigin: "${AI_APP_ORIGIN}", grasslandOrigin: "${GRASSLAND_ORIGIN}" };';
  }

  # CSP 违规上报（report-uri）：无登录态、不可信内容的单口接收器，转 edge 记日志。
  # 仅 POST；body 上限 1m（浏览器报告远小于此）；不上 CDN、不缓存。
  location = /csp-report {
    if ($request_method != POST) {
      return 405;
    }
    client_max_body_size 1m;

    proxy_pass http://${API_UPSTREAM}/api/csp-report;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto "${PUBLIC_FORWARDED_PROTO}";
    proxy_set_header Forwarded "";
    proxy_set_header X-Grassland-Identity "";
  }

  location = /api {
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Strict-Transport-Security;

    proxy_pass http://${API_UPSTREAM};
    proxy_http_version 1.1;
    client_max_body_size 32m;
    proxy_connect_timeout 30s;
    proxy_send_timeout 210s;
    proxy_read_timeout 210s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto "${PUBLIC_FORWARDED_PROTO}";
    proxy_set_header Forwarded "";
    proxy_set_header X-Grassland-Identity "";
  }

  location /api/ {
    # Java 上游可能也发同一组安全头。经 nginx 时先隐藏上游的，
    # 由 server 级 add_header 输出唯一一份，避免同名头出现两份（Referrer-Policy
    # 等取值型头出现多份时行为按实现而定）。注意：这里只能用 proxy_hide_header，
    # 若在本 location 内写 add_header，server 级的整组 add_header 会被丢弃。
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Strict-Transport-Security;

    # API 统一走 Edge BFF；不做自动 failover，避免非幂等写请求被重放。
    proxy_pass http://${API_UPSTREAM};
    proxy_http_version 1.1;
    client_max_body_size 32m;
    proxy_connect_timeout 30s;
    proxy_send_timeout 210s;
    proxy_read_timeout 210s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto "${PUBLIC_FORWARDED_PROTO}";
    # 不接收浏览器自带的 RFC 7239/internal identity 值；可信转发链只由本入口重建。
    proxy_set_header Forwarded "";
    proxy_set_header X-Grassland-Identity "";
  }

  location /health {
    proxy_pass http://${API_UPSTREAM}/health;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto "${PUBLIC_FORWARDED_PROTO}";
    proxy_set_header Forwarded "";
    proxy_set_header X-Grassland-Identity "";
  }

  # /assets/ 是 Vite 内容哈希资源：文件不存在必须 404，禁止回退 SPA 入口。
  # 回退返回 200+HTML 会让旧标签页的动态 import 拿到「假成功」，模块解析静默失败，
  # 点击导航毫无反应（2026-08-29 治理台实录）；404 才能让前端 chunk 自救
  # （src/lib/chunk-reload.ts）识别并接管。两个 server 块须同步维护。
  location ^~ /assets/ {
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

# 治理台（ops.html 双页入口的第二个 server）：独立 origin（宿主 OPS_FRONTEND_PORT，
# 默认 8083 → 容器 81），只服务运营处置与管理后台。治理代码不进公网用户端 bundle，
# 生产可对本端口施加 IP 白名单/VPN 等网络层隔离；会话与授权语义与用户端一致
# （cookie session + 后端 backend_role 门禁）。
# 注意：/api、/csp-report、/health 的转发配置与 80 端口 server 严格镜像——
# server 块之间不共享 location，改动一侧必须同步另一侧。
server {
  listen 81;
  server_name _;

  root /usr/share/nginx/html;
  index ops.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Strict-Transport-Security $hsts_header always;
  add_header Content-Security-Policy $csp_policy_enforced always;
  add_header Content-Security-Policy-Report-Only $csp_policy_report_only always;
  add_header Cache-Control $static_cache_control;

  location = /internal {
    return 404;
  }

  location /internal/ {
    return 404;
  }

  location = /api/internal {
    return 404;
  }

  location /api/internal/ {
    return 404;
  }

  location = /csp-report {
    if ($request_method != POST) {
      return 405;
    }
    client_max_body_size 1m;

    proxy_pass http://${API_UPSTREAM}/api/csp-report;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto "${PUBLIC_FORWARDED_PROTO}";
    proxy_set_header Forwarded "";
    proxy_set_header X-Grassland-Identity "";
  }

  location /api/ {
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Strict-Transport-Security;

    proxy_pass http://${API_UPSTREAM};
    proxy_http_version 1.1;
    client_max_body_size 32m;
    proxy_connect_timeout 30s;
    proxy_send_timeout 210s;
    proxy_read_timeout 210s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto "${PUBLIC_FORWARDED_PROTO}";
    proxy_set_header Forwarded "";
    proxy_set_header X-Grassland-Identity "";
  }

  location /health {
    proxy_pass http://${API_UPSTREAM}/health;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto "${PUBLIC_FORWARDED_PROTO}";
    proxy_set_header Forwarded "";
    proxy_set_header X-Grassland-Identity "";
  }

  # 与 80 端口 server 镜像：内容哈希资源缺失必须 404，禁止回退 ops.html（见上方说明）。
  location ^~ /assets/ {
    try_files $uri =404;
  }

  # 与 80 端口 server 镜像（任务书 #76：三入口一致维护）。
  location = /app-config.js {
    default_type application/javascript;
    return 200 'window.__GRASSLAND_APP_CONFIG__ = { aiAppOrigin: "${AI_APP_ORIGIN}", grasslandOrigin: "${GRASSLAND_ORIGIN}" };';
  }

  location / {
    # 治理台 SPA 回退到 ops.html（不是 index.html）。
    try_files $uri $uri/ /ops.html;
  }
}

# AI 创作中心（ai.html 三页入口的第三个 server，任务书 #76 卡 B）：独立 origin（宿主
# AI_FRONTEND_PORT，默认 8084 → 容器 82），只服务个人创作应用（无身份概念，任何注册账号
# 登录即用，游客可试用）。跨应用免登经 identity 一次性 token（?xat=… 核销建本 origin 会话）。
# 注意：/api、/csp-report、/health 的转发配置与 80/81 端口 server 严格镜像——server 块之间
# 不共享 location，改动一侧必须同步另一侧（漏镜像 assets 404 会复现「旧 chunk 静默导航失败」）。
server {
  listen 82;
  server_name _;

  root /usr/share/nginx/html;
  index ai.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Strict-Transport-Security $hsts_header always;
  add_header Content-Security-Policy $csp_policy_enforced always;
  add_header Content-Security-Policy-Report-Only $csp_policy_report_only always;
  add_header Cache-Control $static_cache_control;

  location = /internal {
    return 404;
  }

  location /internal/ {
    return 404;
  }

  location = /api/internal {
    return 404;
  }

  location /api/internal/ {
    return 404;
  }

  # 与 80 端口 server 镜像（任务书 #76：三入口一致维护）。
  location = /app-config.js {
    default_type application/javascript;
    return 200 'window.__GRASSLAND_APP_CONFIG__ = { aiAppOrigin: "${AI_APP_ORIGIN}", grasslandOrigin: "${GRASSLAND_ORIGIN}" };';
  }

  location = /csp-report {
    if ($request_method != POST) {
