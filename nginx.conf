# GL-P0-AUTH-001：HSTS 只在入口确定是 HTTPS 时发。
# 本容器监听 80（TLS 由上游 LB/ingress 终止），故按 $http_x_forwarded_proto 判定，
# 而不是按 $scheme（$scheme 在这里恒为 http，会导致 HSTS 永不发出）。
# 上游必须用 `proxy_set_header X-Forwarded-Proto $scheme` 覆盖客户端值 —— 否则该头可被伪造。
map $http_x_forwarded_proto $hsts_header {
  default        "";
  "https"        "max-age=15552000; includeSubDomains";
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # 静态资源与 API 都发这组头。API 响应由 backend 也发一份（见 lib/security-headers.ts）——
  # 直连 backend:3000 的部署没有 nginx，两处都有是有意的。
  # add_header 有继承陷阱：任一 location 内出现 add_header 会丢弃 server 级的全部 add_header，
  # 故此处不使用 CSP 之外的 location 级 add_header（/api/ 与 /health 均未加）。
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Strict-Transport-Security $hsts_header always;

  # 内部服务间端点（credits bridge 等）永不经公网入口（GL-P0-CRED-001）。
  # backend 挂载在 `/internal/`，此处显式 404——只允许容器网络内直连 backend:3000。
  location /internal/ {
    return 404;
  }

  # 历史路径：内部 bridge 曾挂在 `/api/internal/credits`。保留显式 404，
  # 防止 `/api/` 的 proxy_pass 把它重新暴露出去。
  location /api/internal/ {
    return 404;
  }

  location /api/ {
    # backend 也发同一组安全头（直连部署需要）。经 nginx 时先隐藏上游的，
    # 由 server 级 add_header 输出唯一一份，避免同名头出现两份（Referrer-Policy
    # 等取值型头出现多份时行为按实现而定）。注意：这里只能用 proxy_hide_header，
    # 若在本 location 内写 add_header，server 级的整组 add_header 会被丢弃。
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Strict-Transport-Security;

    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_connect_timeout 30s;
    proxy_send_timeout 210s;
    proxy_read_timeout 210s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    proxy_pass http://backend:3000/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

# 草场 Slice 11 Stage 3：MinIO CORS 反代。
# 浏览器 presigned PUT/OPTIONS 走此端口（宿主 9002），nginx 注入 CORS 头后转 MinIO:9000。
# MINIO_PUBLIC_BASE_URL=http://localhost:9002 → S3Presigner 签 URL host 为 localhost:9002；
# 浏览器 PUT 打到 nginx:9002 → proxy_pass minio:9000（转发原 Host 保持 SigV4 签名有效）。
# 版本无关：不依赖 putBucketCors API（MinIO latest 该端点返回 501 NotImplemented）。
server {
  listen 9002;
  server_name _;

  location / {
    # OPTIONS preflight：直接 204，不转 MinIO（MinIO 不处理无凭据 OPTIONS）。
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin $http_origin always;
      add_header Access-Control-Allow-Methods "PUT, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type" always;
      add_header Access-Control-Max-Age 3600 always;
      return 204;
    }

    proxy_pass http://minio:9000;
    proxy_http_version 1.1;
    # 转发原始 Host（如 localhost:9002），保持 SigV4 presigned 签名有效。
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # MinIO 对「实际请求」（非 preflight）会自己回 CORS 头。若此处再 add_header，
    # 响应将出现两个 Access-Control-Allow-Origin —— curl 不校验（PUT 仍 200），
    # 但浏览器判定 "contains multiple values" 直接拒绝。故先 hide 上游的，再由
    # nginx 输出唯一一份，保证 preflight 与实际响应策略一致。
    # 验证时必须数 header 条数（grep -c），只看 200 会误判为通过。
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Expose-Headers;

    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Methods "PUT, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type" always;
    add_header Access-Control-Expose-Headers "ETag" always;
  }
}
