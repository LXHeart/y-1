server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_connect_timeout 30s;
    proxy_send_timeout 210s;
    proxy_read_timeout 210s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    proxy_pass http://backend:3000/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

# 草场 Slice 11 Stage 3：MinIO CORS 反代。
# 浏览器 presigned PUT/OPTIONS 走此端口（宿主 9002），nginx 注入 CORS 头后转 MinIO:9000。
# MINIO_PUBLIC_BASE_URL=http://localhost:9002 → S3Presigner 签 URL host 为 localhost:9002；
# 浏览器 PUT 打到 nginx:9002 → proxy_pass minio:9000（转发原 Host 保持 SigV4 签名有效）。
# 版本无关：不依赖 putBucketCors API（MinIO latest 该端点返回 501 NotImplemented）。
server {
  listen 9002;
  server_name _;

  location / {
    # OPTIONS preflight：直接 204，不转 MinIO（MinIO 不处理无凭据 OPTIONS）。
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin $http_origin always;
      add_header Access-Control-Allow-Methods "PUT, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type" always;
      add_header Access-Control-Max-Age 3600 always;
      return 204;
    }

    proxy_pass http://minio:9000;
    proxy_http_version 1.1;
    # 转发原始 Host（如 localhost:9002），保持 SigV4 presigned 签名有效。
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # MinIO 对「实际请求」（非 preflight）会自己回 CORS 头。若此处再 add_header，
    # 响应将出现两个 Access-Control-Allow-Origin —— curl 不校验（PUT 仍 200），
    # 但浏览器判定 "contains multiple values" 直接拒绝。故先 hide 上游的，再由
    # nginx 输出唯一一份，保证 preflight 与实际响应策略一致。
    # 验证时必须数 header 条数（grep -c），只看 200 会误判为通过。
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Expose-Headers;

    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Methods "PUT, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type" always;
    add_header Access-Control-Expose-Headers "ETag" always;
  }
}
