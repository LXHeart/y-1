# Local-only observability dependencies. This file is intentionally separate from the
# production overlay: production applications export to an externally managed HTTPS collector.
services:
  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector:0.133.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./platform-java/deploy/observability/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:${OTEL_COLLECTOR_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTEL_COLLECTOR_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${OTEL_COLLECTOR_HEALTH_PORT:-13133}:13133"
    restart: unless-stopped
