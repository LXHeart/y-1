<!doctype html>
<html lang="zh-CN" data-app="ops">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>草场 · 治理台</title>
    <!-- 防 FOUC 内联脚本：内容与 index.html 完全一致，复用 nginx CSP script-src 已登记的
        sha256 hash（test/deployment/edge-entrypoint.contract.test.ts 锁定两者同步；改动必须同步 nginx.conf）。 -->
    <script>(function(){var t=localStorage.getItem('theme-preference')||'system';var d=t==='system'?matchMedia('(prefers-color-scheme:light)').matches:t==='light';document.documentElement.setAttribute('data-theme',d?'light':'dark');document.documentElement.style.colorScheme=d?'light':'dark'})()</script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/ops/main.ts"></script>
  </body>
</html>
