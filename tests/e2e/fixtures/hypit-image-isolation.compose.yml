# C107F2-03: one guarded project; image probes and restart run sequentially.
services:
  backend-image:
    build:
      context: ../../..
      dockerfile: deploy/hypit/Dockerfile.backend
    image: fix2-c03-hypit-backend:latest
    user: "10001:10001"
    read_only: true
    network_mode: none
    command: ["node", "-e", "${HYPIT_IMAGE_PROBE:-process.exit(1)}"]
  runner-image:
    build:
      context: ../../..
      dockerfile: deploy/hypit/Dockerfile.runner
    image: fix2-c03-hypit-runner:latest
    user: "10001:10001"
    read_only: true
    network_mode: none
    command: ["node", "-e", "${HYPIT_IMAGE_PROBE:-process.exit(1)}"]
  broker-restart:
    image: fix2-c03-hypit-backend:latest
    user: "10001:10001"
    read_only: true
    volumes:
      - "${HYPIT_RESTART_DATA_DIR:?fresh temporary data directory required}:/data"
    tmpfs:
      - /tmp:size=268435456,mode=1777
    environment:
      HYPIT_INTERNAL_TOKEN: "${HYPIT_INTERNAL_TOKEN:?temporary token required}"
      HYPIT_BACKEND_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:19241:9240"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9240/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 10s
