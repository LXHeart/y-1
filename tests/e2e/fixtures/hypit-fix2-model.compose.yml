# C107F2-37 test override. Never included by the production or daily development stack.
# 受控文本模型 fixture（G2–G5）：经 intelligence-service 网络命名空间内 loopback:19099
# 提供形状正确的 OpenAI 兼容响应；外部商业模型质量不在本卡证明范围（§12.5）。
services:
  intelligence-service:
    environment:
      AI_PLATFORM_MODEL_ALLOW_INSECURE_LOOPBACK: "true"
      AI_DNS_PINNING_TRUSTED_DOMAINS: "qwen-e2e.invalid=127.0.0.1;localhost=127.0.0.1;hypit-fix2-provider.invalid=127.0.0.1"
      AI_ROUTED_TEXT_COMPLETION_TIMEOUT_SECONDS: "60"
  hypit-fix2-text-provider:
    image: node:20-bookworm
    init: true
    read_only: true
    network_mode: service:intelligence-service
    command: ["node", "/fixture/hypit-fix2-text-provider.mjs"]
    environment:
      HYPIT_FIX2_PROVIDER_PORT: "19099"
      HYPIT_FIX2_PROVIDER_TOKEN: ${HYPIT_FIX2_PROVIDER_TOKEN:-}
    volumes:
      - ./tests/e2e/fixtures/hypit-fix2-text-provider.mjs:/fixture/hypit-fix2-text-provider.mjs:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:19099/__health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 30
