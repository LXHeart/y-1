<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>草场</title>
    <!-- 防 FOUC 内联脚本：内容必须与 nginx CSP script-src 的 sha256 hash 严格一致
        （test/deployment/edge-entrypoint.contract.test.ts 锁定两者同步；改动这里必须同步更新 nginx.conf）。 -->
    <script>(function(){var t=localStorage.getItem('theme-preference')||'system';var d=t==='system'?matchMedia('(prefers-color-scheme:light)').matches:t==='light';document.documentElement.setAttribute('data-theme',d?'light':'dark');document.documentElement.style.colorScheme=d?'light':'dark'})()</script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
