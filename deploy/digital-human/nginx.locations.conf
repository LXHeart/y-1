# 数字人同源入口片段（任务书 #105H C105H-01 / K07、K13.3）。
#
# 由主模板 nginx.conf 的 AI server(82) 以 `include /etc/nginx/dh-locations.conf;` 装配；
# Dockerfile.frontend 始终分发本文件到该固定路径——缺失 include 会让三入口全部启动失败
# （K13.3），因此片段缺省随镜像常驻，DH 未启用时只拒本片段覆盖的路径。
#
# 本文件不参与 envsubst（Dockerfile 直接 COPY），上游一律使用主模板 set 的运行期变量：
#   $dh_edge_upstream   控制面 API/SSE 上游（Edge BFF；数字人控制路径仍经 Edge，K13.3）。
#   $dh_audio_upstream  runtime 音频面上游（DH_AUDIO_UPSTREAM 注入，形如 dh-runtime:9080；
#                       缺省空 = 功能关闭，仅拒音频 WS 路径）。
# proxy_pass 使用变量 + resolver 运行期解析服务名：runtime 未配置/未启动时不得在 nginx
# 启动解析阶段把三入口拖垮（K13.3）。resolver 只认容器网络内嵌 DNS；上游值只允许部署
# 注入的 compose 服务名，禁止任何客户端可控 host 拼进上游。

# 内部通道（K07.2：runtime→Java mTLS 端点，INTERNAL05～08/11/14/15）显式拒绝经公网入口；
# 与 server 级 /internal/ 404 互为双保险，本片段自身闭合便于独立审计。
location = /internal/digital-human {
  return 404;
}

location /internal/digital-human/ {
  return 404;
}

# SSE 事件流（K07）：逐块穿透、不聚合不缓存、连接可取消；读超时需覆盖整场会话的事件订阅
# （K06 注释心跳每 20 秒一行，不能被代理缓冲成整块）。
location ~ "^/api/digital-human/sessions/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/events$" {
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;
  proxy_pass http://$dh_edge_upstream;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_buffering off;
  proxy_cache off;
  proxy_read_timeout 3600s;
  chunked_transfer_encoding on;
}

# 音频 WS（K07）：仅精确 UUID session 路径升级到 runtime 音频面（9080）；其他数字人路径
# 仍落入 /api/ 前缀经 Edge。Upgrade/Origin 精确比对与消息边界（首帧 JSON、帧序号、容量）
# 由 wrapper 承担，本层不重复实现业务校验。上游为空 = 功能关闭，只拒本路径。
location ~ "^/api/digital-human/sessions/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/audio$" {
  if ($dh_audio_upstream = "") {
    return 404;
  }
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;
  proxy_pass http://$dh_audio_upstream;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_read_timeout 120s;
  proxy_send_timeout 10s;
}
