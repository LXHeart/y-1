# 数字人 E 阶段本地测试代理（任务书 #105E C105E-06 / K13.3、K07）。
#
# 只服务本地隔离测试栈：API/SSE 反代到 edge，精确形态的音频 WS 升级到 DH runtime；
# 顶层页面响应头加载与生产 AI 入口（nginx.conf :82）相同的受验证策略——含 microphone=(self)。
# H 阶段验证生产模板（H01 装配 DH 精确 location 片段），本文件不冒充生产配置。

server {
  listen 18082;
  server_name _;

  root /usr/share/nginx/html;
  index ai.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # 与生产 AI 入口同款：仅本入口开放麦克风；camera 等仍禁。
  add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=()" always;
  add_header Cache-Control "no-store" always;

  location = /internal {
    return 404;
  }

  location ^~ /assets/ {
    try_files $uri =404;
  }

  # SSE：关缓冲/超时，保注释心跳穿透（K06：20 秒注释行不能被代理聚合）。
  location ~ ^/api/digital-human/sessions/[^/]+/events$ {
    proxy_pass http://edge-bff;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    chunked_transfer_encoding on;
  }

  # 音频 WS：精确路径升级到 wrapper 的 9080（K07：其他数字人路径仍走 Edge）。
  location ~ ^/api/digital-human/sessions/[^/]+/audio$ {
    proxy_pass http://dh-runtime:9080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;
    proxy_send_timeout 10s;
  }

  location /api/ {
    proxy_pass http://edge-bff;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /ai.html;
  }
}
