# compose.runner.yml — C107-02 (task-107) minimal runner isolation stack (K10.4).
#
# One fixed execution slot. The broker (hypit-backend) copies each command's
# input closure into the slot input volume, then connects to the runner's Unix
# socket. The runner has no network at all, a read-only root filesystem with a
# quota'd tmpfs scratch, no capabilities and no privilege escalation.
#
# Usage (local validation of the isolation topology):
#   docker compose -f deploy/hypit/compose.runner.yml up -d
services:
  hypit-backend:
    build:
      context: ../..
      dockerfile: deploy/hypit/Dockerfile.backend
    image: grassland/hypit-backend:dev
    restart: unless-stopped
    volumes:
      - hypit-data:/data
      - runner-sockets:/sockets
      - runner-slots:/slots
    environment:
      HYPIT_INTERNAL_TOKEN: "${HYPIT_INTERNAL_TOKEN:?set HYPIT_INTERNAL_TOKEN (>=32 chars)}"
      HYPIT_RUNNER_SOCKET_DIR: /sockets
      HYPIT_RUNNER_SLOT_ROOT: /slots
      # C107F2-19：Studio 代理面（默认 9464，0=关闭）+ broker/Java 共享断言密钥。
      HYPIT_STUDIO_PORT: "${HYPIT_STUDIO_PORT:-9464}"
      HYPIT_SESSION_ASSERTION_SECRET: "${HYPIT_SESSION_ASSERTION_SECRET:-}"
    ports:
      # 测试/多栈共存可覆盖宿主端口（容器内固定 9240）。
      - "127.0.0.1:${HYPIT_BROKER_HOST_PORT:-9240}:9240"
    # 无 healthcheck 时 compose --wait 只等「容器启动」；broker 的 tsx 冷启动
    # ~10s 后才监听 9240，up --wait 通过≠HTTP ready（C04 实录：up 后 fetch
    # 立刻 other side closed）。slim 基底无 curl/wget，用 node 探真实 healthz。
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch(''http://127.0.0.1:9240/healthz'').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  hypit-author-runner:
    build:
      context: ../..
      dockerfile: deploy/hypit/Dockerfile.runner
    image: grassland/hypit-runner:dev
    # K10.4 hard isolation: no network, non-root, read-only rootfs, no caps.
    network_mode: none
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      # 107-fix-2 C04（D-04）：daemon 常驻 + 动态 slot；与 broker 同挂 /sockets
      # 与 /slots（路径字符串两容器一致）。唯一共享面仍是 socket 目录 + slots
      # 卷 + runner-state（packages-only）；tmpfs 限额给 /tmp（tsx 变换缓存）。
      - runner-sockets:/sockets
      - runner-slots:/slots
      - runner-packages:/runner-state
    command:
      - node
      - --import
      - tsx
      - src/runner/daemon.mjs
      - --socket
      - /sockets/runner.sock
      - --distribution-root
      - /app/platform-hypit/.generated/hypit
      - --slot-root
      - /slots
      - --state-home
      - /runner-state
      - --tmp
      - /tmp
    tmpfs:
      - /tmp:size=268435456,mode=1777
    # 同上：daemon 的 Unix socket ready 才算健康（network:none 内用 node 连
    # socket 探测，只读根文件系统与全弃权下均可运行）。
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'require(''node:net'').connect(''/sockets/runner.sock'').on(''connect'', () => process.exit(0)).on(''error'', () => process.exit(1))'
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

volumes:
  hypit-data:
  runner-sockets:
  runner-slots:
  runner-packages:
