# compose.production.yml — 任务书 #107-3 C107-23：Hypit 生产部署 overlay。
#
# 用法（V12 门禁同款，必须三层叠加；默认不带本文件时生产栈行为与 #107 之前逐字一致）：
#   docker compose -f docker-compose.production.yml \
#                  -f deploy/hypit/compose.production.yml config
#   # 追加 -f deploy/hypit/compose.full.yml 得到完整（三 Python 环境/模型缓存）变体
#
# 门禁语义：
# - hypit-backend / hypit-author-runner 全部挂 profiles: ["hypit"]——未显式
#   `--profile hypit` 时 compose up 不创建这两个容器（默认全关）。
# - 107-fix-2 C02：本 overlay 恒属 hypit-compose.sh 固定组合（labels 修复 F01）；
#   EDGE 旗标与 HYPIT_STUDIO_UPSTREAM 默认全部 fail-closed，启用只经
#   `hypit-compose.sh --enable-hypit`（显式导出 true/hypit-backend:9240）。
# - intelligence-service 环境合并无条件生效：HYPIT_ENABLED 默认 false，
#   业务面 403/503 fail-closed（与 107-1 C03 契约一致）。
# - HYPIT_INTERNAL_TOKEN 无默认：启用 hypit profile 时必须显式提供（:? 即硬失败），
#   且绝不进入 runner 环境（K10.4：runner 唯一通道是 Unix socket 卷）。
# - 端口固定 9240（B/src/config.ts HYPIT_BACKEND_PORT 落地默认；任务书 §5.2 表
#   中的 8090 与 107-1/2 已入库实现漂移，§13.3 登记以实现为准）。
services:
  # Studio 反代上游接线（C107-23 K13.3）：基座 docker-compose.yml 的 frontend 定义
  # HYPIT_STUDIO_UPSTREAM 默认空串（空=片段一律 404，nginx -t 可过），注释约定
  # 「启用 hypit 时由本 overlay 填内部地址」。取值格式与 DH_AUDIO_UPSTREAM 同款
  # ——裸 host:port（片段侧拼 `proxy_pass http://$var`；值带 scheme 会拼成
  # http://http://… 报 invalid port，107-4 实部署暴露）。broker 容器内固定 9240。
  # 带本 overlay 但未开 --profile hypit 属误配：DNS 解析失败回 502，比静默 404
  # 更能暴露该误配。
  frontend:
    environment:
      HYPIT_STUDIO_UPSTREAM: "${HYPIT_STUDIO_UPSTREAM:-}"

  # edge 路由 flag 组（107-1 C03 fail-closed 契约：hypit 业务面路由默认全关，
  # 由 EDGE_ROUTE_HYPIT_* 名单受控启用）。本 overlay 语义=启用 hypit 的部署，
  # 故整组默认开（显式设任一变量为 false 仍可逐条收窄）。CAPABILITIES_READ
  # 在基座已默认 true，此处一并列出保持组完整。76 条与 edge application.yml
  # 的 hypit 路由一一对应（新增路由须同步）。
  edge-bff:
    environment:
      EDGE_ROUTE_HYPIT_AGENT_JOBS_CREATE: "${EDGE_ROUTE_HYPIT_AGENT_JOBS_CREATE:-false}"
      EDGE_ROUTE_HYPIT_AGENT_JOBS_LIST: "${EDGE_ROUTE_HYPIT_AGENT_JOBS_LIST:-false}"
      EDGE_ROUTE_HYPIT_ASSETS_CONTENT: "${EDGE_ROUTE_HYPIT_ASSETS_CONTENT:-false}"
      EDGE_ROUTE_HYPIT_ASSETS_CREATE: "${EDGE_ROUTE_HYPIT_ASSETS_CREATE:-false}"
      EDGE_ROUTE_HYPIT_ASSETS_UPLOAD: "${EDGE_ROUTE_HYPIT_ASSETS_UPLOAD:-false}"
      EDGE_ROUTE_HYPIT_ASSETS_DELETE: "${EDGE_ROUTE_HYPIT_ASSETS_DELETE:-false}"
      EDGE_ROUTE_HYPIT_ASSETS_GET: "${EDGE_ROUTE_HYPIT_ASSETS_GET:-false}"
      EDGE_ROUTE_HYPIT_ASSETS_IMPORT_URL: "${EDGE_ROUTE_HYPIT_ASSETS_IMPORT_URL:-false}"
      EDGE_ROUTE_HYPIT_ASSETS_IMPORT_SOURCE: "${EDGE_ROUTE_HYPIT_ASSETS_IMPORT_SOURCE:-false}"
      EDGE_ROUTE_HYPIT_ASSETS_LIST: "${EDGE_ROUTE_HYPIT_ASSETS_LIST:-false}"
      EDGE_ROUTE_HYPIT_BUILDS_CANCEL: "${EDGE_ROUTE_HYPIT_BUILDS_CANCEL:-false}"
      EDGE_ROUTE_HYPIT_BUILDS_CREATE: "${EDGE_ROUTE_HYPIT_BUILDS_CREATE:-false}"
      EDGE_ROUTE_HYPIT_BUILDS_EVENTS: "${EDGE_ROUTE_HYPIT_BUILDS_EVENTS:-false}"
      EDGE_ROUTE_HYPIT_BUILDS_GET: "${EDGE_ROUTE_HYPIT_BUILDS_GET:-false}"
      EDGE_ROUTE_HYPIT_BUILDS_LIST: "${EDGE_ROUTE_HYPIT_BUILDS_LIST:-false}"
      EDGE_ROUTE_HYPIT_BUILDS_LOGS: "${EDGE_ROUTE_HYPIT_BUILDS_LOGS:-false}"
      EDGE_ROUTE_HYPIT_BUILD_CHECK: "${EDGE_ROUTE_HYPIT_BUILD_CHECK:-false}"
      EDGE_ROUTE_HYPIT_BUILD_PLAN: "${EDGE_ROUTE_HYPIT_BUILD_PLAN:-false}"
      EDGE_ROUTE_HYPIT_BUILD_PRICING: "${EDGE_ROUTE_HYPIT_BUILD_PRICING:-false}"
      EDGE_ROUTE_HYPIT_CAPABILITIES_READ: "${EDGE_ROUTE_HYPIT_CAPABILITIES_READ:-false}"
      EDGE_ROUTE_HYPIT_CHANGESETS_APPLY: "${EDGE_ROUTE_HYPIT_CHANGESETS_APPLY:-false}"
      EDGE_ROUTE_HYPIT_CHANGESETS_CREATE: "${EDGE_ROUTE_HYPIT_CHANGESETS_CREATE:-false}"
      EDGE_ROUTE_HYPIT_CLONE_PLAN_GET: "${EDGE_ROUTE_HYPIT_CLONE_PLAN_GET:-false}"
      EDGE_ROUTE_HYPIT_CLONE_PLAN_PUT: "${EDGE_ROUTE_HYPIT_CLONE_PLAN_PUT:-false}"
      EDGE_ROUTE_HYPIT_CREDENTIALS_DELETE: "${EDGE_ROUTE_HYPIT_CREDENTIALS_DELETE:-false}"
      EDGE_ROUTE_HYPIT_CREDENTIALS_FLOW_COMPLETE: "${EDGE_ROUTE_HYPIT_CREDENTIALS_FLOW_COMPLETE:-false}"
      EDGE_ROUTE_HYPIT_CREDENTIALS_FLOW_CREATE: "${EDGE_ROUTE_HYPIT_CREDENTIALS_FLOW_CREATE:-false}"
      EDGE_ROUTE_HYPIT_CREDENTIALS_FLOW_DELETE: "${EDGE_ROUTE_HYPIT_CREDENTIALS_FLOW_DELETE:-false}"
      EDGE_ROUTE_HYPIT_CREDENTIALS_FLOW_GET: "${EDGE_ROUTE_HYPIT_CREDENTIALS_FLOW_GET:-false}"
      EDGE_ROUTE_HYPIT_CREDENTIALS_GET: "${EDGE_ROUTE_HYPIT_CREDENTIALS_GET:-false}"
      EDGE_ROUTE_HYPIT_CREDENTIALS_PUT: "${EDGE_ROUTE_HYPIT_CREDENTIALS_PUT:-false}"
      EDGE_ROUTE_HYPIT_FEEDBACK_LIST: "${EDGE_ROUTE_HYPIT_FEEDBACK_LIST:-false}"
      EDGE_ROUTE_HYPIT_FEEDBACK_MUTATE: "${EDGE_ROUTE_HYPIT_FEEDBACK_MUTATE:-false}"
      EDGE_ROUTE_HYPIT_FILES_GET: "${EDGE_ROUTE_HYPIT_FILES_GET:-false}"
      EDGE_ROUTE_HYPIT_FILES_LIST: "${EDGE_ROUTE_HYPIT_FILES_LIST:-false}"
      EDGE_ROUTE_HYPIT_GRANTS_CREATE: "${EDGE_ROUTE_HYPIT_GRANTS_CREATE:-false}"
      EDGE_ROUTE_HYPIT_JOBS_ACTIONS: "${EDGE_ROUTE_HYPIT_JOBS_ACTIONS:-false}"
      EDGE_ROUTE_HYPIT_JOBS_ACTIONS_PROJECT: "${EDGE_ROUTE_HYPIT_JOBS_ACTIONS_PROJECT:-false}"
      EDGE_ROUTE_HYPIT_JOBS_ACTION_SUBMIT: "${EDGE_ROUTE_HYPIT_JOBS_ACTION_SUBMIT:-false}"
      EDGE_ROUTE_HYPIT_JOBS_ACTION_SUBMIT_PROJECT: "${EDGE_ROUTE_HYPIT_JOBS_ACTION_SUBMIT_PROJECT:-false}"
      EDGE_ROUTE_HYPIT_JOBS_EVENTS: "${EDGE_ROUTE_HYPIT_JOBS_EVENTS:-false}"
      EDGE_ROUTE_HYPIT_JOBS_EVENTS_PROJECT: "${EDGE_ROUTE_HYPIT_JOBS_EVENTS_PROJECT:-false}"
      EDGE_ROUTE_HYPIT_JOBS_GET: "${EDGE_ROUTE_HYPIT_JOBS_GET:-false}"
      EDGE_ROUTE_HYPIT_JOBS_GET_PROJECT: "${EDGE_ROUTE_HYPIT_JOBS_GET_PROJECT:-false}"
      EDGE_ROUTE_HYPIT_KNOWLEDGE_LIST: "${EDGE_ROUTE_HYPIT_KNOWLEDGE_LIST:-false}"
      EDGE_ROUTE_HYPIT_KNOWLEDGE_VOCABULARY: "${EDGE_ROUTE_HYPIT_KNOWLEDGE_VOCABULARY:-false}"
      EDGE_ROUTE_HYPIT_PACKAGES_EXPORT: "${EDGE_ROUTE_HYPIT_PACKAGES_EXPORT:-false}"
      EDGE_ROUTE_HYPIT_PACKAGES_IMPORT: "${EDGE_ROUTE_HYPIT_PACKAGES_IMPORT:-false}"
      EDGE_ROUTE_HYPIT_PACKAGES_RUNTIME_INSTALL: "${EDGE_ROUTE_HYPIT_PACKAGES_RUNTIME_INSTALL:-false}"
      EDGE_ROUTE_HYPIT_PACKAGES_RUNTIME_LIST: "${EDGE_ROUTE_HYPIT_PACKAGES_RUNTIME_LIST:-false}"
      EDGE_ROUTE_HYPIT_PROJECTS_CREATE: "${EDGE_ROUTE_HYPIT_PROJECTS_CREATE:-false}"
      EDGE_ROUTE_HYPIT_PROJECTS_DELETE: "${EDGE_ROUTE_HYPIT_PROJECTS_DELETE:-false}"
      EDGE_ROUTE_HYPIT_PROJECTS_GET: "${EDGE_ROUTE_HYPIT_PROJECTS_GET:-false}"
      EDGE_ROUTE_HYPIT_PROJECTS_LIST: "${EDGE_ROUTE_HYPIT_PROJECTS_LIST:-false}"
      EDGE_ROUTE_HYPIT_PROJECTS_PATCH: "${EDGE_ROUTE_HYPIT_PROJECTS_PATCH:-false}"
      EDGE_ROUTE_HYPIT_RESULTS_ACTION: "${EDGE_ROUTE_HYPIT_RESULTS_ACTION:-false}"
      EDGE_ROUTE_HYPIT_RESULTS_ARCHIVE: "${EDGE_ROUTE_HYPIT_RESULTS_ARCHIVE:-false}"
      EDGE_ROUTE_HYPIT_RESULTS_HISTORY: "${EDGE_ROUTE_HYPIT_RESULTS_HISTORY:-false}"
      EDGE_ROUTE_HYPIT_RESULTS_OUTPUT: "${EDGE_ROUTE_HYPIT_RESULTS_OUTPUT:-false}"
      EDGE_ROUTE_HYPIT_RESULTS_OUTPUTS: "${EDGE_ROUTE_HYPIT_RESULTS_OUTPUTS:-false}"
      EDGE_ROUTE_HYPIT_RESULTS_PRESENTATION: "${EDGE_ROUTE_HYPIT_RESULTS_PRESENTATION:-false}"
      EDGE_ROUTE_HYPIT_RESULTS_REUSE: "${EDGE_ROUTE_HYPIT_RESULTS_REUSE:-false}"
      EDGE_ROUTE_HYPIT_RUNTIME_ACTION: "${EDGE_ROUTE_HYPIT_RUNTIME_ACTION:-false}"
      EDGE_ROUTE_HYPIT_RUNTIME_ACTIVITY: "${EDGE_ROUTE_HYPIT_RUNTIME_ACTIVITY:-false}"
      EDGE_ROUTE_HYPIT_RUNTIME_GET: "${EDGE_ROUTE_HYPIT_RUNTIME_GET:-false}"
      EDGE_ROUTE_HYPIT_RUNTIME_LOGS: "${EDGE_ROUTE_HYPIT_RUNTIME_LOGS:-false}"
      EDGE_ROUTE_HYPIT_RUNTIME_PATHS: "${EDGE_ROUTE_HYPIT_RUNTIME_PATHS:-false}"
      EDGE_ROUTE_HYPIT_RUNTIME_PROFILE_GET: "${EDGE_ROUTE_HYPIT_RUNTIME_PROFILE_GET:-false}"
      EDGE_ROUTE_HYPIT_RUNTIME_PROFILE_PUT: "${EDGE_ROUTE_HYPIT_RUNTIME_PROFILE_PUT:-false}"
      EDGE_ROUTE_HYPIT_RUNTIME_PROGRAMS: "${EDGE_ROUTE_HYPIT_RUNTIME_PROGRAMS:-false}"
      EDGE_ROUTE_HYPIT_SESSIONS_PREVIEW: "${EDGE_ROUTE_HYPIT_SESSIONS_PREVIEW:-false}"
      EDGE_ROUTE_HYPIT_SESSIONS_STUDIO: "${EDGE_ROUTE_HYPIT_SESSIONS_STUDIO:-false}"
      EDGE_ROUTE_HYPIT_SESSIONS_ACCESS: "${EDGE_ROUTE_HYPIT_SESSIONS_ACCESS:-false}"
      EDGE_ROUTE_HYPIT_TEMPLATES_GET: "${EDGE_ROUTE_HYPIT_TEMPLATES_GET:-false}"
      EDGE_ROUTE_HYPIT_TEMPLATES_LIST: "${EDGE_ROUTE_HYPIT_TEMPLATES_LIST:-false}"
      EDGE_ROUTE_HYPIT_TOOLS_INVOKE: "${EDGE_ROUTE_HYPIT_TOOLS_INVOKE:-false}"
      EDGE_ROUTE_HYPIT_VARIANTS_BUILD: "${EDGE_ROUTE_HYPIT_VARIANTS_BUILD:-false}"
      EDGE_ROUTE_HYPIT_VARIANTS_RETRY: "${EDGE_ROUTE_HYPIT_VARIANTS_RETRY:-false}"
      EDGE_ROUTE_HYPIT_VARIANTS_CANCEL: "${EDGE_ROUTE_HYPIT_VARIANTS_CANCEL:-false}"

      EDGE_ROUTE_HYPIT_EXPORTS_STATUS: "${EDGE_ROUTE_HYPIT_EXPORTS_STATUS:-false}"

      EDGE_ROUTE_HYPIT_EXPORTS_DOWNLOAD: "${EDGE_ROUTE_HYPIT_EXPORTS_DOWNLOAD:-false}"
      EDGE_ROUTE_HYPIT_VARIANTS_CREATE: "${EDGE_ROUTE_HYPIT_VARIANTS_CREATE:-false}"
      EDGE_ROUTE_HYPIT_VARIANTS_LIST: "${EDGE_ROUTE_HYPIT_VARIANTS_LIST:-false}"
  intelligence-service:
    environment:
      HYPIT_ENABLED: "${HYPIT_ENABLED:-false}"
      # 容器内部固定地址；intelligence 只做 HTTP 客户端，不改端口语义。
      HYPIT_SIDECAR_BASE_URL: "${HYPIT_SIDECAR_BASE_URL:-http://hypit-backend:9240}"
      # 启用 hypit 时必填；disabled 时允许占位空串占位（Java 侧不读取）。
      HYPIT_INTERNAL_TOKEN: "${HYPIT_INTERNAL_TOKEN:-}"
      HYPIT_OPERATOR_ACCOUNT_IDS: "${HYPIT_OPERATOR_ACCOUNT_IDS:-}"
      HYPIT_MAX_UPLOAD_BYTES: "${HYPIT_MAX_UPLOAD_BYTES:-524288000}"
      HYPIT_MAX_PROJECT_ARCHIVE_BYTES: "${HYPIT_MAX_PROJECT_ARCHIVE_BYTES:-1073741824}"
      HYPIT_MAX_PROJECT_EXPANDED_BYTES: "${HYPIT_MAX_PROJECT_EXPANDED_BYTES:-4294967296}"
      HYPIT_PREVIEW_TTL_SECONDS: "${HYPIT_PREVIEW_TTL_SECONDS:-1800}"
      # C107F2-19：会话票据签名（ticket|）与代理断言签名（assertion|），与 broker 共享后者。
      HYPIT_SESSION_TICKET_SECRET: "${HYPIT_SESSION_TICKET_SECRET:-}"
      HYPIT_SESSION_ASSERTION_SECRET: "${HYPIT_SESSION_ASSERTION_SECRET:-}"

  hypit-backend:
    profiles: ["hypit"]
    build:
      context: .
      dockerfile: deploy/hypit/Dockerfile.backend
    image: ${HYPIT_BACKEND_IMAGE:-grassland/hypit-backend:latest}
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=268435456,mode=1777
    volumes:
      # 107-4 C09：状态伞 /data 整体挂卷——broker 是 read_only rootfs，数据根的
      # 兄弟目录（projects/resources/runner-state/runner-tmp，由 dataRoot/../ 推导）
      # 必须落在可写卷内；只挂 /data/hypit 时运行时 mkdir 被 EROFS 拒绝。
      - hypit-data:/data
      - runner-sockets:/sockets
      - runner-slots:/slots
    environment:
      HYPIT_BACKEND_HOST: 0.0.0.0
      HYPIT_BACKEND_PORT: 9240
      HYPIT_INTERNAL_TOKEN: "${HYPIT_INTERNAL_TOKEN:?set HYPIT_INTERNAL_TOKEN (>=32 chars) when HYPIT profile enabled}"
      HYPIT_DATA_ROOT: /data/hypit
      HYPIT_HOST_STATE_ROOT: /data/hypit/host
      HYPIT_STUDIO_MAX_SESSIONS: "${HYPIT_STUDIO_MAX_SESSIONS:-2}"
      HYPIT_STUDIO_IDLE_SECONDS: "${HYPIT_STUDIO_IDLE_SECONDS:-1800}"
      HYPIT_STUDIO_TTL_SECONDS: "${HYPIT_STUDIO_TTL_SECONDS:-28800}"
      HYPIT_RUNNER_SOCKET_DIR: /sockets
      HYPIT_RUNNER_SLOT_ROOT: /slots
      # C107F2-07：授权桥 broker→Java /internal/hypit/executions。
      HYPIT_JAVA_INTERNAL_URL: "${HYPIT_JAVA_INTERNAL_URL:-http://intelligence-service:8086}"
      # F04（C02/C03）：生产无默认值；启用时必须显式提供 ≥32 字符，
      # hypit-compose.sh --enable-hypit 预检强制（缺项/过短不执行任何 docker 变更）。
      HYPIT_STUDIO_TICKET_SECRET: "${HYPIT_STUDIO_TICKET_SECRET:-}"
      # C107F2-19：Studio 代理面端口（0=关闭）与 broker/Java 共享断言密钥（≥32 字符）。
      HYPIT_STUDIO_PORT: "${HYPIT_STUDIO_PORT:-9464}"
      HYPIT_SESSION_ASSERTION_SECRET: "${HYPIT_SESSION_ASSERTION_SECRET:-}"
    healthcheck:
      # 只读健康检查（read）：不触发安装/下载/准备。
      # 107-4 C09 实跑勘误：broker 实现的只读健康端点是 /healthz（/health 落到
      # 鉴权闸返回 401 → 容器永判 unhealthy）。以实现为准（D-01 先例）。
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9240/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      - intelligence-service

  hypit-author-runner:
    profiles: ["hypit"]
    build:
      context: .
      dockerfile: deploy/hypit/Dockerfile.runner
    image: ${HYPIT_RUNNER_IMAGE:-grassland/hypit-runner:latest}
    restart: unless-stopped
    # K10.4 硬隔离：无网络、非 root、只读根、全弃权、no-new-privileges。
    # 唯一共享面 = socket 目录 + 本槽卷；不挂 Docker socket/宿主 home/数据库。
    network_mode: none
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      # 107-fix-2 C04（D-04）：slot 动态分配——broker 与 runner 挂同一 slots
      # 卷于同一路径 /slots（payload 路径字符串两容器一致）；输入只读由
      # daemon 侧 permission flags 收敛（不给整个项目树权限）。
      - runner-sockets:/sockets
      - runner-slots:/slots
      - runner-packages:/runner-state
    # K10.4：daemon/一次性子进程的配置只走 argv，绝不走 env（作者代码不得从
    # process.env 发现槽位/宿主路径）。G 已在镜像构建期烘焙。
    command:
      - node
      - --import
      - tsx
      - src/runner/daemon.mjs
      - --socket
      - /sockets/runner.sock
      - --distribution-root
      - /app/platform-hypit/.generated/hypit
      - --slot-root
      - /slots
      - --state-home
      - /runner-state
      - --tmp
      - /tmp
    tmpfs:
      - /tmp:size=268435456,mode=1777

volumes:
  hypit-data:
  runner-sockets:
  runner-slots:
  runner-packages:
