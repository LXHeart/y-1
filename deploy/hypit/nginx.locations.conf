# deploy/hypit/nginx.locations.conf — 任务书 #107-3 C107-23（K13.3；C02/C12 首建；
# 107-fix-2 C107F2-19 接入 auth_request 票据核销与断言注入）。
# Hypit Studio 会话精确入口：AI server（82）专用 include，由 Dockerfile.frontend
# 随镜像常驻分发；部署侧不得复制成第二份。
#
# 上游约定：server 块以 `set $hypit_studio_upstream "${HYPIT_STUDIO_UPSTREAM}";`
# 声明运行期变量（镜像 ENV 兜底空串）。变量代理保证「禁用时无上游仍 nginx -t 通过」；
# 片段对空上游一律 404（禁用≠入口宕机，不因未启动 Studio 的域名拖垮任何入口）。
# Studio 会话挂载在 /studio/<sessionId>/ 下（子进程 vite base 挂载，代理转发完整
# 路径）；WS 同源升级；写回面在 broker 桥被拦截走 Java changeset。
#
# C107F2-19 鉴权链：每个 /studio/<sid>/ 请求先经 auth_request 子请求打到 Edge
# （复用 server 块既有的 $dh_edge_upstream，即 ${API_UPSTREAM}——Edge 注入站内
# 身份后转 intelligence 的 GET /api/hypit/sessions/{sid}/access：owner/active/
# expiry 校验 + 一次性票据核销），断言经 auth_request_set 注入 broker 代理头。

location = /studio {
    return 404;
}

location = /_hypit_session_access {
    # auth_request 内部子请求（§6.9 API-10）：sid 取自主 location 命名捕获
    # （子请求与主请求共享变量表），ticket 随原始查询串透传；正文不转发。
    # C107F2-37 修复：路由契约是路径参 /api/hypit/sessions/{sid}/access——
    # 旧写法 ?sid= 是扁平别名，Edge 路由表 exact 匹配 404，auth_request 把
    # 非 401/403 的 404 升级成 500，Studio 文档永远打不开。
    internal;
    proxy_pass http://$dh_edge_upstream/api/hypit/sessions/$studio_session/access?$args;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
}

location ~ ^/studio/(?<studio_session>[A-Za-z0-9\-]+)/ {
    # 禁用守卫：上游变量为空 → 明确 404（不反代到字面量主机名，不拒启动）。
    if ($hypit_studio_upstream = "") {
        return 404;
    }
    # 会话鉴权：站内身份 + owner/active/expiry + 票据一次性核销都在 Java
    # （/_hypit_session_access），30 秒断言注入下游 broker；失败 401/403 原样透出。
    auth_request /_hypit_session_access;
    auth_request_set $hypit_session_assertion $upstream_http_x_hypit_session_assertion;
    # 同源写保护：非同源 Origin 直接拒绝（C107-12 TC107-12-02）。nginx 的 if
    # 不可嵌套（107-4 实部署暴露：嵌套 if 令 nginx -t emerg 拒启动）——用
    # 「标记+顺序改写」等价实现：空 Origin 放行（由上游 0002 桥校验），非空
    # 则必须命中 https/http 同源之一，否则 403。
    # 比对用 $http_host（含端口的原始 Host 头）而非 $host（$host 不含端口：
    # 非标准端口部署下浏览器 Origin 恒带端口，用 $host 比对同源也被误杀 403，
    # 107-4 实部署暴露；标准端口下两者取值一致，行为不变）。
    set $origin_ok 1;
    if ($http_origin != "") {
        set $origin_ok 0;
    }
    if ($http_origin = "https://$http_host") {
        set $origin_ok 1;
    }
    if ($http_origin = "http://$http_host") {
        set $origin_ok 1;
    }
    if ($origin_ok = 0) {
        return 403;
    }
    # 变量上游须运行期解析 DNS（107-4 实部署暴露：无 resolver 时变量代理一律
    # 500「no resolver defined」，请求到不了上游）——Docker 内嵌 DNS，与 DH 音频
    # location 同款。
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    # C107F2-21：ticket 查询串（一次性核销）禁入访问日志——专用 $uri 格式（无 query）。
    access_log /var/log/nginx/access.log hypit_studio;
    proxy_pass http://$hypit_studio_upstream;
    proxy_http_version 1.1;
    # C107F2-37：Host 必须带端口（$http_host）。$host 丢端口后，broker 的
    # assertProxyOrigin 拿 origin.host=host:port 比对无端口 Host 恒不匹配，
    # Studio 模块脚本（浏览器会带 Origin 头）一律 400，iframe body 永不显示。
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 断言只来自 auth_request 子请求（auth_request_set 变量）；proxy_set_header 无条件
    # 覆盖出站头——客户端伪造的同名 X-Hypit-Session-Assertion 在此被丢弃。
    proxy_set_header X-Hypit-Session-Assertion $hypit_session_assertion;
    # WS 升级（Studio 快照/事件通道）
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
}

# 引擎内部资源端点不对公网开放（内部 token 端点仅 sidecar 本地监听）。
location = /hypit-internal {
    return 404;
}

location /hypit-internal/ {
    return 404;
}
