# deploy/hypit/nginx.locations.conf — 任务书 #107-3 C107-23（K13.3；C02/C12 首建）。
# Hypit Studio 会话精确入口：AI server（82）专用 include，由 Dockerfile.frontend
# 随镜像常驻分发；部署侧不得复制成第二份。
#
# 上游约定：server 块以 `set $hypit_studio_upstream "${HYPIT_STUDIO_UPSTREAM}";`
# 声明运行期变量（镜像 ENV 兜底空串）。变量代理保证「禁用时无上游仍 nginx -t 通过」；
# 片段对空上游一律 404（禁用≠入口宕机，不因未启动 Studio 的域名拖垮任何入口）。
# Studio 会话挂载在 /studio/<sessionId>/ 下（0001 补丁使上游对前缀无感）；
# WS 同源升级只放行 /__studio/ws；写回面仅 PUT/POST 且 Origin 由 0002 桥校验。

location = /studio {
    return 404;
}

location ~ ^/studio/(?<studio_session>[A-Za-z0-9\-]+)/ {
    # 禁用守卫：上游变量为空 → 明确 404（不反代到字面量主机名，不拒启动）。
    if ($hypit_studio_upstream = "") {
        return 404;
    }
    # 同源写保护：非同源 Origin 直接拒绝（C107-12 TC107-12-02）。
    if ($http_origin != "") {
        set $origin_allowed 0;
        if ($http_origin = "https://$host") { set $origin_allowed 1; }
        if ($http_origin = "http://$host") { set $origin_allowed 1; }
        if ($origin_allowed = 0) { return 403; }
    }
    proxy_pass http://$hypit_studio_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # WS 升级（Studio 快照/事件通道）
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
}

# 引擎内部资源端点不对公网开放（内部 token 端点仅 sidecar 本地监听）。
location = /hypit-internal {
    return 404;
}

location /hypit-internal/ {
    return 404;
}
