name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node typecheck, unit tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run security:secrets
      - run: npm run docs:status
      - run: ./scripts/validate-released-migrations.sh
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run coverage:changed
        env:
          COVERAGE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHANGED_COVERAGE_THRESHOLD: '80'
      - run: npm run build
      - name: Upload Node coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  java:
    name: Java full tests and boot jars
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # fetch-depth: 0——spotless ratchetFrom 需要 origin/main ref 可解析
      #（浅克隆下 ref 缺失会退化为全量检查，1400+ 存量文件被误判为需格式化）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      # 视频 IT 的 AudioDurationProbe/MediaProcessRunner 起真实 ffprobe/ffmpeg 子进程；
      # 生产 intelligence 镜像 apk add ffmpeg，runner 基镜像不带——不装则视频管线 IT
      # 全数 compose_failed（语音音频时长探测不可用）。
      - name: Install ffmpeg for video pipeline ITs
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # 排障探针（视频 IT compose_failed 定位中）：runner 上原样复刻 renderFinal 的
      # concat+subtitles 命令。IT 转绿后可移除。
      - name: Probe ffmpeg compose chain on runner
        working-directory: /tmp
        run: |
          which -a ffmpeg || true
          ffmpeg -version | head -1
          echo "locale=$(locale 2>/dev/null | head -2 | tr '\n' ' ')"
          mkdir -p probe/fonts && cd probe
          ffmpeg -y -f lavfi -i testsrc2=size=540x960:rate=30:duration=2 -f lavfi -i "sine=frequency=440:duration=2" -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -ar 48000 -ac 2 -shortest take.mp4 > /dev/null 2>&1
          ffmpeg -y -i take.mp4 -f lavfi -t 6 -i anullsrc=r=48000:cl=stereo -filter_complex "[0:v]scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2,fps=30,setsar=1[v0];[v0]tpad=stop_mode=clone:stop_duration=3.0[v1];[v1]trim=duration=5.0,setpts=PTS-STARTPTS[v];[1:a]apad,atrim=duration=5.0,asetpts=PTS-STARTPTS[a]" -map "[v]" -map "[a]" -c:v libx264 -preset veryfast -pix_fmt yuv420p -r 30 -c:a aac -ar 48000 -ac 2 -t 5.0 seg.mp4 2> segerr.txt
          echo "seg_exit=$?"; tail -2 segerr.txt
          printf "file 'seg.mp4'\n" > list.txt
          printf "1\n00:00:00,000 --> 00:00:05,000\n旁白\n\n" > subs.srt
          cp "$GITHUB_WORKSPACE/platform-java/services/intelligence-service/src/main/resources/fonts/Inter-Regular.ttf" fonts/
          ffmpeg -y -f concat -safe 0 -i list.txt -filter_complex "[0:v]subtitles=subs.srt:fontsdir=fonts:force_style='FontName=Inter,FontSize=13,PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,BorderStyle=1,Outline=2,Shadow=0,MarginV=60'[vout];[0:a]anull[aout]" -map "[vout]" -map "[aout]" -c:v libx264 -preset veryfast -pix_fmt yuv420p -r 30 -c:a aac -ar 48000 -ac 2 -movflags +faststart master.mp4 2> finalerr.txt
          echo "final_exit=$?"; tail -4 finalerr.txt
      - name: Java format gate (ratcheted to origin/main)
        working-directory: platform-java
        run: ./gradlew spotlessCheck
      - name: Run all Gradle tests and package every service
        working-directory: platform-java
        run: >-
          ./gradlew test
          :services:database-bootstrap:bootJar
          :services:release-migrator:bootJar
          :services:edge-bff:bootJar
          :services:identity-service:bootJar
          :services:marketplace-service:bootJar
          :services:finance-service:bootJar
          :services:trust-service:bootJar
          :services:intelligence-service:bootJar
          --no-daemon --console=plain
      - name: Upload service jars for the Docker E2E job
        uses: actions/upload-artifact@v4
        with:
          name: java-service-jars
          path: platform-java/services/*/build/libs/*.jar
          if-no-files-found: error

  e2e:
    name: Docker Edge public-entry E2E
    needs: [node, java]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Verify Docker builder
        run: |
          docker version
          docker buildx inspect --bootstrap
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - run: npm ci
      - name: Install browser matrix for Playwright
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Restore packaged Java services
        uses: actions/download-artifact@v4
        with:
          name: java-service-jars
          path: platform-java/services
      - name: Run isolated Compose E2E through the public Nginx port
        env:
          CI: 'true'
          COMPOSE_PROJECT_NAME: grassland-ci-${{ github.run_id }}
          SKIP_JAVA_BUILD: '1'
        run: npm run e2e:ci
      - name: Upload browser and Compose diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-${{ github.run_id }}
          path: |
            playwright-report/
            test-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  image-security:
    name: Image vulnerability scan and SBOM
    needs: [node, java]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Verify Docker builder
        run: |
          docker version
          docker buildx inspect --bootstrap
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Restore packaged Java services
        uses: actions/download-artifact@v4
        with:
          name: java-service-jars
          path: platform-java/services
      - name: Build, scan, and generate SPDX SBOMs for application images
        run: scripts/ci-image-security.sh
      - name: Validate image security evidence
        run: scripts/validate-image-security-evidence.sh
      - name: Upload image security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-security-${{ github.run_id }}
          path: test-artifacts/image-security/
          if-no-files-found: warn
          retention-days: 30
