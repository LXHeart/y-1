name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      # 任务书 #105H C105H-02：数字人 Fake 全量矩阵显式 opt-in（四 spec×三引擎，与既有
      # 门禁并列；不勾选时 job 输出显式 skip 说明——不静默漏跑，也不拖慢常规流水线）。
      dh-fake:
        description: 'Run the opt-in digital-human Fake e2e matrix (4 specs x 3 engines)'
        type: boolean
        default: false
      # 任务书 #107-3 C107-24：Hypit 三层 opt-in（local-e2e / full-local / live）。
      # 未勾选时对应 job 显式输出 skip 说明——不静默漏跑，也不拖慢常规流水线。
      hypit-e2e:
        description: 'Run the Hypit local e2e stack (4 hypit specs x 3 engines, real Node broker)'
        type: boolean
        default: false
      hypit-full:
        description: 'Run the Hypit full-local validation (image builds, minimal renders, backup/restore drill)'
        type: boolean
        default: false
      hypit-live:
        description: 'Run the Hypit live validation (requires HYPIT_LIVE_* secrets and budget; never on fork PRs)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node typecheck, unit tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # 任务书 #104 C104-06（W05/D05）：quality:lifecycle 的 Java 事件清单扫描器需要
      # JDK（编译器树 API）；沿用同仓 Gradle 侧已用 setup-java 配置，不为规则引入新依赖。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: npm ci
      - run: npm run security:secrets
      - run: npm run docs:status
      # 任务书 #103 C103-19（V12）：资源/事件生命周期接入门禁——新增持久资源/事件漏登记在此失败
      - run: npm run quality:lifecycle
      - run: ./scripts/validate-released-migrations.sh
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run coverage:changed
        env:
          COVERAGE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHANGED_COVERAGE_THRESHOLD: '80'
      - run: npm run build
      - name: Upload Node coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  java:
    name: Java full tests and boot jars
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # fetch-depth: 0——spotless ratchetFrom 需要 origin/main ref 可解析
      #（浅克隆下 ref 缺失会退化为全量检查，1400+ 存量文件被误判为需格式化）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      # 视频 IT 的 AudioDurationProbe/MediaProcessRunner 起真实 ffprobe/ffmpeg 子进程；
      # 生产 intelligence 镜像 apk add ffmpeg，runner 基镜像不带——不装则视频管线 IT
      # 全数 compose_failed（语音音频时长探测不可用）。
      - name: Install ffmpeg for video pipeline ITs
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Java format gate (ratcheted to origin/main)
        working-directory: platform-java
        run: ./gradlew spotlessCheck
      - name: Run all Gradle tests, coverage gates, and package every service
        working-directory: platform-java
        run: >-
          ./gradlew test jacocoTestCoverageVerification
          :services:database-bootstrap:bootJar
          :services:release-migrator:bootJar
          :services:edge-bff:bootJar
          :services:identity-service:bootJar
          :services:marketplace-service:bootJar
          :services:finance-service:bootJar
          :services:trust-service:bootJar
          :services:intelligence-service:bootJar
          --no-daemon --console=plain
      - name: Upload service jars for the Docker E2E job
        uses: actions/upload-artifact@v4
        with:
          name: java-service-jars
          path: platform-java/services/*/build/libs/*.jar
          if-no-files-found: error

  e2e:
    name: Docker Edge public-entry E2E
    needs: [node, java]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Verify Docker builder
        run: |
          docker version
          docker buildx inspect --bootstrap
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - run: npm ci
      - name: Install browser matrix for Playwright
        run: npx playwright install --with-deps chromium firefox webkit
      # video-canvas e2e 的 renderOwnMediaMp4 在 runner 宿主侧 spawn ffmpeg 产真 MP4
      # 再走三步上传；runner 基镜像不带 ffmpeg——不装则该链 spawn ENOENT。
      - name: Install ffmpeg for host-side media fixtures
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Restore packaged Java services
        uses: actions/download-artifact@v4
        with:
          name: java-service-jars
          path: platform-java/services
      - name: Run isolated Compose E2E through the public Nginx port
        env:
          CI: 'true'
          COMPOSE_PROJECT_NAME: grassland-ci-${{ github.run_id }}
          SKIP_JAVA_BUILD: '1'
        run: npm run e2e:ci
      - name: Upload browser and Compose diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-${{ github.run_id }}
          path: |
            playwright-report/
            test-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  image-security:
    name: Image vulnerability scan and SBOM
    needs: [node, java]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Verify Docker builder
        run: |
          docker version
          docker buildx inspect --bootstrap
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Restore packaged Java services
        uses: actions/download-artifact@v4
        with:
          name: java-service-jars
          path: platform-java/services
      - name: Build, scan, and generate SPDX SBOMs for application images
        run: scripts/ci-image-security.sh
      - name: Validate image security evidence
        run: scripts/validate-image-security-evidence.sh
      - name: Upload image security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-security-${{ github.run_id }}
          path: test-artifacts/image-security/
          if-no-files-found: warn
          retention-days: 30

  # 任务书 #105H C105H-02：数字人 Fake 全量矩阵（opt-in）。与 node/java/e2e/image-security
  # 并列——常规 push/PR 不跑（成本高），workflow_dispatch 勾选 dh-fake 才执行；
  # 未勾选时显式输出 skip 说明（不静默漏跑）。失败保产物并非零退出
  # （scripts/acceptance/ci-e2e-105-all.sh 固定四组 spec，禁 passWithNoTests/skip 全绿）。
  dh-fake:
    name: Digital-human Fake e2e matrix (opt-in)
    needs: [node, java]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Explain opt-in status (never silently skipped)
        run: |
          if [[ "${{ inputs.dh-fake }}" != "true" ]]; then
            echo "dh-fake matrix NOT requested (workflow_dispatch input dh-fake=false)."
            echo "Opt in by re-running this workflow with the 'dh-fake' checkbox enabled."
            exit 1
          fi
          echo "dh-fake matrix requested: 4 specs x 3 engines on the isolated Fake stack."
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - run: npm ci
      - name: Install browser matrix for Playwright
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Restore packaged Java services
        uses: actions/download-artifact@v4
        with:
          name: java-service-jars
          path: platform-java/services
      - name: Run digital-human Fake matrix (workbench/recording/governance/lifecycle x 3 engines)
        env:
          CI: 'true'
          COMPOSE_PROJECT_NAME: grassland-dh-${{ github.run_id }}
          SKIP_JAVA_BUILD: '1'
        run: bash scripts/acceptance/ci-e2e-105-all.sh
      - name: Upload browser and Compose diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dh-fake-artifacts-${{ github.run_id }}
          path: |
            playwright-report/
            test-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  # ─────────────── 任务书 #107-3 C107-24：Hypit CI 分层 ───────────────
  # hypit-contract：常规 push/PR 的轻量契约层——upstream manifest 校验 + B 后端
  # typecheck/test + 部署/入口/全量核销契约测试。相关文件变更才触发。
  hypit-contract:
    name: Hypit contract layer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Upstream manifest verify (V01)
        run: bash scripts/acceptance/verify-107-upstream.sh
      - name: Broker typecheck + tests (V04)
        working-directory: platform-hypit/backend
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Deployment & entrypoint & coverage contracts
        run: npx vitest run tests/deployment/hypit-compose.contract.test.ts tests/deployment/hypit-entrypoint.contract.test.ts tests/deployment/hypit-full-coverage.contract.test.ts

  # hypit-local-e2e：opt-in（workflow_dispatch 勾选 hypit-e2e）——隔离栈 + 真实
  # Node broker + 4 hypit spec × 3 引擎；未勾选显式说明，不静默漏跑。
  hypit-local-e2e:
    name: Hypit local e2e stack (opt-in)
    needs: [node, java]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Explain opt-in status (never silently skipped)
        run: |
          if [[ "${{ inputs.hypit-e2e }}" != "true" ]]; then
            echo "hypit-e2e NOT requested (workflow_dispatch input hypit-e2e=false)."
            echo "Opt in by re-running this workflow with the 'hypit-e2e' checkbox enabled."
            exit 1
          fi
          echo "hypit-e2e requested: 4 hypit specs x 3 engines on the isolated stack (real Node broker)."
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - run: npm ci
      - name: Install browser matrix for Playwright
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Restore packaged Java services
        uses: actions/download-artifact@v4
        with:
          name: java-service-jars
          path: platform-java/services
      - name: Run hypit e2e (entrypoints/clone/recovery/studio x 3 engines)
        env:
          CI: 'true'
          COMPOSE_PROJECT_NAME: grassland-hypit-${{ github.run_id }}
          SKIP_JAVA_BUILD: '1'
        run: bash scripts/acceptance/ci-e2e-107.sh
      - name: Upload browser and Compose diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hypit-e2e-artifacts-${{ github.run_id }}
          path: |
            playwright-report/
            test-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  # hypit-full-local：opt-in（workflow_dispatch 勾选 hypit-full）——镜像构建、
  # 最小真实渲染、恶意组件隔离实跑、备份→新卷恢复演练（V14 完整阶段）。
  hypit-full-local:
    name: Hypit full-local validation (opt-in)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Explain opt-in status (never silently skipped)
        run: |
          if [[ "${{ inputs.hypit-full }}" != "true" ]]; then
            echo "hypit-full NOT requested (workflow_dispatch input hypit-full=false)."
            echo "Opt in by re-running this workflow with the 'hypit-full' checkbox enabled."
            exit 1
          fi
          echo "hypit-full requested: image builds + minimal renders + isolation drill + backup/restore."
      - run: HYPIT_FULL_E2E=1 bash scripts/acceptance/verify-107-full.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hypit-full-artifacts-${{ github.run_id }}
          path: test-artifacts/task-107/C23/
          if-no-files-found: ignore
          retention-days: 14

  # hypit-live：opt-in + secret/预算双闸——只在实际授权的服务上演示；
  # fork PR 不暴露 secret、默认零付费。NOT_RUN 记录不冒充 PASS。
  hypit-live:
    name: Hypit live validation (explicit secrets + budget)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HYPIT_LIVE_ENABLED: ${{ secrets.HYPIT_LIVE_ENABLED }}
      HYPIT_LIVE_BUDGET_CENTS: ${{ secrets.HYPIT_LIVE_BUDGET_CENTS }}
    steps:
      - uses: actions/checkout@v4
      - name: Explain opt-in status (never silently skipped)
        run: |
          if [[ "${{ inputs.hypit-live }}" != "true" ]]; then
            echo "hypit-live NOT requested (workflow_dispatch input hypit-live=false)."
            exit 1
          fi
          if [[ -z "${HYPIT_LIVE_ENABLED}" || -z "${HYPIT_LIVE_BUDGET_CENTS}" ]]; then
            echo "hypit-live requested but HYPIT_LIVE_ENABLED/HYPIT_LIVE_BUDGET_CENTS secrets are absent: live stage recorded NOT_ENABLED (never a silent PASS)."
            exit 1
          fi
          echo "hypit-live requested with budget secrets present."
      - run: bash scripts/acceptance/verify-107-live.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hypit-live-artifacts-${{ github.run_id }}
          path: test-artifacts/task-107/C24/
          if-no-files-found: ignore
          retention-days: 14
