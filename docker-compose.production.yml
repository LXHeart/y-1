# Production application overlay. Kafka and Temporal are external HA services; this file deliberately
# removes local development dependencies and mounts only client credentials into application containers.
x-production-resources: &production-resources
  deploy:
    resources:
      limits:
        cpus: ${PRODUCTION_SERVICE_CPU_LIMIT:-2.0}
        memory: ${PRODUCTION_SERVICE_MEMORY_LIMIT:-2G}
      reservations:
        cpus: ${PRODUCTION_SERVICE_CPU_RESERVATION:-0.25}
        memory: ${PRODUCTION_SERVICE_MEMORY_RESERVATION:-256M}

x-kafka-production: &kafka-production
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?external Kafka bootstrap servers are required}
  KAFKA_SECURITY_PROTOCOL: SASL_SSL
  KAFKA_SASL_MECHANISM: SCRAM-SHA-512
  KAFKA_USERNAME: ${KAFKA_USERNAME:?Kafka username is required}
  KAFKA_PASSWORD: ${KAFKA_PASSWORD:?Kafka password is required}
  KAFKA_SSL_TRUSTSTORE_LOCATION: /run/secrets/grassland/kafka-truststore.p12
  KAFKA_SSL_TRUSTSTORE_PASSWORD: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:?Kafka truststore password is required}
  KAFKA_SSL_TRUSTSTORE_TYPE: PKCS12

x-kafka-volume: &kafka-volume
  type: bind
  source: ${KAFKA_SSL_TRUSTSTORE_FILE:?Kafka truststore file is required}
  target: /run/secrets/grassland/kafka-truststore.p12
  read_only: true

x-temporal-production: &temporal-production
  TEMPORAL_TARGET: ${TEMPORAL_TARGET:?external Temporal frontend is required}
  TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:?Temporal namespace is required}
  TEMPORAL_ENABLE_HTTPS: "true"
  SPRING_TEMPORAL_CONNECTION_MTLS_CERT_CHAIN_FILE: /run/secrets/grassland/temporal-client.crt
  SPRING_TEMPORAL_CONNECTION_MTLS_KEY_FILE: /run/secrets/grassland/temporal-client.key
  SPRING_TEMPORAL_CONNECTION_MTLS_SERVER_NAME: ${TEMPORAL_MTLS_SERVER_NAME:?Temporal TLS server name is required}
  SPRING_TEMPORAL_CONNECTION_MTLS_INSECURE_TRUST_MANAGER: "false"

x-otel-production: &otel-production
  OTEL_TRACING_ENABLED: "true"
  OTEL_EXPORT_ENABLED: "true"
  OTEL_TRACING_SAMPLING_PROBABILITY: ${OTEL_TRACING_SAMPLING_PROBABILITY:?OTel trace sampling probability is required}
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:?OTLP traces endpoint is required}

x-structured-logging: &structured-logging
  # Boot 4.1 原生结构化日志：生产容器 stdout 输出 ECS JSON（Loki/ELK 可直接索引）。
  # service.name 按服务单独设置（各服务 env 内），聚合后可按服务过滤；
  # 本地开发保持人类可读的默认格式（不设此变量）。
  LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs

services:
  frontend:
    <<: *production-resources

  database-bootstrap:
    <<: *production-resources

  release-migrator:
    <<: *production-resources
    profiles: ["release"]

  kafka:
    profiles: [development]

  temporal:
    profiles: [development]

  edge-bff:
    <<: *production-resources
    environment:
      <<: [*otel-production, *structured-logging]
      LOGGING_STRUCTURED_ECS_SERVICE_NAME: edge-bff
      # 任务书 #67:生产关闭 intelligence 冒烟路由(SmokeController 真实消耗平台上游积分,
      # 仅限本地链路验证;production-smoke.sh 不打该前缀,前端零业务调用)。
      EDGE_ROUTE_INTELLIGENCE_SMOKED: "false"

  identity-service:
    <<: *production-resources
    environment:
      <<: [*kafka-production, *otel-production, *structured-logging]
      LOGGING_STRUCTURED_ECS_SERVICE_NAME: identity-service
    volumes:
      - *kafka-volume
    depends_on: !override
      database-bootstrap:
        condition: service_completed_successfully

  marketplace-service:
    <<: *production-resources
    environment:
      <<: [*kafka-production, *temporal-production, *otel-production, *structured-logging]
      LOGGING_STRUCTURED_ECS_SERVICE_NAME: marketplace-service
    volumes:
      - *kafka-volume
      - type: bind
        source: ${TEMPORAL_MTLS_CERT_CHAIN_FILE:?Temporal client certificate is required}
        target: /run/secrets/grassland/temporal-client.crt
        read_only: true
      - type: bind
        source: ${TEMPORAL_MTLS_KEY_FILE:?Temporal client key is required}
        target: /run/secrets/grassland/temporal-client.key
        read_only: true
    depends_on: !override
      database-bootstrap:
        condition: service_completed_successfully

  finance-service:
    <<: *production-resources
    environment:
      <<: [*kafka-production, *otel-production, *structured-logging]
      LOGGING_STRUCTURED_ECS_SERVICE_NAME: finance-service
      # Production must select an explicitly implemented external custodian/PSP
      # adapter. The Java default is sandbox, which is intentionally forbidden here.
      FINANCE_PSP_MODE: ${FINANCE_PSP_MODE:?FINANCE_PSP_MODE is required}
      FINANCE_CREDITS_CENTS_POLICY_VERSION: ${FINANCE_CREDITS_CENTS_POLICY_VERSION:?FINANCE_CREDITS_CENTS_POLICY_VERSION is required}
      FINANCE_CREDITS_CENTS_POLICY_EFFECTIVE_AT: ${FINANCE_CREDITS_CENTS_POLICY_EFFECTIVE_AT:?FINANCE_CREDITS_CENTS_POLICY_EFFECTIVE_AT is required}
      FINANCE_CREDITS_CENTS_POLICY_ROUNDING: ${FINANCE_CREDITS_CENTS_POLICY_ROUNDING:?FINANCE_CREDITS_CENTS_POLICY_ROUNDING is required}
      FINANCE_CREDITS_CENTS_POLICY_CENTS_NUMERATOR: ${FINANCE_CREDITS_CENTS_POLICY_CENTS_NUMERATOR:?FINANCE_CREDITS_CENTS_POLICY_CENTS_NUMERATOR is required}
      FINANCE_CREDITS_CENTS_POLICY_CREDITS_DENOMINATOR: ${FINANCE_CREDITS_CENTS_POLICY_CREDITS_DENOMINATOR:?FINANCE_CREDITS_CENTS_POLICY_CREDITS_DENOMINATOR is required}
      FINANCE_CREDITS_CENTS_POLICY_MAX_CENTS_PER_OPERATION: ${FINANCE_CREDITS_CENTS_POLICY_MAX_CENTS_PER_OPERATION:?FINANCE_CREDITS_CENTS_POLICY_MAX_CENTS_PER_OPERATION is required}
      # ADR-D15 积分 / ADR-D18 现金佣金：生产消费端与金额须显式配置（现金启用前须财务批准；
      # 默认积分路径关闭会静默丢激励事件，故消费端默认 true、金额走 trust 默认/显式注入）。
      FINANCE_JUDGE_REWARD_CONSUMER_ENABLED: ${FINANCE_JUDGE_REWARD_CONSUMER_ENABLED:-true}
    volumes:
      - *kafka-volume
    depends_on: !override
      database-bootstrap:
        condition: service_completed_successfully

  trust-service:
    <<: *production-resources
    environment:
      <<: [*kafka-production, *temporal-production, *otel-production, *structured-logging]
      LOGGING_STRUCTURED_ECS_SERVICE_NAME: trust-service
      # ADR-D15：每票积分默认 20；ADR-D18：每票现金佣金默认 0=关闭——生产启用现金须财务批准后显式注入。
      TRUST_JUDGE_REWARD_CREDITS_PER_VOTE: ${TRUST_JUDGE_REWARD_CREDITS_PER_VOTE:-20}
      TRUST_JUDGE_COMMISSION_CENTS_PER_VOTE: ${TRUST_JUDGE_COMMISSION_CENTS_PER_VOTE:-0}
    volumes:
      - *kafka-volume
      - type: bind
        source: ${TEMPORAL_MTLS_CERT_CHAIN_FILE:?Temporal client certificate is required}
        target: /run/secrets/grassland/temporal-client.crt
        read_only: true
      - type: bind
        source: ${TEMPORAL_MTLS_KEY_FILE:?Temporal client key is required}
        target: /run/secrets/grassland/temporal-client.key
        read_only: true
    depends_on: !override
      database-bootstrap:
        condition: service_completed_successfully

  intelligence-service:
    <<: *production-resources
    environment:
      <<: [*kafka-production, *temporal-production, *otel-production, *structured-logging]
      LOGGING_STRUCTURED_ECS_SERVICE_NAME: intelligence-service
      # 任务书 #58：模型端点/凭据/受信端点收口治理台控制面（/api/admin/ai/*），QWEN_*/AI_SPEECH_*/
      # AI_EMBEDDING_*/受信 origin env 全部移除；生产发布前须在治理台完成「先配后删」（见运行手册）。
      # 任务书 #64 卡2：VIDEO_GENERATION_MODE/BASE_URL/API_KEY/MODEL/CREATE_PATH/POLL_PATH/
      # PRICING_VERSION/UNIT_PRICE_CENTS/WEBHOOK_SECRET 同批移除——视频 provider/凭据/单秒价
      # 全部走治理台 video_generation 行 + 价目表；发布前须在治理台配好（先配后删）。
      AI_PROVIDER_ALLOW_SANDBOX: "false"
      # 平台凭据信封加密落库后，KEK 对 intelligence 由可选变事实必选（决策 E）。
      CRYPTO_KEK_BASE64: ${CRYPTO_KEK_BASE64:?CRYPTO_KEK_BASE64 is required}
      FINANCE_CREDITS_CENTS_POLICY_VERSION: ${FINANCE_CREDITS_CENTS_POLICY_VERSION:?FINANCE_CREDITS_CENTS_POLICY_VERSION is required}
      FINANCE_CREDITS_CENTS_POLICY_EFFECTIVE_AT: ${FINANCE_CREDITS_CENTS_POLICY_EFFECTIVE_AT:?FINANCE_CREDITS_CENTS_POLICY_EFFECTIVE_AT is required}
      FINANCE_CREDITS_CENTS_POLICY_ROUNDING: ${FINANCE_CREDITS_CENTS_POLICY_ROUNDING:?FINANCE_CREDITS_CENTS_POLICY_ROUNDING is required}
      FINANCE_CREDITS_CENTS_POLICY_CENTS_NUMERATOR: ${FINANCE_CREDITS_CENTS_POLICY_CENTS_NUMERATOR:?FINANCE_CREDITS_CENTS_POLICY_CENTS_NUMERATOR is required}
      FINANCE_CREDITS_CENTS_POLICY_CREDITS_DENOMINATOR: ${FINANCE_CREDITS_CENTS_POLICY_CREDITS_DENOMINATOR:?FINANCE_CREDITS_CENTS_POLICY_CREDITS_DENOMINATOR is required}
      FINANCE_CREDITS_CENTS_POLICY_MAX_CENTS_PER_OPERATION: ${FINANCE_CREDITS_CENTS_POLICY_MAX_CENTS_PER_OPERATION:?FINANCE_CREDITS_CENTS_POLICY_MAX_CENTS_PER_OPERATION is required}
      AI_CREDIT_USAGE_SETTLEMENT_ENABLED: "true"
    volumes:
      - *kafka-volume
      - type: bind
        source: ${TEMPORAL_MTLS_CERT_CHAIN_FILE:?Temporal client certificate is required}
        target: /run/secrets/grassland/temporal-client.crt
        read_only: true
      - type: bind
        source: ${TEMPORAL_MTLS_KEY_FILE:?Temporal client key is required}
        target: /run/secrets/grassland/temporal-client.key
        read_only: true
    depends_on: !override
      database-bootstrap:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
